# 20_News Nginx 配置
# 功能：反向代理 + TLS + 静态资源分发 + 限流

worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 50M;                # 广告素材上传限制（50MB）

    # 限流 zone（C 端 60 req/min/IP）
    limit_req_zone $binary_remote_addr zone=c_api:10m rate=60r/m;
    # B 端限流（120 req/min/IP）
    limit_req_zone $binary_remote_addr zone=b_api:10m rate=120r/m;

    # 上游 FastAPI 应用
    upstream fastapi_app {
        server app:8000;
        keepalive 32;
    }

    # HTTP → HTTPS 重定向
    server {
        listen 80;
        server_name api.example.com;
        return 301 https://$host$request_uri;
    }

    # HTTPS 主服务
    server {
        listen 443 ssl http2;
        server_name api.example.com;

        # TLS 证书（Let's Encrypt 或自签）
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # C 端 API
        location /api/v1/ {
            limit_req zone=c_api burst=20 nodelay;
            proxy_pass http://fastapi_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # B 端 API
        location /admin/api/v1/ {
            limit_req zone=b_api burst=40 nodelay;
            proxy_pass http://fastapi_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # 内部工作流接口（仅允许 localhost）
        location /api/internal/ {
            allow 127.0.0.1;
            allow 172.16.0.0/12;              # Docker 内网
            deny all;
            proxy_pass http://fastapi_app;
            proxy_set_header Host $host;
            proxy_set_header X-Internal-Sign $http_x_internal_sign;  # HMAC 签名校验
        }

        # 健康检查（不限流）
        location /api/health {
            proxy_pass http://fastapi_app;
            access_log off;
        }

        # B 端运营后台静态资源（Vue 构建产物）
        location /admin/ {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /admin/index.html;
            expires 1h;
        }

        # 静态资源缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }
}
