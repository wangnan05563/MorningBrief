<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon 图标集：覆盖浏览器标签、书签收藏、iOS/Android 主屏、PWA -->
    <!-- SVG 优先（现代浏览器支持矢量缩放），ICO 兼容老浏览器 -->
    <!-- 用相对路径而非 / 绝对路径：Vite base='/news/' 时会自动加前缀，避免 404 -->
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon-32x32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="./favicon-16x16.png" sizes="16x16" type="image/png" />
    <!-- iOS 添加到主屏幕时的图标（180x180，iOS 会自动加圆角） -->
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <!-- PWA 清单：Android 主屏 + 启动屏 + 主题色 -->
    <link rel="manifest" href="./site.webmanifest" />
    <!-- 主题色：浏览器地址栏配色（移动端） -->
    <meta name="theme-color" content="#5BC0BE" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MorningBrief 运营后台</title>
  </head>
  <body>
    <!-- T00827：桌面端启动画面（splash）。内联样式独立于构建产物，HTML 解析即渲染，
         避免"点开页面后短暂白屏/无反馈"；进度由 main.js 按真实初始化阶段驱动，
         后端就绪（/news/api/health/ready）后淡出移除。 -->
    <div id="app-splash" aria-hidden="true">
      <div class="app-splash__inner">
        <img class="app-splash__logo" src="./favicon.svg" alt="MorningBrief" />
        <div class="app-splash__name">MorningBrief</div>
        <div class="app-splash__track">
          <div id="app-splash-bar" class="app-splash__bar" style="width: 10%"></div>
        </div>
        <div id="app-splash-text" class="app-splash__text">正在加载应用资源…</div>
      </div>
      <style>
        #app-splash {
          position: fixed;
          inset: 0;
          z-index: 99999;
          display: flex;
          align-items: center;
          justify-content: center;
          background: #ffffff;
          transition: opacity 0.4s ease;
        }
        #app-splash.app-splash--done {
          opacity: 0;
          pointer-events: none;
        }
        .app-splash__inner {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 14px;
          max-width: 320px;
          text-align: center;
        }
        .app-splash__logo {
          width: 64px;
          height: 64px;
        }
        .app-splash__name {
          font-size: 20px;
          font-weight: 600;
          color: #1f2d3d;
          letter-spacing: 1px;
        }
        .app-splash__track {
          width: 220px;
          height: 6px;
          border-radius: 3px;
          background: #eef2f6;
          overflow: hidden;
        }
        .app-splash__bar {
          height: 100%;
          border-radius: 3px;
          background: #5bc0be;
          transition: width 0.35s ease;
        }
        .app-splash__text {
          font-size: 13px;
          color: #909399;
        }
      </style>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
