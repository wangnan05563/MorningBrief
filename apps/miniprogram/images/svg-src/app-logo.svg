<?xml version="1.0" encoding="UTF-8"?>
<!-- MorningBrief 应用 logo：耳机 + 中央声波，体现"语音播报"
     设计语言：与 headphones.svg 一致（viewBox 64x64，品牌青绿色，透明背景）
     差异：耳机弧线内新增三线递增声波，强化"正在播报"语义
     用途：关于页 app-logo（替换 headphones.png）、开屏页 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- 耳机头梁弧线 -->
  <path
    d="M 12 36 C 12 22 22 12 32 12 C 42 12 52 22 52 36"
    fill="none" stroke="#7ECEC1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 耳机左罩 -->
  <rect x="10" y="36" width="8" height="14" rx="3" ry="3" fill="#7ECEC1"/>
  <!-- 耳机右罩 -->
  <rect x="46" y="36" width="8" height="14" rx="3" ry="3" fill="#7ECEC1"/>
  <!-- 中央声波：三线递增，象征正在播报 -->
  <line x1="28" y1="26" x2="28" y2="34" stroke="#5BC0BE" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="22" x2="32" y2="38" stroke="#5BC0BE" stroke-width="2" stroke-linecap="round"/>
  <line x1="36" y1="26" x2="36" y2="34" stroke="#5BC0BE" stroke-width="2" stroke-linecap="round"/>
</svg>
