# SonarQube 项目配置 - MorningBrief
# 由 sonarqube-mcp 技能生成，用于 sonar-scanner CLI 扫描

sonar.projectKey=20_news
sonar.projectName=20 News
sonar.projectVersion=1.0

# 源码根目录
sonar.sources=backend/app,admin-web/src,miniprogram,scf

# 测试目录（不计入覆盖率 denominator 之外的质量问题，但仍会被扫描）
sonar.tests=backend/tests,admin-web/tests

# 语言分隔的源码
sonar.python.version=3.12

# 排除：技能文件、依赖、构建产物、缓存、第三方库
sonar.exclusions=**/.trae/**,**/node_modules/**,**/__pycache__/**,**/dist/**,**/build/**,**/.cache/**,**/*.min.js,**/*.min.css,**/playwright-report/**,**/test-results/**,**/package-lock.json,**/news.db*,**/*.log

# 测试文件中只扫描安全性问题，忽略样式问题
sonar.coverage.exclusions=**/tests/**,**/__tests__/**,**/test-results/**

# 编码
sonar.sourceEncoding=UTF-8

# SCM
sonar.scm.mode=auto

# 忽略部分不适用于本项目的规则
# （在 SonarQube Web UI 中配置，此处不列出）
