<?xml version="1.0" encoding="UTF-8"?>
<!-- tabBar "历史" 选中态：圆角方形薄荷青到蜜桃粉渐变背景 + 白色时钟图标
     图标来源：Tabler Icons (MIT License) - clock 图标 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgHistory" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD3E0"/>
      <stop offset="100%" stop-color="#FF9AA2"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" ry="16" fill="url(#bgHistory)"/>
  <g stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="32" cy="32" r="14"/>
    <polyline points="32 22 32 32 40 36"/>
  </g>
</svg>
