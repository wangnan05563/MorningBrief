# 20_News Redis 配置
# 优化点：内存上限、淘汰策略、持久化

# 内存
maxmemory 1gb
maxmemory-policy allkeys-lru           # LRU 淘汰（缓存场景）

# 持久化（RDB + AOF 混合）
save 900 1
save 300 10
save 60 10000
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec                   # 每秒刷盘

# 网络
bind 0.0.0.0
protected-mode yes
port 6379

# 日志
loglevel notice
logfile ""

# 超时
timeout 300
tcp-keepalive 60
