# 20_News 单机部署编排（V1.4 极简版，4 容器）
# 部署位置：单机 PC 应用根目录
# 启动：docker-compose up -d
# 注意：PowerShell 不支持 && 串联命令，分步执行

services:
  # ---- Nginx 反向代理 ----
  nginx:
    image: nginx:1.25
    container_name: news_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # TLS 证书与 B 端静态资源目录（MVP 暂不挂载，待有证书/前端构建产物后启用）
      # - ./nginx/ssl:/etc/nginx/ssl:ro
      # - ./admin-web/dist:/usr/share/nginx/html/admin:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - news_net

  # ---- FastAPI 单体应用 ----
  # 业务服务 + APScheduler + 工作流模块（爬虫/LLM/TTS/拼接）同进程
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: news_app
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app                                        # 开发模式热重载，生产改为 COPY
      - ./logs:/app/logs
      - ./data/audio_cache:/app/audio_cache               # 音频临时文件
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - news_net

  # ---- MySQL 8.0 ----
  mysql:
    image: mysql:8.0
    container_name: news_mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro    # 建库 + 授权
      - ./mysql/schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro # 建表（11 张表）
      - ./mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro                      # 自定义配置
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - news_net

  # ---- Redis 7 ----
  redis:
    image: redis:7
    container_name: news_redis
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - news_net

networks:
  news_net:
    driver: bridge
