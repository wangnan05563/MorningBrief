# MorningBrief 项目 CI 流水线
# 触发：push / PR 到 main 分支
# 三个 job：backend-test、frontend-build-test、pyinstaller-build
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ==========================================================================
  # Job 1: 后端测试
  # 依赖 conftest.py 中的 stub 机制绕过 CI 环境可能缺失的第三方库
  # ==========================================================================
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 缓存 pip 依赖
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 安装后端依赖
        # conftest.py 顶部已用 sys.modules.setdefault 为 ahocorasick /
        # feedparser / openai / qcloud_cos / jieba 注入 stub，真实包安装失败也不阻塞 import，
        # 因此无需额外处理步骤，直接安装即可
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio aiosqlite

      - name: 运行后端测试
        run: cd backend && python -m pytest tests/ -v --tb=short

      - name: 上传测试报告
        # 可选：当前未启用 pytest-html，无文件时不报错
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/test-results/
          if-no-files-found: ignore

  # ==========================================================================
  # Job 2: 前端构建与 E2E 测试
  # 构建 admin-web 并运行 Playwright E2E 测试
  # ==========================================================================
  frontend-build-test:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 缓存 npm 依赖
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('admin-web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: 安装前端依赖
        # 使用 npmmirror 镜像，规避默认 registry 在 CI 环境的偶发配置问题
        run: cd admin-web && npm ci --registry=https://registry.npmmirror.com

      - name: 构建前端
        run: cd admin-web && npm run build

      - name: 安装 Playwright 浏览器
        run: cd admin-web && npx playwright install --with-deps chromium

      - name: 运行 E2E 测试
        # playwright.config.js 已配置 screenshot: only-on-failure，
        # 失败截图自动落入 test-results/ 目录，无需额外步骤
        run: cd admin-web && npx playwright test

      - name: 上传 Playwright 报告
        # always() 保证测试失败时也能拿到报告用于排查
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: admin-web/playwright-report/
          retention-days: 7

  # ==========================================================================
  # Job 3: PyInstaller 打包验证
  # 仅 push 到 main（非 PR）时触发，验证 MorningBrief.spec 能正确打包
  # V1.2 起从 Docker 部署改为单机 exe（PyInstaller + Inno Setup）
  # ==========================================================================
  pyinstaller-build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装后端依赖
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pyinstaller

      - name: PyInstaller 打包验证
        # 验证 MorningBrief.spec 能正常打包（不签名、不生成安装包）
        run: pyinstaller MorningBrief.spec --noconfirm

      - name: 验证产物存在
        # COLLECT 模式产物在 dist/MorningBrief/MorningBrief.exe
        run: Test-Path dist/MorningBrief/MorningBrief.exe
        shell: powershell
