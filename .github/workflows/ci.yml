# MorningBrief 项目 CI 流水线
# 触发：push / PR 到 main 分支
# 四个 job：backend-test、frontend-build-test、miniprogram-check、pyinstaller-build
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ==========================================================================
  # Job 1: 后端测试
  # 依赖 conftest.py 中的 stub 机制绕过 CI 环境可能缺失的第三方库
  # ==========================================================================
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 缓存 pip 依赖
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 安装后端依赖
        # conftest.py 顶部已用 sys.modules.setdefault 为 ahocorasick /
        # feedparser / openai / qcloud_cos / jieba 注入 stub，真实包安装失败也不阻塞 import，
        # 因此无需额外处理步骤，直接安装即可
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio aiosqlite

      - name: 运行后端测试
        run: cd backend && python -m pytest tests/ -v --tb=short

      - name: 上传测试报告
        # 可选：当前未启用 pytest-html，无文件时不报错
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/test-results/
          if-no-files-found: ignore

  # ==========================================================================
  # Job 2: 前端构建与 E2E 测试
  # 构建 admin-web 并运行 Playwright E2E 测试
  # ==========================================================================
  frontend-build-test:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 缓存 npm 依赖
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('apps/admin-web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: 安装前端依赖
        # 使用 npmmirror 镜像，规避默认 registry 在 CI 环境的偶发配置问题
        run: cd apps/admin-web && npm ci --registry=https://registry.npmmirror.com

      - name: 构建前端
        run: cd apps/admin-web && npm run build

      - name: 运行管理端单元测试
        # T02515：tests/unit/*.test.mjs 是 node --test 纯逻辑/契约用例（不依赖浏览器），
        # 卡在 E2E 之前跑——E2E 要装 chromium、单测 2.5s 就能判红，先便宜后贵。
        # 之前只有本地 `npm run test:unit` 手动跑，跨端超时契约（前端 130s / 后端 120s）
        # 改值不会被 CI 拦住，等于门禁只存在于开发者机器上。
        run: cd apps/admin-web && node --test tests/unit/*.test.mjs

      - name: 安装 Playwright 浏览器
        run: cd apps/admin-web && npx playwright install --with-deps chromium

      - name: 运行 E2E 测试
        # playwright.config.js 已配置 screenshot: only-on-failure，
        # 失败截图自动落入 test-results/ 目录，无需额外步骤
        run: cd apps/admin-web && npx playwright test

      - name: 上传 Playwright 报告
        # always() 保证测试失败时也能拿到报告用于排查
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/admin-web/playwright-report/
          retention-days: 7

  # ==========================================================================
  # Job 3: 小程序底部导航门禁与纯逻辑单测（T02510 / FR-UX-601）
  # 小程序没有 package.json、也不参与 npm 构建，但它的底部导航错法全部是静默的：
  # 缺 tab 文案只是不显示字、死方法只是点不到、入口藏进登录分支只是看不到——
  # 运行时没有任何异常可捕获，只有构建期静态门禁能拦住（口径对齐 admin-web 的 validate-nav）。
  # 因此这里跑「门禁 + 门禁自测 + utils 单测」，不依赖微信开发者工具。
  # ==========================================================================
  miniprogram-check:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 底部导航一致性门禁
        # 校验 tabBar 文案/图标/路由三件套、角标挂载点与 tab 顺序的绑定、
        # 死入口 / 死路由键 / 合规入口是否藏在条件分支里
        run: node apps/miniprogram/scripts/validate-tabbar.mjs

      - name: 页面职责与文案一致性门禁（FR-UX-604）
        # T02513：校验「界面上的话」与「代码里做的事」是否还互相对应——
        # 频道页页名与订阅/偏爱两页的对照说明、跨页切换契约的写侧与读侧、取消收藏可见入口、
        # 清除缓存确认文案 ↔ KEEP_KEYS、隐私条款承诺 ↔ 真实开关三处接线、浮条纠偏的两个时机。
        # 这类错在运行时全部静默，只能构建期拦。
        run: node apps/miniprogram/scripts/validate-ux604.mjs

      - name: 运行小程序单元测试
        # 纯 node:test，零第三方依赖；含门禁自测（证明门禁真的会红）与 tab-badge 口径测试
        run: cd apps/miniprogram && node --test tests/*.test.js tests/*.test.mjs

  # ==========================================================================
  # Job 4: PyInstaller 打包验证
  # 仅 push 到 main（非 PR）时触发，验证 MorningBrief.spec 能正确打包
  # V1.2 起从 Docker 部署改为单机 exe（PyInstaller + Inno Setup）
  # ==========================================================================
  pyinstaller-build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装后端依赖
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pyinstaller

      - name: PyInstaller 打包验证
        # 验证 MorningBrief.spec 能正常打包（不签名、不生成安装包）
        run: pyinstaller MorningBrief.spec --noconfirm

      - name: 验证产物存在
        # COLLECT 模式产物在 dist/MorningBrief/MorningBrief.exe
        run: Test-Path dist/MorningBrief/MorningBrief.exe
        shell: powershell
