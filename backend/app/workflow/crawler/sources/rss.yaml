# RSS 数据源配置
# 新增源只需追加条目，无需改代码
# authority: 源权威度（0.0-1.0），用于热度公式计算（权重 0.3）
# category_hint: RSS channel 标签缺失时的默认品类
# qps: 单源 QPS 限制预留配置（默认 1，遵守 robots.txt）
#      注意：当前 crawler 未实现单源限速，qps 仅作文档预留；
#      实际限速由 httpx 连接池 + 单源串行抓取隐式保证
#
# 全部源已通过可达性验证（2026-07-17，5 轮全网搜索 + 实测）：
# - 央媒 RSS（人民网/中新网）稳定可达，覆盖全品类
# - 国内商业媒体原生 RSS 可达（少数派/InfoQ/IT之家/奇客Solidot/小众软件/异次元等）
# - 国内技术团队博客原生 RSS 可达（美团/有赞/酷壳/HelloGitHub/V2EX/月光博客/云风/离别歌/风雪之隅）
# - 游戏媒体原生 RSS 可达（机核/触乐/17173/游研社）
# - plink.anyfeeder.com 转换服务：可达微信公众号/外媒中文版（澎湃/华尔街见闻/CSDN/华尔街日报/联合早报/极客公园等）
# - 已移除全部 rsshub.app 源（该公共实例在大陆被 DNS 污染 + TCP 阻断）
# - 已移除无原生 RSS 的站点（新华网/36氪原生/虎嗅原生/豆瓣等返回 404/HTML/WAF）
# - 已移除 plink 失效源（联合早报-国际/财新网/新智元/果壳网 实测 0 条目）
#
# 稳定性说明：
# - 人民网/中新网/原生 RSS：稳定性高，作为频道基础源
# - plink.anyfeeder.com：第三方转换服务，对并发敏感（并发≥5 时部分源返回 0 条目）
#   生产环境单源串行抓取无问题；单源失败由 crawler 隔离不影响其他源

