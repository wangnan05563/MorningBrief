# 全局配置
global:
  timeout_sec: 30            # 单源请求超时
  retry: 2                   # 单源失败重试次数
  user_agent: "MorningBriefBot/1.0 (+https://github.com/xxx/MorningBrief)"
  respect_robots_txt: true   # 遵守 robots.txt
