# ===== Logs Review 鎶€鑳介厤缃ず渚?=====
# 棣栨浣跨敤锛氬鍒舵湰鏂囦欢涓?config.yaml 骞舵寜椤圭洰瀹為檯鎯呭喌淇敼
# 鎵€鏈変笟鍔″弬鏁板潎鍦ㄦ鏂囦欢绠＄悊锛屾妧鑳芥湰韬笉鍚‖缂栫爜鍊?# 閰嶇疆浼樺厛绾э細鐜鍙橀噺 > config.yaml > 鏈枃浠堕粯璁ゅ€?
# --- 鏃ュ織婧愰厤缃?---
logs:
  # 褰撳墠鏃ュ織鏂囦欢璺緞锛堝繀濉紝鎸夐」鐩疄闄呮棩蹇楁枃浠跺悕淇敼锛?  current_log: "logs/app.log"
  # 鍩虹嚎鏃ュ織鏂囦欢璺緞锛堢敤浜庡閲忓姣旓紝鐣欑┖鍒欏叏閲忔ā寮忥級
  baseline_log: "logs/app.baseline.log"
  # 鏃ュ織鏍煎紡锛歴tructured锛圝SON锛墊 plaintext | mixed
  log_format: "mixed"
  # 鏃ュ織鏂囦欢缂栫爜
  encoding: "utf-8"
  # 鏃ュ織杞浆绛栫暐锛氱敤浜庤嚜鍔ㄥ畾浣嶆渶鏂版棩蹇楁枃浠?  # none锛堟棤杞浆锛墊 size锛堟寜澶у皬锛墊 time锛堟寜鏃堕棿锛墊 numbered锛堢紪鍙凤級
  rotate_policy: "size"
  # severity 璇嗗埆姝ｅ垯锛坙og_format=plaintext/mixed 鏃朵娇鐢級
  # 蹇呴』鍖呭惈鍛藉悕鍒嗙粍锛歵imestamp, severity, module, message
  # log_format=structured 鏃舵椤瑰拷鐣ワ紙浠?JSON 瀛楁 severity_field 璇诲彇锛?  severity_pattern: "(?P<timestamp>\\d{4}-\\d{2}-\\d{2}.*?)\\s+(?P<severity>WARNING|ERROR|CRITICAL)\\s+(?P<module>[^:]+):\\s+(?P<message>.*)"
  # structured 鏃ュ織鐨?severity 瀛楁鍚?  severity_field: "severity"
  # 杞浆鏂囦欢鍛藉悕妯″紡锛堢敤浜庤嚜鍔ㄥ畾浣嶆渶鏂版棩蹇楁枃浠讹紝鎸変紭鍏堢骇鍖归厤锛?  # 鎸夐」鐩疄闄呰疆杞鍒欒皟鏁达紝浠ヤ笅涓哄父瑙佹ā寮忕ず渚?  rotate_patterns:
    - "app.log.\\d+"        # app.log.1, app.log.2锛坣umbered锛?    - "app.\\d+.log"        # app.1.log, app.2.log锛坣umbered 鍙樹綋锛?    - "app-\\d{8}.log"      # app-20260703.log锛坱ime 鎸夊ぉ锛?    - "app.log.\\d{8}"      # app.log.20260703锛坱ime 鍙樹綋锛?  # 缂栫爜 fallback 鍒楄〃锛堜富缂栫爜澶辫触鏃舵寜搴忓皾璇曪級
  encoding_fallback:
    - "utf-8"
    - "gbk"
    - "latin-1"

# --- 鏃ュ織杩囨护閰嶇疆 ---
filter:
  # 鍏虫敞鐨?severity 鍒楄〃锛堟寜椤圭洰鏃ュ織鏍煎紡璋冩暣锛?  severities:
    - WARNING
    - ERROR
    - CRITICAL
  # 蹇界暐鐨勬棩蹇?message 姝ｅ垯鍒楄〃锛堝懡涓垯璺宠繃锛?  ignore_patterns:
    - "DeprecationWarning"
    - "PerformanceWarning"
  # 蹇界暐鐨勬ā鍧楀悕鍒楄〃锛堟寜鏃ュ織涓殑 module 瀛楁鍖归厤锛?  ignore_modules: []
  # 鏄惁鎸?message 妯℃澘鍘婚噸锛堜繚鐣欏嚭鐜版鏁帮級
  # 鍘婚噸鏃朵細灏嗗姩鎬佸瓧娈碉紙task_id銆佹椂闂存埑銆佹暟瀛楋級鏇挎崲涓哄崰浣嶇鍚庡啀鑱氬悎
  deduplicate: true
  # 鍔ㄦ€佸瓧娈垫鍒欏垪琛紙鍘婚噸鏃舵浛鎹负 {*} 鍗犱綅绗︼級
  # 鐢ㄤ簬鎶?"task=abc123" 鍜?"task=def456" 瑙嗕负鍚屼竴妯℃澘
  dedup_normalize_patterns:
    - "task[_=]\\s*[\\w-]+"
    - "\\b\\d{4}-\\d{2}-\\d{2}.*?\\d{2}:\\d{2}:\\d{2}\\b"
    - "\\b[\\da-f]{8,}\\b"

# --- 鍓綔鐢ㄨ瘑鍒厤缃紙鍖哄垎鍣０涓庣湡闂锛?--
# 閫氳繃 message 鍐呭鍖归厤鍒ゆ柇鏃ュ織鏄惁鏈夊疄闄呬笟鍔″壇浣滅敤
# 鍛戒腑 harmful 鈫?鐪熼棶棰橈紙浼樺厛绾?high锛夛紱鍛戒腑 harmless 鈫?鍣０锛堜紭鍏堢骇 low锛?side_effect:
  # 鏈夊壇浣滅敤鐨?message 妯″紡锛堝懡涓垯瑙嗕负鐪熼棶棰樿€岄潪鍣０锛?  harmful_patterns:
    - pattern: "(?i)(expired|invalid|failed).*(pause|break|stop|abort)"
      message: "鐘舵€佸け鏁堝鑷翠笟鍔′腑鏂?
      type_hint: "state_check"
    - pattern: "(?i)(timeout|retry_failed).*(abort|give_up|exhausted)"
      message: "閲嶈瘯鑰楀敖瀵艰嚧鏀惧純"
      type_hint: "retry_failure"
    - pattern: "(?i)(data\\s*loss|inconsistent|corrupt)"
      message: "鏁版嵁涓€鑷存€ч闄?
      type_hint: "state_check"
  # 鏃犲壇浣滅敤鐨?message 妯″紡锛堣涓哄櫔澹帮級
  harmless_patterns:
    - pattern: "(?i)(deprecated|warning).*(continue|skip|ignore)"
      message: "鍛婅浣嗘祦绋嬬户缁?
      type_hint: "warning_noise"
    - pattern: "(?i)(retrying|retry_attempt).*(succeed|ok)"
      message: "閲嶈瘯鍚庢垚鍔?
      type_hint: "warning_noise"
  # 鎬ц兘闂鐨?message 妯″紡锛堥渶鍖呭惈鏁板€奸槇鍊硷級
  performance_patterns:
    - pattern: "(?i)(slow|elapsed|duration|took).*?(\\d+)\\s*ms"
      threshold_ms: 1000
      type_hint: "performance"
    - pattern: "(?i)(batch|bulk).*(missing|absent|none)"
      message: "缂哄皯鎵瑰鐞?
      type_hint: "performance"
  # 鏈懡涓换浣曟ā寮忔椂鐨勯粯璁や紭鍏堢骇锛堟寜 severity 鏄犲皠锛?  default_priority_by_severity:
    CRITICAL: "high"
    ERROR: "high"
    WARNING: "medium"

# --- 鍒嗙被褰掑洜閰嶇疆 ---
classify:
  # 鏄惁鎸夋ā鍧楀垎缁?  by_module: true
  # 鏄惁鎸?severity 鎺掑簭
  by_severity: true
  # 楂橀闃堝€硷細鍑虹幇娆℃暟瓒呰繃姝ゅ€艰涓洪珮棰戦棶棰?  frequency_threshold: 5
  # 棰戠巼缁熻鏃堕棿绐楀彛锛堝垎閽燂級
  time_window_minutes: 30
  # 楂橀浣嗘棤鍓綔鐢ㄦ椂鑷姩闄嶇骇涓哄櫔澹扮殑绛栫暐
  # true: 楂橀 + 鏈懡涓?harmful_patterns 鈫?warning_noise
  # false: 楂橀浠嶆寜鍘熺被鍨嬪鐞?  auto_downgrade_high_freq_noise: true

# --- 淇绛栫暐鏄犲皠锛堟寜 4 澶ч棶棰樼被鍨嬶級---
# 绛栫暐鍙€夛細
# warning_noise:  merge_logs锛堝悎骞舵棩蹇楋級| reduce_frequency锛堥檷浣庨鐜囷級| skip
# state_check:    add_precondition锛堝鍔犲墠缃鏌ワ級| add_cooldown锛堝鍔犲喎鍗达級| skip
# retry_failure:  add_retry锛堝鍔犻噸璇曪級| add_backoff锛堥€€閬块噸璇曪級| skip
# performance:    add_timing锛堝鍔犺鏃讹級| batch_process锛堟壒澶勭悊锛墊 add_cache锛堢紦瀛橈級| skip
# custom:         浠?custom_prompts 璇诲彇鎸囦护
strategies:
  warning_noise: reduce_frequency
  state_check: add_precondition
  retry_failure: add_retry
  performance: add_timing
  # 鑷畾涔夌瓥鐣ユ寚浠わ紙褰撲笂杩扮瓥鐣ヤ负 custom 鏃朵娇鐢級
  custom_prompts:
    - type: "warning_noise"
      prompt: ""
    - type: "state_check"
      prompt: ""
    - type: "retry_failure"
      prompt: ""
    - type: "performance"
      prompt: ""

# --- 骞惰淇閰嶇疆 ---
parallel:
  # 鏄惁鍚敤骞惰瀛愪唬鐞?  enabled: true
  # 瀛愪唬鐞嗘暟閲忥紙CI 鐜寤鸿闄嶄綆涓?2锛?  agents: 4
  # 姣忎釜瀛愪唬鐞嗗鐞嗙殑鏂囦欢鏁?  files_per_agent: 5
  # 鍚屼竴鏂囦欢鍐呭涓棶棰樻槸鍚︿覆琛屽鐞嗭紙閬垮厤 Edit 鍐茬獊锛?  same_file_serial: true
  # 鍗曟杩愯鏈€澶т慨澶嶆暟锛堥伩鍏嶄竴娆′慨澶嶅お澶氬鑷村啿绐侊級
  max_fix_per_run: 30
  # 涓茶闃堝€硷細闂鏁?<= 姝ゅ€兼椂涓讳唬鐞嗕覆琛屽鐞嗭紙閬垮厤瀛愪唬鐞嗗惎鍔ㄥ紑閿€锛?  # 鍘嗗彶缁忛獙锛? 涓棶棰樹覆琛屽鐞嗘瘮 4 涓瓙浠ｇ悊骞惰鏇撮珮鏁?  serial_threshold: 5
  # 璺ㄦā鍧椾緷璧栫粍锛堝悓缁勫唴鐨勬枃浠跺繀椤讳覆琛屽鐞嗭紝閬垮厤鐘舵€佷緷璧栧啿绐侊級
  # 鎸夐」鐩疄闄呬緷璧栧叧绯诲～鍐欙紝浠ヤ笅涓虹ず渚嬬粨鏋?  dependency_groups:
    - name: "scheduler_api"
      files:
        - "src/<package>/modules/scheduler.py"
        - "src/<package>/web/routes/api_tasks.py"
    - name: "collector_search"
      files:
        - "src/<package>/modules/collector.py"
        - "src/<package>/modules/_search.py"
    - name: "kb_embedding"
      files:
        - "src/<package>/modules/chatbot/kb_manager.py"
        - "src/<package>/modules/local_embedding.py"

# --- 楠岃瘉闂幆閰嶇疆 ---
verify:
  # 淇鍚庢槸鍚﹂噸鏂伴噰闆嗘棩蹇楅獙璇?  recheck_logs: true
  # 閲嶆柊閲囬泦鍓嶇殑鍐峰嵈鏃堕棿锛堢锛岃鏈嶅姟浜х敓鏂版棩蹇楋級
  cooldown_seconds: 300
  # 淇鍚庢槸鍚﹁繍琛屾祴璇?  run_tests: true
  # 娴嬭瘯鍛戒护锛圥owerShell 鐢?; 鍒嗛殧锛屼笉鏀寔 &&锛?  test_command: "pytest tests/ ; npm --prefix frontend test"
  # 鏄惁闅旂棰勫瓨娴嬭瘯澶辫触锛堝彧鍏虫敞鏂板澶辫触锛?  isolate_preexisting_failures: true
  # 鍙戠幇鏂?WARNING 鏃舵槸鍚﹀け璐?  fail_on_new_warnings: true
  # 娴嬭瘯鍓綔鐢ㄦ鏌ワ細淇鏄惁寮曞叆鏂扮殑娴嬭瘯澶辫触妯″紡
  # 鍘嗗彶鏁欒锛歅0-鈶?Cookie 鏍￠獙瀵艰嚧娴嬭瘯 ResumeBlockedError銆丗akeDedup async 鎺╃洊 await 鍚屾鏂规硶 bug
  check_test_side_effects: true
  # 娴嬭瘯鍓綔鐢ㄦā寮忥紙鍛戒腑鍒欐姤鍛?淇鍙兘寮曞叆娴嬭瘯鍓綔鐢?锛?  test_side_effect_patterns:
    - "ResumeBlockedError"
    - "TypeError.*coroutine.*has no"
    - "RuntimeError.*loop closed"
    - "coroutine.*was never awaited"
    - "unexpected keyword argument"
  # 娴嬭瘯鍛戒护鎵ц瓒呮椂锛堢锛岃秴鏃跺垯鎶ュ憡浣嗕笉缁堟锛?  test_timeout_seconds: 600
  # 浠ｇ爜璇勫楠岃瘉锛氫慨澶嶅悗鏄惁瑙﹀彂 backend/frontend code-review 鎶€鑳?  # true: 淇鍚庡缓璁敤鎴疯Е鍙?code-review 鎶€鑳?  # false: 浠呬緷璧栨祴璇曞拰鏃ュ織閲嶉噰闆嗛獙璇?  trigger_code_review: true

# --- 鎶ュ憡閰嶇疆 ---
report:
  # 鎶ュ憡杈撳嚭鐩綍
  output_dir: "docs/logs-reports/"
  # 鏄惁鍖呭惈鏈慨澶嶉」
  include_unfixed: true
  # 鎶ュ憡鏍煎紡
  format: "markdown"
  # 鎶ュ憡璇︾粏绋嬪害锛歴ummary锛堢簿绠€锛屼粎淇娓呭崟+楠岃瘉缁撴灉+纭害鏉燂級| detailed锛堝畬鏁?7 鑺傛姤鍛婏級
  # summary 閫傚悎甯歌杩唬鍦烘櫙鑺傜渷 token锛沝etailed 閫傚悎鍙戝竷鍓嶈川閲忛棬绂?  detail_level: "detailed"
  # 鑴辨晱瀛楁瑙勫垯锛堟鍒欏尮閰嶅苟鏇挎崲涓烘寚瀹氬唴瀹癸級
  # 鎶ュ憡鐢熸垚鏃跺鏃ュ織鎽樿鍜屼慨澶嶅唴瀹瑰簲鐢ㄨ繖浜涜鍒?  redact_patterns:
    - pattern: "(?i)(token|password|secret|api_key|send_key)\\s*[:=]\\s*\\S+"
      replacement: "\\1=***"
    - pattern: "\\b[\\da-f]{32,}\\b"
      replacement: "***"
    - pattern: "SCT-\\w+"
      replacement: "SCT-***"
    - pattern: "(?i)bearer\\s+[\\w.]+"
      replacement: "bearer ***"

# --- 纭害鏉熸鏌ワ紙鍙墿灞曪級---
# 姣忔潯瑙勫垯浼氭寜 scan_scope 鍐冲畾鐨勮寖鍥存壂鎻忥紝杩濊浼氬啓鍏ユ姤鍛?hard_constraints:
  # 鎵弿鑼冨洿锛歮odified_only锛堜粎鎵弿 Phase 4 淇敼杩囩殑鏂囦欢锛岃妭鐪?token锛墊 full锛堟壂鎻忔暣涓唬鐮佸簱锛?  # modified_only 閫傚悎甯歌杩唬锛沠ull 閫傚悎鍙戝竷鍓嶅叏闈㈡鏌?  scan_scope: "modified_only"
  rules:
    - name: "no_hardcoded_credentials"
      pattern: "(password|secret|token|api_key|access_key)\\s*[:=]\\s*['\"][^'\"]{8,}['\"]"
      message: "妫€娴嬪埌纭紪鐮佸嚟鎹紝璇蜂粠鐜鍙橀噺鎴?.env 鏂囦欢璇诲彇"
      severity: CRITICAL
    - name: "no_hardcoded_cooldown"
      pattern: "(cooldown|sleep|wait)\\s*[:=]\\s*\\d+"
      message: "鍐峰嵈鏃堕暱搴斾粠 config 璇诲彇锛屼笉纭紪鐮?
      severity: MAJOR
    - name: "no_hardcoded_retry_count"
      pattern: "(max_retries|retry_count|retries)\\s*[:=]\\s*\\d+"
      message: "閲嶈瘯娆℃暟搴斾粠 config 璇诲彇锛屼笉纭紪鐮?
      severity: MAJOR
    - name: "hmac_compare_digest"
      pattern: "==\\s*['\"]?[a-z_]*token"
      message: "token 姣旇緝搴斾娇鐢?hmac.compare_digest() 闃叉鏃跺簭鏀诲嚮"
      severity: CRITICAL
  # 纭害鏉熻繚瑙勬椂鏄惁闃绘鍚堝苟
  block_on_violation: true

# --- 业务参数（供子代理修复时引用，避免硬编码到代码中）---
# 这些参数会被注入到子代理的修复 prompt 中
business_params:
  # 会话过期后的冷却时长（秒）
  session_cooldown_seconds: 300
    _scope: ["state_check"]  # 仅状态检查类问题需要
  # 外部资源获取重试次数（如 cookie/token 刷新）
  fetch_max_retries: 1
    _scope: ["retry_failure"]  # 仅重试类问题需要
  # 外部资源获取重试间隔（毫秒）
  fetch_retry_delay_ms: 1000
    _scope: ["retry_failure"]  # 仅重试类问题需要
  # 业务告警最小间隔（秒）
  business_alert_min_interval_seconds: 300
    _scope: ["warning_noise"]  # 仅噪声类问题需要
  # 批量 embedding 的批次大小
  embedding_batch_size: 32
    _scope: ["performance"]  # 仅性能类问题需要
  # 可重试的 HTTP 状态码（全局参数，所有子代理接收）
  retryable_http_statuses:
    - 410
    - 441
    - 502
  # 不可重试的 HTTP 状态码（全局参数）
  non_retryable_http_statuses:
    - 403
    - 440
    - 503

# --- 绱ф€ュ揩閫熶慨澶嶆ā寮?---
