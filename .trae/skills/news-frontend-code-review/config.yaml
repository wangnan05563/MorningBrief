scope:
  include_paths:
  - admin-web/src/**/*.vue
  - admin-web/src/**/*.js
  - miniprogram/**/*.js
  - miniprogram/**/*.wxml
  - miniprogram/**/*.wxss
  exclude_paths:
  - '**/node_modules/**'
  - '**/dist/**'
  - '**/playwright-report/**'
  - '**/test-results/**'
  - '**/.last-run.json'
  - miniprogram/project.config.json
  - miniprogram/sitemap.json
  file_extensions:
  - .vue
  - .js
  - .wxml
  - .wxss
  max_files_per_run: 20
priority:
  severity_order:
  - CRITICAL
  - HIGH
  - MEDIUM
  - LOW
  - INFO
  category_order:
  - field_contract
  - miniprogram_lifecycle
  - miniprogram_audio
  - miniprogram_api
  - api_call
  - routing
  - vue_component
  - element_plus
  - pinia
  - error_handling
  - performance
  - code_quality
  - accessibility
  - directory_structure
  - naming
  - model_name: 维度 26：模型名称大小写核对
  - preset_reflect: 维度 27：预设下拉框反射
  - preset_match: 维度 28：预设自动匹配
  - api_key_protection: 维度 29：API Key 保护
  report_threshold: LOW
checklist:
  directory_structure: true
  naming: true
  vue_component: true
  element_plus: true
  pinia: true
  api_call: true
  routing: true
  field_contract: true
  miniprogram_lifecycle: true
  miniprogram_audio: true
  miniprogram_api: true
  performance: true
  accessibility: true
  code_quality: true
  error_handling: true
  config_key_alignment: true
  preset_dropdown_reflect: true
  preset_auto_match: true
  api_key_protection: true
hard_constraints:
  rules:
  - name: miniprogram_circular_require_top
    pattern: ^const\s+\{[^}]*\}\s*=\s*require\(['"]\./auth['"]\)
    message: miniprogram/services/api.js 顶部 require('./auth') 会导致循环依赖（auth.js 加载时需要
      request），应延迟到 request 函数内部 require
    severity: CRITICAL
    auto_fix: false
  - name: miniprogram_baseurl_hardcoded
    pattern: BASE_URL\s*=\s*['"]http://localhost
    message: BASE_URL 禁止硬编码 localhost，应按 __wxConfig.envVersion 环境切换
    severity: HIGH
    auto_fix: false
  - name: miniprogram_player_no_off
    pattern: player\.(onPlay|onPause|onTimeUpdate|onEnded)\(
    message: player 监听器必须在 onUnload 中配对 off（offPlay/offPause/offTimeUpdate/offEnded），否则内存泄漏
    severity: HIGH
    auto_fix: false
  - name: miniprogram_iscurrent_by_title
    pattern: player\.title\s*===\s*ep\.title|player\.title\s*===\s*episode\.title
    message: isCurrentEpisode 禁止用 title 判断（标题重复会误判），应用 player.episodeId === ep.id
    severity: HIGH
    auto_fix: false
  - name: miniprogram_globaldata_undeclared
    pattern: globalData\.(listenStats|player|todayEpisode|networkType)
    message: globalData 字段必须在 app.js 显式声明，禁止运行时动态新增
    severity: MEDIUM
    auto_fix: false
  - name: router_missing_404_fallback
    pattern: pathMatch\(\.\*\)
    message: '路由表必须包含 404 兜底 { path: ''/:pathMatch(.*)*'', redirect: ''/xxx'' }，避免白屏'
    severity: HIGH
    auto_fix: false
  - name: path_includes_login
    pattern: pathname\.includes\(['"]\/login['"]\)|location\.pathname\.includes\(['"]\/login['"]\)
    message: 路径判断禁止用 includes('/login')（会误匹配 /login-callback），应用 pathname === '/login'
      严格相等
    severity: HIGH
    auto_fix: false
  - name: field_name_category_mismatch
    pattern: \.category\b(?!_)
    message: 后端返回 categories（复数），前端禁止用 .category（单数），应统一用 categories
    severity: MEDIUM
    auto_fix: false
  - name: field_name_content_vs_script
    pattern: res\.content\b(?!_)|response\.content\b(?!_)|data\.content\b(?!_)
    message: 稿件字段后端返回 script，前端用 content 会取不到值；历史兼容需 res.script || res.content 并注释
    severity: MEDIUM
    auto_fix: false
  - name: vue_no_script_setup
    pattern: <script>(?!\s*setup)
    message: Vue 3 组件应用 <script setup> 语法（项目规范），禁止 Options API 用于新组件
    severity: MEDIUM
    auto_fix: false
  - name: completion_rate_unit_mismatch
    pattern: completion_rate\s*\*\s*100|completed_rate\s*\*\s*100
    message: 完播率单位需前后端一致（0-1 或 0-100），前端 *100 时必须注释说明后端返回 0-1
    severity: MEDIUM
    auto_fix: false
  - name: no_console_log
    pattern: console\.log\(
    message: 生产代码禁止 console.log，调试用 console.warn/error 且需有明确语义
    severity: MEDIUM
    auto_fix: false
  - name: no_debugger
    pattern: ^\s*debugger\s*;?\s*$
    message: 生产代码禁止 debugger 调试器语句
    severity: HIGH
    auto_fix: false
  - name: model_name_official_source
    pattern: deepseek-chat|DeepSeek-V4
    message: DeepSeek 预设默认模型应为 deepseek-v4-flash（小写），模型名称须以官方文档为准
    severity: CRITICAL
    auto_fix: false
    category: model_name
  - name: preset_dropdown_reflect
    pattern: applyPreset.*selectedPreset
    message: 预设切换函数中必须同步更新 selectedPreset 状态
    severity: HIGH
    auto_fix: false
    category: preset_reflect
  - name: api_key_preserved_on_preset_switch
    pattern: applyPreset.*api_key.*=
    message: 预设切换函数不应覆盖 api_key 字段
    severity: CRITICAL
    auto_fix: false
    category: api_key_protection
  block_on_violation: true
abstraction_thresholds:
  inline_style_repeat: 3
  text_literal_repeat: 2
  function_max_lines: 50
  component_max_lines: 300
  max_nesting_depth: 4
report:
  output_dir: ''
  format: markdown
  include_good_practices: true
  max_suggestions: 10
verify:
  run_tests_after_review: false
  test_command: npm --prefix admin-web run test ; npm --prefix admin-web run build
  fail_on_critical: true
project_conventions:
  tech_stack:
    admin_web: Vue 3 + Element Plus + Vite + Pinia
    miniprogram: 原生微信小程序（无框架）
    admin_web_versions:
      vue: 3.x
      element_plus: 2.x
      vite: 5.x
      pinia: 2.x
      axios: 1.x
  ui_library: Element Plus
  auth_requirements:
    admin_web_token_storage: localStorage（admin_token）
    miniprogram_token_storage: 内存 + wx.setStorageSync 兜底
    bearer_token_header: 'Authorization: Bearer <token>'
    auto_refresh_on_401: true
  test_framework: Playwright
  test_file_location: admin-web/tests/*.spec.js
  routing:
    admin_web_library: vue-router
    admin_web_mode: createWebHistory
    admin_web_lazy_loading: true
    admin_web_404_fallback: 'redirect: /review'
    admin_web_guard: beforeEach（token + 角色）
  build_commands:
    admin_web_dev: npm --prefix admin-web run dev
    admin_web_build: npm --prefix admin-web run build
    miniprogram_build: 微信开发者工具上传
field_contract_frontend:
  backend_naming_style: snake_case
  frontend_passthrough: true
  forbid_camelcase_transform: true
  known_field_pairs:
  - backend: audio_url
    frontend_wrong: audioUrl
    description: 音频地址（snake_case 透传）
    severity: MEDIUM
  - backend: episode_id
    frontend_wrong: episodeId
    description: 节目 ID（前端变量可用 camelCase，但取后端字段需用 episode_id）
    severity: LOW
  - backend: categories
    frontend_wrong: category
    description: 分类列表（复数，禁止单数）
    severity: MEDIUM
  - backend: script
    frontend_wrong: content
    description: 稿件内容（历史兼容可 fallback：res.script || res.content）
    severity: MEDIUM
    allow_fallback: true
  - backend: placements
    frontend_wrong: dates
    description: 排期投放数组（结构不同，dates 是 map，placements 是数组）
    severity: HIGH
  - backend: name
    frontend_wrong: step_name
    description: 工作流步骤名（统一用 name）
    severity: MEDIUM
  ratio_fields:
  - field: completion_rate
    backend_unit: 0-1
    frontend_display: '* 100 转 0-100'
    require_comment: true
  - field: progress
    backend_unit: 0-1
    frontend_display: '* 100 转 0-100'
    require_comment: true
  datetime_fields:
    backend_format: ISO 8601（如 2026-07-09T10:00:00Z）
    frontend_parse_method: new Date(isoStr)
    forbidden_parse_methods:
    - 字符串方法（replace/slice/substring）
    - Date.parse() 直接返回数字
    display_method: 'toLocaleString(''zh-CN'', { hour12: false })'
miniprogram_lifecycle:
  listener_pairs:
  - true: onPlay
    false: offPlay
    scope: player
  - true: onPause
    false: offPause
    scope: player
  - true: onTimeUpdate
    false: offTimeUpdate
    scope: player
  - true: onEnded
    false: offEnded
    scope: player
  - true: onCanplay
    false: offCanplay
    scope: player
    self_cleanup: true
  - true: onNetworkStatusChange
    false: offNetworkStatusChange
    scope: wx
  globaldata_required_fields:
  - userInfo
  - token
  - player
  - todayEpisode
  - networkType
  - listenStats
  lifecycle_pairs:
  - load: onLoad
    unload: onUnload
    require_pair: true
  - show: onShow
    hide: onHide
    require_pair: false
miniprogram_audio:
  singleton: true
  singleton_location: app.globalData.player
  init_function: initPlayer
  init_timing: app.js onLaunch 调用一次
  episode_id_required: true
  forbidden_title_judge: true
  episode_id_field: episodeId
  oncanplay_self_cleanup: true
  cleanup_pattern: audioManager.offCanplay?.(onCanplay)
  resume_play:
    enabled: true
    progress_api: /playlogs/progress/:episodeId
    skip_if_completed: true
  progress_report:
    wifi_interval_ms: 5000
    non_wifi_interval_ms: 15000
    report_on_pause: true
    report_on_ended: true
    completed_flag: true
miniprogram_api:
  circular_dependency_delayed_require: true
  delayed_require_pattern: function request() { const { getToken } = require('./auth');
    }
  env_based_base_url: true
  env_check_pattern: __wxConfig.envVersion === 'release'
  forbidden_hardcoded_localhost: true
  token_management:
    central_location: services/auth.js
    functions:
    - getToken
    - refreshToken
    - setToken
    auto_refresh_on_401: true
    retry_once: true
  request_wrapper:
    unified_header: true
    content_type: application/json
    auth_header: 'Authorization: Bearer <token>'
    business_error_check: code !== 0
    error_reject_pattern: reject(new Error(message))
model_name_verification:
  enabled: true
  verified_model_names:
    qwen: qwen-max
    openai: gpt-4o-mini
    deepseek: deepseek-v4-flash
    zhipu: glm-4-flash
    moonshot: moonshot-v1-8k
    ernie: ernie-4.0-8k
    doubao: doubao-pro-4k
    ollama: qwen2.5:7b
    agnes: Agnes-2.0-Flash
  case_sensitive: true
preset_switch_safety:
  enabled: true
  require_preserve_api_key_on_preset_switch: true
  require_update_selected_preset: true
  require_auto_match_preset_dropdown: true
page_load_preset_matching:
  enabled: true
  require_preset_match_after_load: true
  match_field: base_url
