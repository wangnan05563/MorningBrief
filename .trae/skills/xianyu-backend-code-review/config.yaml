# ===== Xianyu Backend Code Review 技能配置 v4.38.0 =====
# 首次使用：复制本文件为 config.yaml 并按项目实际情况修改
# 所有评审规则、硬约束、项目规范均通过本文件管理，技能本身不含硬编码值
# 完整审查维度对照见 SKILL.md 附录C（31 维度，v4.31.0）
#
# v4.31.0 新增：coding_standards.resume_policy / log_merge 节点完整定义（B-REVIEW-157 / B-REVIEW-158 配套，meta-rules #31/#32 落地）
# v4.30.0 新增：B-REVIEW-157 / B-REVIEW-158 规则（meta-rules #31/#32 落地）
# v4.29.0 新增：B-REVIEW-151~156 检查点（meta-rules #25-30 数据契约与时序落地）
# v4.28.0 新增：coding_standards 节点（编码规范阈值配置）
# 其他节点配置请参考 config.example.yaml
# 当 config.yaml 缺失时，技能会使用内置默认配置并提示用户创建 config.yaml

# --- 编码规范阈值配置（v4.28.0 新增）---
# 对应 B-REVIEW-121 ~ B-REVIEW-150 共 30 个检查点的配置参数
# 所有参数通过此节点管理，不硬编码
coding_standards:
  datetime:
    default_timezone: naive          # naive | aware，项目级默认时区策略（B-REVIEW-121）
    raw_sql_coerce: true             # 是否对 raw SQL 结果强制类型转换（B-REVIEW-122）
  migration:
    independent_steps: [C-01, C-02, C-03, C-04, C-05]  # 独立迁移步骤列表（B-REVIEW-123）
    allow_merge_when: strong_dependency  # strong_dependency 时允许合并
  null_defense:
    enabled: true
    check_fields: [interval_seconds, use_cron]  # 需 null 防御的字段（B-REVIEW-124）
  query_filter:
    precision_check: true            # 是否检查过滤条件精度（B-REVIEW-125）
  enum_consistency:
    enabled: true
    status_fields: [order_status, eval_status, notify_status]  # B-REVIEW-126
  error_attribution:
    status_mapping:                  # 失败原因到状态码的映射（B-REVIEW-127）
      token_expired: 401
      anti_crawler: 429
      page_unavailable: 503
      other: 502
  log_noise:
    suppress_patterns:               # 降噪模式（B-REVIEW-131）
      - pattern: 'cookie_expired'
        first_level: WARNING
        repeat_level: DEBUG
        cooldown_seconds: 300
  circuit_breaker:
    cleanup_checklist: [save_progress, record_state, notify_downstream]  # B-REVIEW-132
  state_sync:
    pending_marker_dir: data/markers
    check_on_startup: true           # B-REVIEW-136
  credential_stores:
    - yaml
    - keyring
    sync_direction: yaml_to_keyring  # B-REVIEW-141
  retry:
    default_count: 3                 # B-REVIEW-130
    default_interval: 1.0
    backoff: exponential
  param_chain:
    required_fields: [sort_type, region, fail_pause_threshold]  # B-REVIEW-138
  dataclass:
    disallow_getattr_fallback: true  # B-REVIEW-147
  startup:
    components: [scheduler, session_manager, migration, cookie_sync, embedding]  # B-REVIEW-148
  mock:
    async_check_enabled: true        # B-REVIEW-149
  cookie:
    required_cookies: [unb, _m_h5_tk, cookie2, t, _tb_token_]  # B-REVIEW-150
    import_full: true
  parser:
    fallback_enabled: true
  encoding:
    default: utf-8                   # B-REVIEW-146
  dry:
    threshold_lines: 3               # B-REVIEW-145
    threshold_occurrences: 2
  contract:
    check_ts_interface_match: true   # B-REVIEW-143
  persist:
    business_switch_must_persist: true  # B-REVIEW-140
  race:
    check_request_id: true           # B-REVIEW-137
  keywords:
    sold: ['卖掉了', '已售', '已售罄', '宝贝不存在', '宝贝走丢了', '该宝贝不存在', '商品不存在', '已删除', '已被删除']  # B-REVIEW-139
    deleted: ['宝贝不存在', '宝贝走丢了', '该宝贝不存在', '商品不存在', '已删除', '已被删除']
  # 🆕v4.29 数据契约与时序扩展
  batch_circuit_breaker:
    failure_threshold: 3                       # B-REVIEW-151 连续失败阈值
    failure_window_sec: 3600                   # 失败计数滑动窗口
    log_phrasing:                              # 日志措辞三套文案（必须与动作一致）
      paused: "批次熔断暂停（可恢复）"
      stopped: "批次已停止（用户主动）"
      failed: "批次失败（异常终止）"
    mark_remaining_as: pending                 # 剩余项处理策略
    persist_keys: [cursor, completed_ids, remaining_ids]
  critical_path:
    patterns:                                  # B-REVIEW-152 关键路径模式列表
      - "_on_startup"
      - "run_migrations"
      - "_init_db"
      - "_init_session_manager"
      - "_on_close"
      - "_shutdown"
    require_logger_exception: true             # 外层 except 必须用 logger.exception()
    forbidden_log_patterns:                    # 禁用的丢堆栈日志模式
      - 'logger\.warning\(f["\u201c][^"]*\{e\}'
      - 'logger\.error\(f["\u201c][^"]*\{e\}'
  datetime:
    storage_timezone: UTC                      # B-REVIEW-153 存储一律 UTC
    preferred_now: 'datetime.now(timezone.utc)' # 推荐的 now 工厂
    forbidden_now_patterns:                    # 禁用的 now 模式
      - 'datetime\.now\(\)'
      - 'datetime\.utcnow\(\)'
    serialization_format: iso8601_with_tz      # 序列化格式
    naive_unify_helper: '_utcnow().replace(tzinfo=None)'  # 与 DB naive 算术的 helper
  state_sync_marker:
    marker_dir: 'data/markers'                 # B-REVIEW-154 marker 目录
    startup_check_required: true               # 启动时必须检查未处理 marker
    scan_interval_sec: 60                      # 同步器扫描间隔
    max_retry_count: 5
    marker_format: '{category}_{user_id}_{timestamp}.json'
  error_code:
    reason_enum:                               # B-REVIEW-155 reason 枚举（前后端契约）
      - 'token_expired'
      - 'anti_crawler'
      - 'page_unavailable'
      - 'rate_limited'
      - 'login_expired'
      - 'session_invalid'
      - 'permission_denied'
      - 'validation_error'
      - 'internal_error'
      - 'service_unavailable'
    response_schema:                           # 错误响应统一结构
      error_code: 'string (from reason_enum)'
      user_message: 'string (人类可读)'
      detail: 'string (技术细节)'
    require_in_http_exception: true            # raise HTTPException 必须含 error_code
  business_keyword:
    sold:                                      # B-REVIEW-156 业务关键字集中管理
      - '卖掉了'
      - '已售'
      - '已售罄'
      - '宝贝不存在'
      - '宝贝走丢了'
      - '该宝贝不存在'
      - '商品不存在'
      - '已删除'
      - '已被删除'
    deleted:
      - '宝贝不存在'
      - '宝贝走丢了'
      - '该宝贝不存在'
      - '商品不存在'
      - '已删除'
      - '已被删除'
    frontend_constants_file: 'frontend/src/constants/businessKeywords.ts'
    consistency_test: 'tests/test_keyword_consistency.py'
  # 🆕v4.31 B-REVIEW-157 状态恢复前置校验（meta-rule #31）
  # 配套规范：xianyu-hunter-dev/assets/guides/coding-rules/state-management.md step 179 RESUME-01
  resume_policy:
    enabled: true                          # resume 前置校验总开关（false 时仅做冷却期检查，跳过 precheck）
    cooldown_seconds: 30                   # 异常 pause 后冷却期时长（秒），冷却期内拒绝 resume 避免无效循环
    cooldown_default: 30                   # 任务/会话无 root_cause 时使用的兜底冷却期
    require_structured_response: true      # 校验失败时必须返回 {resume_blocked, reason_code, user_hint, retry_after}
    clear_root_cause_on_resume: true       # resume 成功后是否清除 root_cause（避免下次恢复时误判）
    reason_precheck_map:                   # reason_code → precheck 函数路径映射表（按 B-REVIEW-157 检查点）
      # 示例条目：项目实际使用时应替换为真实 reason_code 与校验函数路径
      RGV587_SESSION_EXPIRED: "xianyu_hunter.core.cookie_rotator.is_identity_valid"
      TOKEN_EXPIRED: "xianyu_hunter.core.auth_helper.is_token_valid"
      COOKIE_INVALID: "xianyu_hunter.core.cookie_rotator.is_cookie_fresh"
      QUOTA_EXHAUSTED: "xianyu_hunter.core.rate_limiter.has_quota"
      CONNECTION_LOST: "xianyu_hunter.core.network.is_endpoint_reachable"
    backend_root_cause_persistence:        # root_cause 持久化字段契约（与数据库 schema 对齐）
      storage_field: root_cause
      schema:
        reason_code: "string (from error_code.reason_enum)"
        failed_layer: "string (identity | session | network | rate_limit | business)"
        paused_at: "float (epoch seconds)"
        extra: "object (可选，自定义上下文)"
  # 🆕v4.31 B-REVIEW-158 降级链日志合并（meta-rule #32）
  # 配套规范：xianyu-hunter-dev/assets/guides/coding-rules/error-handling.md step 180 LOGMERGE-01
  log_merge:
    enabled: true                          # 降级链日志合并总开关（false 时按各自步骤独立输出，不强制合并）
    min_stages_to_merge: 2                 # 合并阈值：同一逻辑链阶段数 ≥ 该值才必须合并（单阶段无需合并）
    intermediate_debug_enabled: true       # 中间步骤 DEBUG 化开关（true=用 logger.debug，false=保持原级别）
    required_extra_fields:                 # 最终结果日志必须含的结构化 extra 字段
      - stages                              # 各中间步骤简述数组
      - final_reason                        # 最终失败原因
      - attempts                            # 阶段总数
    optional_extra_fields:                 # 推荐携带的上下文（缺失不报警）
      - keyword
      - task_id
      - user_id
    forbidden_warning_keywords:            # 视为「中间步骤」应 DEBUG 化的关键词（用于自动扫描）
      - "尝试"
      - "刷新"
      - "回退"
      - "重试"
      - "降级"
    detection_signals:                     # 自动扫描信号（用于 detect_log_merge_violation）
      - "连续多个 logger.warning 在同一 try/except 链中"
      - "末尾 raise 前未聚合 stages 到 extra"
  # 🆕v4.29 硬约束规则（自动扫描）
  hard_constraints:
    rules:
      # B-REVIEW-151 批量断路器四要素
      - name: "circuit_breaker_no_save_progress"
        pattern: "consecutive failure|consecutive_failures"
        message: "批量处理断路器必调用 save_progress() 持久化进度（meta-rule #25 / B-REVIEW-151），熔断分支与用户停止分支对称"
        severity: CRITICAL
        auto_fix: false
      - name: "log_paused_actual_break"
        pattern: "logger\\.(info|warning|debug).*[\\u4e2d\\u6587]?.*[\\u6682\\u505c]"
        message: "日志使用「暂停」措辞必须与实际动作一致（break+save_progress 对应「可恢复」），禁止语义不一致（B-REVIEW-151）"
        severity: MEDIUM
        auto_fix: false
      # B-REVIEW-152 关键路径异常保留 traceback
      - name: "critical_path_warning_fstring_e"
        pattern: "def\\s+(_on_startup|run_migrations|_init_\\w+|_on_close|_shutdown)"
        message: "关键路径函数必须用 logger.exception() 输出完整 traceback，禁止 logger.warning(f'...{e}') 丢堆栈（B-REVIEW-152 / meta-rule #26）"
        severity: CRITICAL
        auto_fix: false
      # B-REVIEW-153 datetime 统一时区策略
      - name: "datetime_now_no_tzinfo"
        pattern: "datetime\\.now\\(\\)"
        message: "禁止 datetime.now() 无 tzinfo，应使用 datetime.now(timezone.utc) 存储 UTC（B-REVIEW-153 / meta-rule #27）"
        severity: HIGH
        auto_fix: false
      - name: "datetime_utcnow_deprecated"
        pattern: "datetime\\.utcnow\\(\\)"
        message: "datetime.utcnow() 已在 Python 3.12+ 弃用，应使用 datetime.now(timezone.utc)（B-REVIEW-153）"
        severity: HIGH
        auto_fix: false
      # B-REVIEW-154 跨进程状态同步六步法
      - name: "write_marker_without_scan"
        pattern: "write_marker|write_pending_marker"
        message: "写端写 marker 必须配对存在 scan_marker 同步器，否则 marker 永不被消费（B-REVIEW-154 / meta-rule #28）"
        severity: HIGH
        auto_fix: false
      # B-REVIEW-155 前后端错误码契约
      - name: "http_exception_no_error_code"
        pattern: "raise\\s+HTTPException\\("
        message: "raise HTTPException 必须包含 error_code 字段（来自 reason_enum），否则前端无法按 error_code 分支（B-REVIEW-155 / meta-rule #29）"
        severity: HIGH
        auto_fix: false
      # B-REVIEW-156 业务关键字集中管理
      - name: "business_keyword_inline"
        pattern: "['\"](?:已售|已删除|宝贝不存在|卖掉了|已售罄)['\"]"
        message: "业务关键字（已售/已删除/宝贝不存在）禁止内联到代码，应从 config.yaml#business_keywords 读取（B-REVIEW-156 / meta-rule #30）"
        severity: MEDIUM
        auto_fix: false
      # 🆕v4.30 B-REVIEW-157 RESUME-PRECHECK 状态恢复前置校验（meta-rule #31）
      - name: "B-REVIEW-157 RESUME-PRECHECK"
        pattern: "def (resume|start|unpause|activate).*\\n(?!.*precheck|.*_check_prerequisite)"
        message: "resume/start/unpause 操作缺前置校验 precheck，异常pause后恢复需校验根因消除（meta-rules #31）"
        severity: CRITICAL
        auto_fix: false
      # 🆕v4.30 B-REVIEW-158 LOG-MERGE 多阶段降级链日志合并（meta-rule #32）
      - name: "B-REVIEW-158 LOG-MERGE"
        pattern: "logger\\.warning.*(尝试|刷新|回退|重试)"
        message: "降级链中间步骤应用 logger.debug，最终结果合并为1条结构化 WARNING（meta-rules #32）"
        severity: MAJOR
        auto_fix: false
  block_on_violation: true

# --- 规范治理（v4.33.0 新增）---
# meta-rules #36（规范沉淀门槛）与 #37（规范退化机制）的配置参数
# 用于防止过度规范化和规范膨胀，保持规范体系的健康度
meta_rules_governance:
  # === #36 规范沉淀门槛（防过度规范化）===
  sedimentation_threshold: 3                # 相似 bug 计数门槛（≥3 个才可立规范）
  sedimentation_time_window_months: 6       # 相似 bug 计数时间窗口（月）
  experimental_observation_quarters: 1      # experimental 标签观察期（季度）
  # 例外豁免类别（无需 ≥3 次即可立即立规范）
  sedimentation_exemption_categories:
    - "security_vulnerability"              # 安全漏洞（如 token 泄露）
    - "data_loss"                           # 数据丢失（如 DB 迁移失败）
    - "payment_damage"                      # 付费受损（如订单金额错误）
  # === #37 规范退化机制（防规范膨胀）===
  degradation_threshold: 3                  # 利用率退化阈值（次/季度，<3 则标记待合并/待废弃）
  observation_period_quarters: 1            # 待废弃观察期（季度，期间无命中则废弃）
  # 安全类规范永不退化（即使 0 命中也保留）
  degradation_exemption_categories:
    - "security"                            # token 比较 / 加密 / 认证白名单等
    - "config_driven"                       # 配置驱动类规范（依赖 config 存在）
  # === B-REVIEW-162/163 自动扫描规则 ===
  hard_constraints:
    rules:
      # 🆕v4.33 B-REVIEW-162 规范立项前置计数（meta-rule #36）
      - name: "B-REVIEW-162 SEDIMENTATION-THRESHOLD"
        pattern: "## \\d+\\. .*🆕v4\\.\\d+"
        message: "新立 meta-rule 必须满足 ≥3 个相似 bug 门槛（meta-rules #36），单一 bug 立规范需标 experimental 标签 + 1 季度观察期"
        severity: MAJOR
        auto_fix: false
      # 🆕v4.33 B-REVIEW-163 规范退化清理（meta-rule #37）
      - name: "B-REVIEW-163 DEGRADATION-CLEANUP"
        pattern: "待废弃|deprecated"
        message: "利用率 < 3 次/季度的 step/B-REVIEW 必须标记待合并/待废弃，1 季度观察期后废弃并移入 version-history.md Deprecated 章节（meta-rules #37）"
        severity: MINOR
        auto_fix: false

# --- 列表聚合与状态联动（v4.34.0 新增）---
# meta-rules #38-42 后端落地，配套 xianyu-hunter-dev v4.34.0 step 184-188
# 用于防止全局聚合越界数据 / N+1 查询性能退化 / 联动开关逻辑错误 /
# precheck 抛异常 / 配置缺失即崩溃
# 所有参数通过此节点管理，不硬编码
meta_rules_38_42:
  # === B-REVIEW-164 全局聚合任务级过滤（meta-rule #38）===
  global_aggregate_filter:
    enabled: true
    severity: CRITICAL
    required_filter_function: "_filter_by_per_task_range"
    task_config_fields:
      - "price_range"
      - "market_ratio"

  # === B-REVIEW-165 列表交叉数据批量注入（meta-rule #39）===
  cross_domain_inject:
    enabled: true
    severity: WARNING
    cache_ttl_seconds: 300
    batch_size_limit: 500
    forbidden_loop_patterns:
      - "for.*in.*items:.*db.query"

  # === B-REVIEW-166 多字段联动开关范式（meta-rule #40）===
  linked_switch_priority:
    enabled: true
    severity: MAJOR
    main_switch_field: "mode"
    filter_suffix: "_bargain_only"
    priority_matrix:
      auto_buy: "filter_active"
      semi_auto: "filter_active"
      notify: "filter_disabled"

  # === B-REVIEW-167 状态恢复前置校验结构化响应（meta-rule #41）===
  precheck_structured_fields:
    enabled: true
    severity: CRITICAL
    required_fields:
      - "resume_blocked"
      - "reason_code"
      - "user_hint"
      - "retry_after"
      - "task_registered"
    forbid_raise: true
    api_error_status: 400

  # === B-REVIEW-168 配置化阈值兜底范式（meta-rule #42）===
  config_fallback_defaults:
    enabled: true
    severity: MAJOR
    fallback_defaults:
      p10_percentile: 0.10
      market_ratio_threshold: 0.85
      price_range_tolerance: 0.05
    require_warning_log: true

  # === B-REVIEW-164~168 自动扫描规则 ===
  hard_constraints:
    rules:
      # 🆕v4.34 B-REVIEW-164 全局聚合任务级过滤（meta-rule #38）
      - name: "B-REVIEW-164 GLOBAL-AGGREGATE-TASK-FILTER"
        pattern: "task_id\\s*=\\s*None(?!.*_filter_by_per_task_range)"
        message: "全局视图（无 task_id）列表查询必须按各任务个体配置范围过滤，禁止只用全局默认范围（meta-rules #38）"
        severity: CRITICAL
        auto_fix: false
      # 🆕v4.34 B-REVIEW-165 列表交叉数据批量注入（meta-rule #39）
      - name: "B-REVIEW-165 LIST-CROSS-DOMAIN-INJECT"
        pattern: "for\\s+\\w+\\s+in\\s+\\w+:\\s*\\n[^\\n]*db\\.query"
        message: "列表交叉数据源必须批量查询 + TTL 缓存，禁止 N+1 单条查询（meta-rules #39）"
        severity: WARNING
        auto_fix: false
      # 🆕v4.34 B-REVIEW-166 多字段联动开关范式（meta-rule #40）
      - name: "B-REVIEW-166 MULTI-FIELD-LINKED-SWITCH"
        pattern: "bargain_only(?!.*if\\s+mode\\s*==)"
        message: "联动字段必须声明「主开关→过滤器」优先级矩阵，主开关失效时子过滤器自动禁用（meta-rules #40）"
        severity: MAJOR
        auto_fix: false
      # 🆕v4.34 B-REVIEW-167 状态恢复前置校验结构化响应（meta-rule #41）
      - name: "B-REVIEW-167 RESUME-PRECHECK-STRUCTURED"
        pattern: "def\\s+precheck_\\w+\\([^)]*\\)[^:]*:[^\\n]*\\n(?!(?:.*\\n)*?.*return\\s*\\{)"
        message: "precheck 必须返回 5 字段结构化 dict 不抛异常，API 层直接透传（meta-rules #41）"
        severity: CRITICAL
        auto_fix: false
      # 🆕v4.34 B-REVIEW-168 配置化阈值兜底范式（meta-rule #42）
      - name: "B-REVIEW-168 CONFIG-DRIVEN-THRESHOLD-FALLBACK"
        pattern: "config\\.bargain_price\\.\\w+(?!.*try)"
        message: "从 config 读取的阈值必须有 try/except 兜底默认值，禁止配置缺失即崩溃（meta-rules #42）"
        severity: MAJOR
        auto_fix: false

# --- 🆕v4.35 跨层契约与测试同步（meta-rules #47-#51 后端落地）---
# 复盘来源：2026-07-07 解决的 SEMI_AUTO 模式通知未触发确认问题
# （EVAL_PASSED 事件三处发布点 task_mode 字段不对齐 / 前端路由注册与后端 endpoint 契约缺失 /
#   回链 URL query string 构造与消费不一致 / 历史测试 mock 类型不匹配 + keyring fallback +
#   接口签名变更未同步测试）
# 对应 xianyu-hunter-dev v4.35.0 meta-rules #47-#51
# 审查要点：SKILL.md 维度 36 章节（B-REVIEW-173~177）
# 与前端 v4.39.0 F-REVIEW-131~135 对应
meta_rules_47_51:
  # === B-REVIEW-173 事件多发布点字段对齐（meta-rule #47）===
  event_multi_emit_alignment:
    enabled: true
    severity: CRITICAL
    # 业务事件在多个层（worker/service/route/SSE 推送器）有发布点时，每处 payload 字段集必须一致
    require_field_set_consistency: true       # 所有发布点 payload 字段集必须一致
    require_fallback_branch: true             # 消费方按字段分支必须有 else/default
    # 事件类型清单（从 config 读取，不硬编码具体事件名）
    event_types: []
    # 必传字段集（从 config 读取）
    required_fields: []
    # 适用场景
    applicable: "业务事件在多层有发布点的场景（worker → service → route → 通知模板）"
    not_applicable: "单一发布点的内部事件、纯调试日志事件、一次性脚本事件"

  # === B-REVIEW-174 路由注册与后端 endpoint 契约（meta-rule #48）===
  frontend_route_registration:
    enabled: true
    severity: CRITICAL
    # 前端路由注册表中的每条路由，后端必须提供对应 endpoint
    require_endpoint_mapping: true            # 前端路由必须有后端 endpoint 对应
    # 路由清单（从 config 读取，不硬编码具体路径）
    route_list: []
    # endpoint 映射表（path → handler）
    endpoint_mapping: {}
    # 适用场景
    applicable: "所有前端路由对应的后端 endpoint 检查"
    not_applicable: "纯前端 SPA 路由无后端数据、静态资源路由"

  # === B-REVIEW-175 回链 URL query string 构造（meta-rule #49）===
  external_callback_query_retention:
    enabled: true
    severity: CRITICAL
    # 后端构造的回链 URL 必须包含前端所需的所有 query string 参数
    require_all_params: true                  # 回链 URL 必须包含所有必传参数
    # 回链路由清单（从 config 读取）
    callback_routes: []
    # 必传参数清单（从 config 读取）
    required_params: []
    # 适用场景
    applicable: "通知/邮件中的回链 URL 构造"
    not_applicable: "纯内部 API 调用、无 query string 的路由"

  # === B-REVIEW-176 接口签名变更测试同步（meta-rule #50）===
  test_synchronization:
    enabled: true
    severity: MAJOR
    # 接口签名变更后必须同步更新所有测试调用
    require_signature_sync: true              # 签名变更必须同步测试
    require_mock_type_sync: true              # async↔sync 重构时 AsyncMock↔MagicMock 必须同步
    require_field_set_sync: true              # mock 数据必须与生产 Pydantic 模型字段集 1:1 对齐
    # 签名变更检查模式（从 config 读取）
    signature_check_patterns:
      - "def\\s+\\w+\\(.*\\)\\s*->"
      - "async\\s+def\\s+\\w+\\(.*\\)\\s*->"
    # mock 类型映射表
    mock_type_mapping:
      async_to_sync: "AsyncMock → MagicMock"
      sync_to_async: "MagicMock → AsyncMock"
    # 适用场景
    applicable: "所有接口签名重构（新增/删除/重命名参数）、async/await 重构"
    not_applicable: "纯内部实现重构（不改变接口签名）、新增功能（不破坏现有测试）"

  # === B-REVIEW-177 外部依赖隔离测试可重复性（meta-rule #51）===
  external_dependency_isolation:
    enabled: true
    severity: MAJOR
    # 测试中依赖外部资源必须显式 patch
    require_explicit_patch: true              # 外部依赖必须显式 patch
    forbidden_fallback: true                  # 禁止依赖生产 fallback
    # 外部依赖类型清单
    dependency_types:
      - "keyring"                             # 必须 patch("...get_secret", return_value=None)
      - "env"                                 # 必须 monkeypatch.setenv 或 patch.dict(os.environ, ...)
      - "file"                                # 必须 tmp_path fixture
      - "network"                             # 必须 respx/responses/MagicMock
      - "system_api"                          # 必须 MagicMock
    # 隔离策略映射
    isolation_strategies:
      keyring: "patch return_value=None"
      env: "monkeypatch.setenv 或 patch.dict"
      file: "tmp_path fixture"
      network: "respx/responses/MagicMock"
      system_api: "MagicMock"
    # 适用场景
    applicable: "所有依赖外部资源的测试、CI/CD 需可重复的场景、跨平台测试"
    not_applicable: "纯函数测试（无外部依赖）、使用 pytest fixture 已隔离的测试、集成测试（故意依赖真实外部资源）"

# --- 🆕v4.38 异步同步性 / 资源池基准 / HTTP 状态码映射 / CSS 选择器降级 /
# 异常日志语义 / 外部资源生命周期 / 数据库写入身份追溯（meta-rules #57-#63 后端落地）---
# 复盘背景：基于本轮对话解决的 7 类问题（async/await 误用 / NullPool 性能问题 /
# HTTP 状态码语义模糊 / CSS 选择器失效 / 异常日志丢失 traceback /
# 并发安全 page closure / 数据库写入身份追溯与 converter 类型安全）
# 对应 xianyu-hunter-dev v4.38.0 meta-rules #57-#63
# 审查要点：SKILL.md B-REVIEW-182~188
# 所有参数通过此节点管理，不硬编码
meta_rules_57_63:
  # === B-REVIEW-182 ASYNC-AWAIT-SYNC-CHECK（meta-rule #57）===
  # 检查点：async def 方法体内若不含 await 表达式，必须改为同步 def
  # 历史教训：worker.py _finalize_run 标记为 async def 但方法体全同步，
  #           Python 3.14 优化后返回 None，await None 触发 TypeError 导致调度器崩溃
  async_await_check:
    enabled: true
    severity: CRITICAL
    # 白名单装饰器：这些装饰器的 async def 可豁免（接口定义/上下文管理器）
    whitelist_decorators:
      - "@abstractmethod"
      - "@contextlib.asynccontextmanager"
    # async generator（含 yield 的 async def）豁免
    allow_async_generators: true
    # 推荐用 AST 分析而非正则，准确识别方法体内是否含 await 节点
    use_ast_analysis: true
    # 适用场景
    applicable: "Python 3.11+ 异步代码；使用 asyncio 的 FastAPI/uvicorn 项目；含 async def 的 worker/scheduler/service 层"
    not_applicable: "纯接口定义（@abstractmethod）；上下文管理器；async generator；测试代码中的 async def test_*"

  # === B-REVIEW-183 RESOURCE-POOL-BENCHMARK（meta-rule #58）===
  # 检查点：数据库/HTTP/浏览器资源池配置必须有性能基准数据支持
  # 历史教训：db_models.py 使用 NullPool 导致 list_and_count_task_links 慢查询 231ms
  #           （其中 ~100ms 是 PRAGMA 开销），改为 QueuePool 后降至 11.9ms（19x 提升）
  resource_pool_benchmark:
    enabled: true
    severity: WARNING
    # 系统层开销阈值（>50ms 必须排查资源池配置）
    overhead_threshold_ms: 50
    # 生产环境禁用的资源池类型
    forbidden_pool_types_in_prod:
      - NullPool      # 每次新建连接，仅用于测试/单次请求
      - StaticPool    # 单连接，测试隔离用
    # 资源池类型清单
    pool_types:
      - NullPool      # 每次新建连接，仅用于测试/单次请求
      - QueuePool     # 复用连接，生产环境推荐
      - StaticPool    # 单连接，测试隔离用
    # 是否要求 docstring 说明选择理由
    require_docstring: true
    # 适用场景
    applicable: "所有资源池选择；含 PRAGMA/init/重试开销的资源初始化；数据库连接池、HTTP 连接池、浏览器实例池"
    not_applicable: "测试环境（用 StaticPool 保证隔离）；单次请求资源；内存数据结构；CLI 一次性脚本"

  # === B-REVIEW-184 HTTP-STATUS-CODE-MAPPING（meta-rule #59）===
  # 检查点：底层模块返回多原因的 None/错误时，必须建立 reason_code → status_code 映射表
  # 历史教训：collection_service.py 将所有 detail() None 映射为 410，
  #           前端展示"商品详情页加载失败或已下架"，实际原因是 cookie 过期需重新登录
  http_status_code_mapping:
    enabled: true
    severity: CRITICAL
    # 底层失败原因字段名（底层模块设置 last_*_failure_reason）
    reason_to_status_map_field: "last_detail_failure_reason"
    # 默认状态码（仅用于未映射的兜底）
    default_status_code: 410
    # 是否要求底层模块设置 reason 属性
    required_reason_attribute: true
    # 映射表示例（实际映射表在代码中定义）
    mapping_table_example:
      home_title_redirect: 403
      login_redirect: 403
      verify_redirect: 441
      item_not_found: 410
      item_removed: 410
      anti_crawler: 429
      network_timeout: 504
    # 适用场景
    applicable: "所有 HTTP 错误响应；多原因返回 None/错误的底层模块（如 detail() 返回 None 有 10+ 原因）"
    not_applicable: "唯一原因的错误码（如 404 仅表示资源不存在）；内部异常不向用户暴露；健康检查端点"

  # === B-REVIEW-185 CSS-SELECTOR-FALLBACK（meta-rule #60）===
  # 检查点：依赖第三方网站 DOM 的选择器必须有 ≥3 级降级
  # 历史教训：_detail.py _parse_sale_counts_from_tabs 单一选择器 [class*="tabItem"]
  #           在闲鱼改版后失效，on_sale=0 sold=0 误报，添加三级降级后修复
  css_selector_fallback:
    enabled: true
    severity: CRITICAL
    # 最少降级级数（业务语义 className → HTML role 属性 → 文本内容前缀扫描）
    min_fallback_levels: 3
    # 调试 dump 触发字段（收窄到核心字段失败，避免每次失败都 dump）
    dump_trigger_fields:
      - "on_sale"
    # 每小时 dump 上限（防止 dump 文件爆炸）
    dump_max_per_hour: 10
    # 豁免选择器（业务语义稳定，无需降级）
    excluded_selectors:
      - "[id="
      - "[data-"
    # 适用场景
    applicable: "第三方网站 DOM 解析（闲鱼/淘宝/天猫/京东）；依赖 className 的选择器；Playwright page.querySelectorAll 返回值解析"
    not_applicable: "自有代码 DOM；ID 选择器；data-* 属性选择器；后端 API JSON 解析；SSR 页面"

  # === B-REVIEW-186 EXCEPTION-LOG-SEMANTIC（meta-rule #61）===
  # 检查点：except 块内必须用 logger.exception('描述') 保留完整 traceback
  # 历史教训：关键路径用 logger.warning(f"...{e}") 丢失 traceback，
  #           定位问题耗时 30+ 分钟才能复现
  exception_log_semantic:
    enabled: true
    severity: CRITICAL
    # 禁用的日志模式（在 except 块内）
    forbidden_patterns:
      - 'logger\.warning.*f["\u201c][^"]*\{e\}'    # 禁用 logger.warning(f'...{e}') 丢堆栈
      - 'logger\.error.*f["\u201c][^"]*\{e\}'      # 禁用 logger.error(f'...{e}') 丢堆栈
      - 'logger\.exception.*f["\u201c]'            # 禁用 logger.exception(f'...') 多余 f-string
    # 必须的日志模式
    required_pattern: "logger.exception"
    # 关键路径函数（必须用 logger.exception()）
    critical_path_functions:
      - "_on_startup"
      - "run_migrations"
      - "_init_db"
      - "_init_scheduler"
    # 适用场景
    applicable: "所有异常处理代码；关键路径（启动/迁移/初始化）；多阶段降级链路；后台任务异常处理；API 路由异常处理"
    not_applicable: "纯性能日志；DEBUG 级别日志；非 except 块的 warning（用 exc_info=True）；测试代码"

  # === B-REVIEW-187 EXTERNAL-RESOURCE-LIFECYCLE（meta-rule #62）===
  # 检查点：外部传入的资源（Page/Connection/Lock）必须配对调用 register/unregister
  # 历史教训：collection_service.py 接收外部 page 但未注册，并发采集时 page 被主流程关闭
  external_resource_lifecycle:
    enabled: true
    severity: CRITICAL
    # 外部资源类型清单
    resource_types:
      - Page           # Playwright Page
      - Connection     # DB Connection
      - Lock           # asyncio.Lock
    # 必须配对的函数名
    pair_required_functions:
      - "register_external_page"
      - "unregister_external_page"
    # 是否要求在 finally 块中 unregister
    require_finally_block: true
    # 是否使用引用计数管理
    use_reference_counting: true
    # 适用场景
    applicable: "外部资源传入（Page/Connection/Lock/SSE 连接）；并发采集场景；Playwright Page 共享；跨函数/跨模块资源传递"
    not_applicable: "内部创建的资源；单线程使用；一次性资源；with 语句管理的资源"

  # === B-REVIEW-188 DB-WRITE-IDENTITY-TRACE（meta-rule #63）===
  # 检查点：数据库写入函数必须含 user_id 参数；converter 处理 re.Match 必须 m.group(1)
  # 历史教训：_SELLER_LABEL_PATTERNS 用 int 作为 converter，但 re.findall 返回 Match 对象，
  #           int(m) 报错；upsert_eval_event 缺 user_id 导致跨用户数据删除
  db_write_identity_trace:
    enabled: true
    severity: CRITICAL
    # 必须含 user_id 参数的函数名模式
    function_name_patterns:
      - "def upsert_"
      - "def insert_"
      - "def update_"
      - "def create_"
    required_param_name: "user_id"
    # converter 函数处理 re.Match 必须显式 m.group(1)
    converter_match_required: true
    # 禁用的 converter 模式
    forbidden_converter_patterns:
      - "lambda m: int(m)"
      - "lambda m: float(m)"
    # 豁免函数（系统级写入无需 user_id）
    excluded_functions:
      - "_log_*"       # 日志表写入
      - "_stats_*"     # 统计表写入
    # 适用场景
    applicable: "所有数据库写入函数；正则 converter 函数；跨用户系统；含 re.findall + converter 的解析逻辑"
    not_applicable: "系统级写入（日志表/统计表/全局配置表）；单一调用点的函数；Pydantic 入口校验后的函数；纯查询函数"

  # === B-REVIEW-182~188 自动扫描规则 ===
  hard_constraints:
    rules:
      # 🆕v4.38 B-REVIEW-182 异步方法 await 语义静态校验（meta-rule #57）
      - name: "B-REVIEW-182 ASYNC-AWAIT-SYNC-CHECK"
        pattern: "async\\s+def\\s+\\w+\\([^)]*\\)[^:]*:[^\\n]*\\n(?!(?:.*\\n)*?.*await)"
        message: "async def 方法体内必须含 await 表达式，否则改同步 def；调用点同步移除 await（meta-rules #57），Python 3.14 优化后 await None 触发 TypeError"
        severity: CRITICAL
        auto_fix: false
      # 🆕v4.38 B-REVIEW-183 资源池配置性能基准（meta-rule #58）
      - name: "B-REVIEW-183 RESOURCE-POOL-BENCHMARK"
        pattern: "poolclass=NullPool"
        message: "NullPool 每次新建连接执行 5 条 PRAGMA ~100ms，生产环境必须用 QueuePool 并在 docstring 记录性能基准（meta-rules #58）"
        severity: WARNING
        auto_fix: false
      # 🆕v4.38 B-REVIEW-184 HTTP 状态码语义映射（meta-rule #59）
      - name: "B-REVIEW-184 HTTP-STATUS-CODE-MAPPING"
        pattern: "raise\\s+HTTPException\\((410|502)\\b"
        message: "多原因 None 必须建立 reason_code → status_code 映射表，禁止多原因一律映射同一码（meta-rules #59），底层设置 last_*_failure_reason"
        severity: CRITICAL
        auto_fix: false
      # 🆕v4.38 B-REVIEW-185 CSS 选择器降级链（meta-rule #60）
      - name: "B-REVIEW-185 CSS-SELECTOR-FALLBACK"
        pattern: "querySelector(All)?\\(['\"][^'\"]+['\"]\\)\\s*(?!.*length)"
        message: "第三方网站 DOM 选择器必须有 ≥3 级降级（业务语义 className → HTML role 属性 → 文本内容前缀扫描），单一选择器视为违规（meta-rules #60）"
        severity: CRITICAL
        auto_fix: false
      # 🆕v4.38 B-REVIEW-186 异常日志语义完整性（meta-rule #61）
      - name: "B-REVIEW-186 EXCEPTION-LOG-SEMANTIC"
        pattern: "except\\s+Exception\\s+as\\s+e:\\s*\\n[^\\n]*logger\\.warning\\(f"
        message: "except 块内必须用 logger.exception('描述') 保留 traceback，禁用 logger.warning(f'...{e}') 丢失堆栈（meta-rules #61）"
        severity: CRITICAL
        auto_fix: false
      # 🆕v4.38 B-REVIEW-187 外部资源生命周期（meta-rule #62）
      - name: "B-REVIEW-187 EXTERNAL-RESOURCE-LIFECYCLE"
        pattern: "reuse_page\\s*=\\s*Page\\s*\\|\\s*None"
        message: "外部传入的 Page/Connection/Lock 必须配对调用 register/unregister，且在 finally 块 unregister 避免泄漏（meta-rules #62）"
        severity: CRITICAL
        auto_fix: false
      # 🆕v4.38 B-REVIEW-188 数据库写入身份追踪（meta-rule #63）
      - name: "B-REVIEW-188 DB-WRITE-IDENTITY-TRACE"
        pattern: "def\\s+(upsert|insert|update|create)_\\w+\\([^)]*\\)\\s*(?!.*user_id)"
        message: "数据库写入函数必须含 user_id 参数用于跨用户隔离；converter 处理 re.Match 必须显式 m.group(1) 再转型，禁用 int(m)（meta-rules #63）"
        severity: CRITICAL
        auto_fix: false