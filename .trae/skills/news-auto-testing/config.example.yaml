# ============================================================
# === 2026-07-22 新增：外部服务降级与异常过滤测试配置（阶段 52-54 V2.2）===
# ============================================================
# 对应 news-code-dev 元规范 R127-R129（2026-07-22 复盘新增）
# 复制本文件为 config.yaml 后按项目实际调整以下参数
# 背景：
#   - 工作流 wf-20260711-0009 stitch 步骤失败，暴露三类问题：
#     1) COS 未配置时无降级本地存储，直接 raise
#     2) Windows asyncio ProactorBasePipeTransport 抛 ConnectionResetError [WinError 10054] 污染日志
#     3) download_file 未识别本地路径前缀 /audio/，触发 httpx 自回路请求
#   - 详见 SKILL.md 阶段 52-54 说明 + 复盘章节

# ---- 阶段 52：TTS COS 降级本地存储测试（对应后端维度 113 + 前端维度 96）----
# 规则：COS 未配置时必须降级到本地存储，返回 /audio/<key> 相对路径 URL
# 测试步骤：模拟 COS 未配置 → 触发 TTS → 验证文件落盘 → 验证 URL 前缀 → 验证前端可播放 → 验证降级 UI
external_storage_fallback_test:
  description: "TTS COS 降级本地存储测试（阶段 52）"
  enabled: true
  # 严重级别（CRITICAL/HIGH/MEDIUM/LOW）
  severity: "CRITICAL"
  # 模拟 COS 未配置（测试前清空 COS_SECRET_ID / COS_SECRET_KEY）
  cos_configured_mock: false
  # 本地降级目录（与后端 news-backend-code-review/config.yaml#external_storage_fallback_check.local_dir 一致）
  local_dir: "data/audio_cache"
  # 静态目录挂载点（FastAPI app.mount 挂载 local_dir 到此前缀）
  static_mount_point: "/audio"
  # 预期返回 URL 前缀（降级模式下 audio_url 应以 /audio/ 开头）
  expected_url_prefix: "/audio/"
  # 测试工作流类型（tts/llm/stitch 等，默认 tts）
  test_workflow: "tts"
  # 断言项（全部为 true 时 PASS）
  assertions:
    # 音频文件必须落盘到 local_dir
    file_exists_in_local_dir: true
    # audio_url 必须以 expected_url_prefix 开头
    url_starts_with: "/audio/"
    # 前端播放器必须能加载该 URL
    frontend_can_play: true
    # 管理后台配置页必须显示降级提示
    fallback_ui_alert_displayed: true
  # 判断信号（grep 模式，用于代码静态扫描）
  signals:
    - "is_cos_configured"
    - "cos_client\\.put_object"
  # 扫描目录（覆盖所有可能调用 COS 的位置）
  scan_dirs:
    - "backend/app/workflow/tts/"

# ---- 阶段 53：Windows asyncio 异常过滤测试（对应后端维度 114）----
# 规则：Windows 平台必须在事件循环异常处理器中过滤 ConnectionResetError [WinError 10054]
# 测试步骤：启动服务 → Playwright 打开播放页 → 关闭页面模拟提前断开 → 检查日志级别
# 注意：仅 Windows 平台启用，Linux/Mac 使用 epoll 不存在此问题
asyncio_exception_filter_test:
  description: "Windows asyncio 异常过滤测试（阶段 53）"
  enabled: true
  severity: "MEDIUM"
  # 启用平台列表（仅 Windows，Linux/Mac 的 epoll 不会触发此异常）
  enabled_platforms:
    - "win32"
  # 被过滤的异常类型
  ignored_exception: "ConnectionResetError"
  # 触发异常的传输类
  ignored_transport: "ProactorBasePipeTransport"
  # Windows 错误码
  ignored_winerror: 10054
  # 预期日志级别（降级为 DEBUG，不污染 INFO 日志）
  expected_log_level: "DEBUG"
  # 断言项
  assertions:
    # 日志中无 ERROR 级别 ConnectionResetError
    no_error_in_log: true
    # 匹配到的日志行级别仅为 DEBUG
    only_debug_level: true
  # 判断信号
  signals:
    - "ProactorBasePipeTransport\\._call_connection_lost"
    - "ConnectionResetError.*WinError.*10054"
  # 扫描目录（仅检查启动入口和核心异步模块）
  scan_dirs:
    - "backend/app/main.py"
    - "backend/app/core/"

# ---- 阶段 54：本地路径 URL 约定测试（对应后端维度 115 + 前端维度 95）----
# 规则：download_file 必须优先检测 /audio/ 前缀，命中则 shutil.copyfile，禁止 httpx 自回路请求
# 测试步骤：构造本地路径 URL → 调用 download_file → 验证无 httpx 调用 → 验证文件拷贝 → 验证内容一致
local_path_url_test:
  description: "本地路径 URL 约定测试（阶段 54）"
  enabled: true
  severity: "HIGH"
  # URL 前缀（后端降级模式返回的 URL 前缀）
  url_prefix: "/audio/"
  # 物理目录（URL 前缀映射到的文件系统目录）
  physical_dir: "data/audio_cache"
  # 拷贝策略（检测到前缀时直接拷贝文件，不走 http 请求）
  copy_strategy: "shutil.copyfile"
  # 禁止的自回路请求模式（命中即报 FAIL）
  # 这些模式表示下游把本地路径当成了远程 URL，发起 http 请求访问本机服务
  forbidden_patterns:
    - "httpx\\.get\\(.*localhost.*audio"
    - "httpx\\.get\\(.*127\\.0\\.0\\.1.*audio"
  # 断言项
  assertions:
    # 未发起 httpx.get 请求
    no_httpx_call: true
    # 文件成功拷贝到目标位置
    file_copied: true
    # 源文件与目标文件 MD5 一致
    content_correct: true
    # 前端 audio src 支持相对路径
    frontend_supports_relative: true
  # 判断信号
  signals:
    - "def\\s+download_file\\("
    - "url\\.startswith\\(['\"]/audio/['\"]\\)"
  # 扫描目录（覆盖所有可能调用 download_file 的位置）
  scan_dirs:
    - "backend/app/workflow/stitch/"
    - "backend/app/workflow/tts/"

# ============================================================
# 阶段 71：响应拦截器 blob 响应兼容性测试
# 测试步骤：构造 blob 响应 → 验证拦截器分支 → 验证无 ElMessage 误报 → 构造 json 对照
# ============================================================
blob_interceptor_compat_test:
  description: "响应拦截器 blob/arraybuffer 响应兼容性测试（阶段 71）"
  enabled: true
  severity: "HIGH"
  # 测试的响应类型清单（拦截器应支持所有列出的类型）
  response_types:
    - "blob"
    - "arraybuffer"
  # 拦截器源码判断信号（grep 命中表示拦截器无分支判断）
  interceptor_signal: "response\\.config\\?\\.responseType"
  # 拦截器源码路径
  interceptor_files:
    - "admin-web/src/utils/request.js"
    - "admin-web/src/api/request.js"
  # 禁止出现的错误信息（出现即 FAIL，表示误按 JSON 解构）
  forbidden_error_messages:
    - "code undefined"
    - "message undefined"
    - "Cannot read properties of undefined"
  # JSON 对照响应（验证正常解构流程不受影响）
  json_control_response:
    code: 0
    message: "ok"
    data:
      sample_field: "sample_value"
  # 断言项
  assertions:
    # blob 响应直接返回 response.data
    blob_returns_data_directly: true
    # arraybuffer 响应直接返回 response.data
    arraybuffer_returns_data_directly: true
    # JSON 响应正常解构为 response.data.data
    json_destructures_correctly: true
    # 无 ElMessage.error 误报
    no_false_error_message: true
    # 拦截器含 responseType 分支判断
    interceptor_has_response_type_branch: true
  # 扫描目录
  scan_dirs:
    - "admin-web/src/"

# ============================================================
# 阶段 72：工作流重跑前后状态验证
# 测试步骤：记录快照 → 调用 retry → 验证 workflow_id 一致 → 验证步骤处理 → 验证状态重置 → 验证入队
# ============================================================
workflow_retry_state_test:
  description: "工作流重跑前后状态验证（阶段 72）"
  enabled: true
  severity: "CRITICAL"
  # 重跑起始步骤字段名（不硬编码字段名，通过配置管理）
  from_step_field: "from_step"
  # 触发者字段名
  triggered_by_field: "triggered_by"
  # 重跑后期望的初始状态
  expected_initial_status: "queued"
  # 需要重置的字段清单（重跑后应为 None）
  fields_to_reset:
    - "error"
    - "finished_at"
  # 前驱步骤应保留的状态
  preserved_step_status: "success"
  # 步骤记录字段名
  step_name_field: "step_name"
  step_status_field: "status"
  step_result_field: "result"
  # 优先队列 mock 配置
  priority_queue_mock:
    enabled: true
    method_name: "put"
    expected_call_count: 1
  # 断言项
  assertions:
    # 返回的 workflow_id 与传入一致（不创建新工作流）
    workflow_id_unchanged: true
    # from_step 及之后步骤被删除
    subsequent_steps_deleted: true
    # from_step 之前步骤保留且 status=success
    preceding_steps_preserved: true
    # 保留步骤的 result 字段完整
    preserved_result_complete: true
    # 工作流状态重置为 queued
    status_reset_to_queued: true
    # error 字段被清空
    error_field_cleared: true
    # finished_at 字段被清空
    finished_at_field_cleared: true
    # 工作流重新入队
    workflow_re_enqueued: true

# ============================================================
# 阶段 73：时区敏感测试基线对齐
# 测试步骤：grep utcnow → 确认生产时间函数 → 对齐基线 → 近似断言 → 连续 3 次稳定性验证
# ============================================================
timezone_baseline_alignment_test:
  description: "时区敏感测试基线对齐（阶段 73）"
  enabled: true
  severity: "MEDIUM"
  # 测试代码中禁止使用的时间函数
  forbidden_time_functions:
    - "datetime\\.utcnow\\(\\)"
    - "datetime\\.utcnow\\(\\)\\.replace\\(tzinfo=None\\)"
  # 生产代码使用的时间函数（用于对齐测试基线）
  production_time_function: "utcnow_naive"
  # 生产时间函数返回类型（local_time 或 utc_time）
  production_returns: "local_time"
  # 时间比较近似断言的 epsilon 值（秒）
  epsilon_seconds: 1.0
  # 稳定性验证运行次数
  stability_run_count: 3
  # 精确等于断言检查（命中即 WARN，建议改近似断言）
  exact_equality_patterns:
    - "==\\s*datetime\\."
    - "assertEqual\\(.*datetime\\."
  # 断言项
  assertions:
    # 测试代码不使用 forbidden_time_functions
    no_forbidden_time_functions: true
    # 测试时间基线与生产代码一致
    baseline_aligned: true
    # 时间比较使用近似断言
    approximate_assertions: true
    # 连续运行 3 次稳定通过
    stability_verified: true
  # 扫描目录（测试文件）
  scan_dirs:
    - "backend/tests/"

# ============================================================
# 阶段 74：外键关联删除验证
# 测试步骤：创建父子记录 → 验证 PRAGMA 默认未开启 → 调用删除 → 验证子表外键处理 → 验证不依赖 PRAGMA
# ============================================================
foreign_key_cascade_delete_test:
  description: "外键关联删除验证（阶段 74）"
  enabled: true
  severity: "HIGH"
  # 父表配置（不硬编码表名，通过配置管理）
  parent_table:
    name: "channel"
    # 创建父记录的 API 端点
    create_endpoint: "/api/admin/channels"
    # 删除父记录的 API 端点
    delete_endpoint: "/api/admin/channels/{id}"
  # 子表配置（外键指向父表）
  child_table:
    name: "episode"
    # 外键字段名
    foreign_key_field: "channel_id"
    # 创建子记录的 API 端点
    create_endpoint: "/api/admin/episodes"
    # 查询子记录的 API 端点
    query_endpoint: "/api/admin/episodes?channel_id={id}"
  # 期望的级联动作（set_null / cascade / restrict）
  expected_cascade_action: "set_null"
  # 是否验证不依赖 PRAGMA foreign_keys 开关
  check_pragma_independence: true
  # PRAGMA 查询语句
  pragma_query: "PRAGMA foreign_keys"
  # 测试环境期望的 PRAGMA 值（默认未开启）
  expected_pragma_value: 0
  # 断言项
  assertions:
    # 子表外键按 expected_cascade_action 处理
    foreign_key_handled_correctly: true
    # 父记录已删除
    parent_record_deleted: true
    # 行为不依赖 PRAGMA foreign_keys 开关
    pragma_independent: true
    # 测试环境与生产环境行为一致
    env_consistent: true

# ============================================================
# 阶段 75：flaky 测试根因修复验证
# 测试步骤：识别 flaky → 分析根因 → 对齐基线/mock 时间 → 近似断言 → 连续 3 次稳定性验证
# ============================================================
flaky_root_cause_fix_test:
  description: "flaky 测试根因修复验证（阶段 75）"
  enabled: true
  severity: "MEDIUM"
  # 已知 flaky 测试清单（测试用例 ID 或文件名）
  known_flaky_tests: []
  # 根因分类清单
  root_cause_categories:
    - "timezone"          # 时区差（utcnow vs now）
    - "concurrency"       # 并发竞态
    - "random"            # 随机数未固定
    - "time_precision"    # 时间精度（微秒差）
    - "test_order"        # 测试执行顺序依赖
    - "resource_leak"     # 资源泄漏（文件/连接未释放）
  # 时间比较近似断言的 epsilon 值（秒）
  epsilon_seconds: 1.0
  # 稳定性验证运行次数
  stability_run_count: 3
  # 是否检查修复引入新失败
  check_no_new_failures: true
  # 随机种子固定值（用于固定随机数）
  random_seed: 42
  # 断言项
  assertions:
    # 根因已分类
    root_cause_classified: true
    # 根因已消除
    root_cause_eliminated: true
    # 连续运行 stability_run_count 次稳定通过
    stability_verified: true
    # 修复未引入新的测试失败
    no_new_failures: true

# ============================================================
# 测试流程优化 1：区分本次引入 vs 预先存在的失败
# ============================================================
test_failure_diff_check:
  description: "区分本次修改引入 vs 预先存在的测试失败（流程优化 1）"
  enabled: true
  stash_command: "git stash push -u"
  pop_command: "git stash pop"
  test_command: "pytest --asyncio-mode=auto"
  # 如 stashed 状态测试环境不可用则跳过本流程
  skip_on_env_unavailable: true
  # 失败分类
  classification:
    preexisting_failure: "business_data"
    regression_introduced: "code_defect"
  # 严重级别
  severity_on_regression: "FAIL"
  severity_on_preexisting: "WARN"

# ============================================================
# 测试流程优化 2：分步验证策略
# ============================================================
stepwise_verification_strategy:
  description: "分步验证策略（流程优化 2）"
  enabled: true
  steps:
    - name: "syntax_check"
      command: "python -m py_compile {modified_file}"
      stop_on_fail: true
    - name: "target_test"
      command: "pytest {target_test_file} -v"
      stop_on_fail: true
    - name: "full_test_suite"
      command: "pytest --asyncio-mode=auto"
      # 完整套件失败时区分回归 vs 预先存在
      stop_on_fail: false
    - name: "frontend_build"
      command: "npm run build"
      stop_on_fail: true
      cwd: "admin-web"
  # 是否记录每步执行耗时
  record_timing: true

# ============================================================
# 测试流程优化 3：PowerShell 兼容性策略
# ============================================================
powershell_compatibility_strategy:
  description: "PowerShell 兼容性策略（流程优化 3）"
  enabled: true
  # 禁止的语法（PowerShell 5.x 不支持）
  forbidden_syntax:
    - "&&"
    - "||"
  # 推荐的命令分隔符
  recommended_separator: ";"
  # Python 脚本调用规范
  require_python_unbuffered: true
  require_stderr_redirect: true
  python_call_pattern: "python -u {script} 2>&1"
  # 临时脚本管理
  temp_script_dir: ".tmp"
  cleanup_temp_scripts: true
  # 禁止因 PowerShell RemoteException 警告而 exit 1
  forbidden_exit_on_warning: true
  # 扫描文件（检查 PowerShell 兼容性）
  scan_files:
    - "*.ps1"
    - "package.json"
  # 严重级别
  severity_on_violation: "WARN"

# ============================================================
# 测试阶段 87：小程序原生代码 4 维静态验证（R174）
# 来源：2026-07-31 微信登录修复复盘。小程序原生代码无法用 Playwright 直接测试，
#       需通过语法/接口/契约/渲染 4 维静态验证覆盖。
# ============================================================
miniprogram_static_check:
  description: "小程序原生代码 4 维静态验证（语法/接口/契约/渲染）"
  enabled: true
  # 触发本阶段的文件 glob 模式（修改任一匹配文件即触发）
  trigger_on_files:
    - "miniprogram/**/*.js"
    - "miniprogram/**/*.wxml"
    - "miniprogram/**/*.wxss"
    - "miniprogram/**/*.json"
  # 4 维验证配置（每维独立 severity）
  dimensions:
    - id: "syntax"
      name: "语法维"
      description: "用 node --check 检查所有修改的 .js 文件语法"
      command: "node --check {file}"
      applicable_files: ["miniprogram/**/*.js"]
      stop_on_fail: true
      severity_on_fail: "FAIL"
    - id: "interface"
      name: "接口维"
      description: "验证调用的依赖模块函数签名一致"
      check_items:
        - "require() 路径存在"
        - "导出函数名与调用方一致"
        - "参数个数与签名一致"
        - "返回值结构与使用方一致"
      applicable_files: ["miniprogram/**/*.js"]
      stop_on_fail: true
      severity_on_fail: "FAIL"
    - id: "contract"
      name: "契约维"
      description: "验证前端请求/响应字段与后端路由定义对齐"
      check_items:
        - "请求字段名 vs 后端 Pydantic Model 字段名"
        - "响应字段名 vs 前端使用字段名"
        - "snake_case / camelCase 一致性"
        - "兜底链数据源完整性"
      backend_route_glob: "backend/app/routers/**/*.py"
      applicable_files: ["miniprogram/**/*.js"]
      stop_on_fail: false
      severity_on_fail: "WARN"
    - id: "render"
      name: "渲染维"
      description: "验证 .wxml 数据绑定字段名与 setData 一致"
      check_items:
        - "wxml 中 {{field}} 在 data 或 setData 中存在"
        - "wx:for 绑定的数组名在 data 中存在"
        - "绑定的函数名在 Page/Component methods 中存在"
      applicable_files: ["miniprogram/**/*.wxml", "miniprogram/**/*.js"]
      stop_on_fail: false
      severity_on_fail: "WARN"
  # 报告格式
  report_format: "dimension_table"
  report_columns: ["dimension", "status", "issues", "file", "line"]
  # 修改了小程序代码但跳过 4 维验证属严重违规
  severity_on_skip: "FAIL"
  skip_detection:
    grep_pattern: "node --check"
    check_location: "git commit message + PR description"

# ============================================================
# 测试阶段 88：前后端字段契约验证清单（R175）
# 来源：2026-07-31 微信登录修复复盘。规范 R16 定义原则，本阶段补充可操作的验证清单。
# ============================================================
field_contract_check:
  description: "前后端字段契约验证清单（请求/响应/兜底链）"
  enabled: true
  # API 变更检测（匹配任一 glob 即触发本阶段）
  trigger_on_api_changes: true
  api_change_detection:
    backend_glob:
      - "backend/app/routers/**/*.py"
      - "backend/app/schemas/**/*.py"
    frontend_glob:
      - "admin-web/src/api/**/*.js"
      - "miniprogram/services/*.js"
  # 3 项验证清单
  verification_items:
    - id: "request_fields"
      name: "请求字段对齐"
      description: "前端发送的字段名 vs 后端 Pydantic Model 字段名"
      check_method: "对比前端 api.js 请求 payload 与后端 Pydantic Schema 字段"
      severity_on_mismatch: "FAIL"
    - id: "response_fields"
      name: "响应字段对齐"
      description: "后端返回的字段名 vs 前端使用的字段名"
      check_method: "对比后端路由返回 dict 与前端 res.xxx 取值"
      severity_on_mismatch: "FAIL"
    - id: "fallback_chain"
      name: "兜底链数据源验证"
      description: "前端多名字兜底（如 avatar_url || avatar || avatarUrl）每个名字都有数据源"
      check_method: "提取 || 链中每个字段名，验证至少一个数据源返回"
      severity_on_redundant: "WARN"
  # 命名风格（可配置为 camelCase/kebab-case 等）
  naming_style:
    backend: "snake_case"
    frontend_passthrough: true
    forbid_camelcase_transform: true
  # 已知字段对清单（前端使用了 frontend_wrong 字段即违规）
  known_field_pairs:
    - backend: "audio_url"
      frontend_wrong: "audioUrl"
      description: "音频地址（snake_case 透传）"
      severity: "MEDIUM"
    - backend: "episode_id"
      frontend_wrong: "episodeId"
      description: "节目 ID（前端变量可用 camelCase，但取后端字段需用 episode_id）"
      severity: "LOW"
    - backend: "categories"
      frontend_wrong: "category"
      description: "分类列表（复数，禁止单数）"
      severity: "MEDIUM"
    - backend: "script"
      frontend_wrong: "content"
      description: "稿件内容（历史兼容可 fallback：res.script || res.content）"
      severity: "MEDIUM"
      allow_fallback: true
    - backend: "placements"
      frontend_wrong: "dates"
      description: "排期投放数组（结构不同，dates 是 map，placements 是数组）"
      severity: "HIGH"
    - backend: "avatar_url"
      frontend_wrong: "avatarUrl"
      description: "头像地址（snake_case 透传，前端兜底链可包含）"
      severity: "MEDIUM"
      allow_fallback: true
  # 报告格式
  report_format: "contract_matrix"
  report_columns: ["api_endpoint", "field_name", "backend_definition", "frontend_usage", "status", "severity", "suggestion"]
  # 跨技能联动：与前端代码审查的字段对配置保持一致
  cross_reference_config: "news-frontend-code-review/config.yaml#field_contract_frontend"
