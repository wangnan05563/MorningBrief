  expected_metadata:
    - "product_name"
    - "version"
    - "build_date"
    - "git_sha"
    - "python_version"
    - "platform"
  # 检查更新按钮选择器
  check_update_button_selector: "button.check-update"
  # 检查更新接口端点
  update_check_endpoint: "/api/admin/about/check-update"
  # 检查更新失败时降级显示的文本
  fallback_source_text: "本地"
  # Help 页面路径
  help_page_path: "/help"
  # Help 页面预期章节数量
  expected_section_count: 8
  # Help 侧边栏选择器
  help_sidebar_selector: ".help-sidebar"
  # Help 搜索框选择器
