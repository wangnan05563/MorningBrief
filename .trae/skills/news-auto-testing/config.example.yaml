  test_search_keyword: "频道"
  # 是否要求章节滚动高亮
  require_scroll_highlight: true
  # 严重级别
  severity_on_metadata_missing: "WARN"
  severity_on_check_update_no_fallback: "FAIL"
  severity_on_anchor_no_response: "FAIL"
  severity_on_no_scroll_highlight: "WARN"
  severity_on_search_no_result: "WARN"
  severity_on_search_error: "FAIL"

# ---- 阶段 41：关键指标监控告警测试 ----
# 背景：P0 改进实施引入关键指标监控告警，要求低于阈值时记录 WARNING 日志。
monitoring_thresholds_test:
  enabled: true
  # 关键词命中率阈值（低于此值触发 WARNING）
  keyword_hit_rate_threshold: 0.10
  # LLM 字数达成率阈值（低于此值触发 WARNING）
  llm_word_achievement_threshold: 0.80
  # TTS 成功率阈值（低于此值触发 WARNING）
  tts_success_rate_threshold: 0.90
  # 工作流成功率阈值（低于此值触发 WARNING）
  workflow_success_rate_threshold: 0.95
  # 日志文件路径（如配置则从文件 grep）
  log_file_path: "backend/logs/app.log"
  # 日志查询接口端点（如配置则从接口查询，优先于文件）
  log_query_endpoint: "/api/admin/logs/query"
  # 工作流触发接口端点
  workflow_trigger_endpoint: "/api/internal/workflow/trigger"
  # LLM 测试接口端点
  llm_test_endpoint: "/api/admin/ai/test-llm"
  # TTS 测试接口端点
  tts_test_endpoint: "/api/admin/ai/test-tts"
  # 工作流历史接口端点
  workflow_history_endpoint: "/api/admin/workflows?page=1&size=20"
  # 工作流完成等待超时（秒）
  workflow_completion_timeout_sec: 60
  # 工作流历史查询条数（用于计算成功率）
  workflow_history_limit: 20
  # WARNING 日志必需字段
  required_log_fields:
    - "metric_name"
    - "current_value"
    - "threshold_value"
    - "timestamp"
  # 期望的日志级别
  expected_log_level: "WARNING"
  # 严重级别
  severity_on_no_warning_logged: "FAIL"
  severity_on_wrong_log_level: "WARN"
  severity_on_incomplete_log: "WARN"
  severity_on_endpoint_unavailable: "FAIL"

# ---- 阶段 42：频道素材健康度仪表盘测试 ----
# 背景：P1 改进实施新增频道素材健康度仪表盘，验证端点返回完整数据 + 健康度三级判定正确。
channel_health_dashboard_test:
  enabled: true
  # 频道健康度端点
  channel_health_endpoint: "/api/admin/channel-health"
  # RSS 健康度端点
  rss_health_endpoint: "/api/admin/rss-health"
  # 预期频道数量（如为 0 则不校验数量）
  expected_channel_count: 5
  # 频道数据必需字段
  required_channel_fields:
    - "channel_id"
    - "channel_name"
    - "material_count"
    - "recent_7d_count"
    - "health_level"
  # RSS 源数据必需字段
  required_rss_fields:
    - "url"
    - "http_status"
    - "response_time_ms"
    - "availability"
  # 健康度判定阈值（healthy 级别）
  healthy_threshold:
    recent_7d_min: 5
    material_min: 30
  # 健康度判定阈值（critical 级别，低于此值为 critical）
  critical_threshold:
    recent_7d_min: 1
    material_min: 5
  # RSS 响应时间阈值（毫秒，超过此值视为 unavailable）
  rss_response_time_threshold: 5000
  # RSS 可用性判定字段值
  rss_availability_values:
    available: "available"
    unavailable: "unavailable"
  # 健康度等级值
  health_level_values:
    healthy: "healthy"
    warning: "warning"
    critical: "critical"
  # 严重级别
  severity_on_endpoint_failure: "FAIL"
  severity_on_field_missing: "WARN"
  severity_on_health_level_mismatch: "FAIL"
  severity_on_availability_mismatch: "FAIL"

# ============================================================
# === 2026-07-21 新增：小程序真机调试复盘测试配置（阶段 43-46）===
# ============================================================
# 对应 news-code-dev 元规范 R101-R108，详见 SKILL.md 阶段 43-46
# 复制本文件为 config.yaml 后按业务实际调整以下参数

# ---- 阶段 43：小程序 Page 方法名唯一性测试（对应 R101）----
# 背景：Page 对象内 onLoad 重复定义或与 wxml bindload 回调重名导致生命周期失效
stage_43_page_method_uniqueness:
  enabled: true
  scan_glob: "miniprogram/pages/**/*.js"
  lifecycle_methods:
    - "onLoad"
    - "onShow"
    - "onReady"
    - "onHide"
    - "onUnload"
    - "onPullDownRefresh"
    - "onReachBottom"
  wxml_callback_patterns:
    - "bindload"
    - "binderror"
    - "bindtap"
    - "bindinput"
    - "bindchange"
  forbid_duplicate_keys: true
  forbid_lifecycle_collision: true
  severity_on_duplicate: "FAIL"
  severity_on_lifecycle_collision: "FAIL"
  severity_on_custom_method_collision: "WARN"

# ---- 阶段 44：小程序外链 ActionSheet 兜底测试（对应 R104）----
# 背景：业务域名未配置时 wx.navigateTo 跳转 webview 白屏，binderror 不触发
stage_44_external_link_fallback:
  enabled: true
  scan_glob: "miniprogram/pages/**/*.js"
  nav_patterns:
    - "wx.navigateTo.*webview"
    - "wx.navigateTo.*url.*http"
    - "wx.navigateTo.*url.*encodeURIComponent"
  require_action_sheet: true
  require_fail_callback: true
  required_actions:
    - "复制链接"
    - "在小程序内打开"
  fallback_to_clipboard: true
  clipboard_function_pattern: "_copySourceUrl|_copyToClipboard"
  test_urls:
    - "https://example.com/article/1"
    - "https://example.com/article/中文路径"
    - "https://example.com/article?a=1&b=2"
  severity_on_no_action_sheet: "FAIL"
  severity_on_no_fail_callback: "FAIL"
  severity_on_missing_copy_action: "WARN"

# ---- 阶段 45：跨页布局一致性测试（对应 R108）----
# 背景：列表页与详情页布局不一致导致用户视觉跳跃
stage_45_cross_page_layout_consistency:
  enabled: true
  page_pairs:
    - source: "pages/index/index"
      target: "pages/history/history"
      shared_card_class: "episode-row-card"
    - source: "pages/index/index"
      target: "pages/detail/detail"
      shared_card_class: "episode-row-card"
  require_enrich_episode_sync: true
  required_fields:
    - "date_label"
    - "duration_label"
    - "play_count"
    - "channel_name"
  screenshot_compare: true
  diff_threshold: 0.1
  consistent_style_fields:
    - "padding"
    - "margin"
    - "border-radius"
    - "font-size"
  severity_on_class_mismatch: "FAIL"
  severity_on_field_missing: "FAIL"
  severity_on_style_diff: "WARN"

# ---- 阶段 46：聚合序号独立计数测试（对应 R106 后端侧）----
# 背景：sources 序号从 2 开始因后端复用 segment.seq
stage_46_aggregated_seq_independence:
  enabled: true
  api_endpoint: "/api/v1/episodes/{id}/script"
  aggregated_fields:
    - "sources"
    - "chapters"
    - "timestamps"
  require_start_from_one: true
  forbid_reuse_segment_seq: true
  require_continuous: true
  test_episode_ids:
    - 1
    - 2
    - 3
  seq_field: "seq"
  severity_on_not_from_one: "FAIL"
  severity_on_reuse_segment_seq: "FAIL"
  severity_on_jump: "WARN"

