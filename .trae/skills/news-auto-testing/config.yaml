# --- 自定义占位符 ---
# 扩展内置占位符（${username}/${password}/${current_date}/${current_month}/${current_year}/${timestamp}）
# 用于 API 路径和请求体中的项目特定变量替换
# 替换顺序：先自定义占位符，再内置占位符
placeholders:
  # 示例：${admin_role} → "admin"
  admin_role: "admin"
  # 示例：${default_page_size} → "20"
  default_page_size: "20"

# --- 性能阈值 ---
performance:
  # 是否启用 Lighthouse 审计
  lighthouse_enabled: true
  # Lighthouse 审计的页面（从 pages 中选择，用 path 匹配）
  lighthouse_pages: ["/login"]
  # Lighthouse 最低分数阈值（低于则报告 warning）
  lighthouse_thresholds:
    accessibility: 85
    best_practices: 85
    seo: 75
  # Lighthouse 设备类型
  lighthouse_device: "desktop"  # desktop | mobile
  # Lighthouse 隔离 context（避免登录态干扰审计未登录页面）
  lighthouse_isolated_context:
    # 是否启用隔离 context
    enabled: true
    # 隔离 context 名称（同一名称的 context 共享 cookie/storage）
    context_name: "lighthouse-audit"
  # 是否启用 Performance Trace
  trace_enabled: true
  # Trace 的页面
  trace_pages: ["/login"]
  # 性能指标阈值（超出则报告 warning）
  metrics_thresholds:
    lcp_max_ms: 2500      # LCP 最大允许值（毫秒）
    cls_max: 0.1           # CLS 最大允许值
    ttfb_max_ms: 800       # TTFB 最大允许值（毫秒）
  # Trace 失败时是否降级为仅 Lighthouse 结果
  trace_failure_degrade: true

# --- 判断逻辑 ---
assertions:
  # 页面加载成功的判断条件（全部满足才算通过）
  page_success_criteria:
    - "无控制台 error 级别日志（排除白名单）"
    - "页面网络请求返回 200"
    - "页面可见文本包含至少一个 expected_texts"
  # API 调用成功的判断条件
  api_success_criteria:
    - "HTTP 状态码等于 expected_status"
    - "响应 JSON 的 code 字段等于 expected_code 或在 acceptable_codes 中"
  # 登录成功的判断条件
  login_success_criteria:
    - "登录 API 返回 200"
    - "响应 JSON 包含 token 字段"
    - "页面 URL 跳转到 expected_redirect"
    - "页面显示用户名和角色信息"
  # 测试结果严重级别
  severity_levels:
    - "PASS"     # 通过
    - "WARN"     # 警告（不影响整体结果）
    - "FAIL"     # 失败（需要修复）
    - "SKIP"     # 跳过（条件不满足）
  # 控制台 error 白名单（匹配 error 消息子串，命中则归类为 framework_behavior 不算 FAIL）
  console_error_whitelist:
    - "cancel"                    # Element Plus MessageBox 取消时的预期 error
    - "NavigationDuplicated"      # Vue Router 重复导航的预期 error
  # 文本匹配模式（用于 expected_texts 验证）
  # any_substring: expected_texts 中任一文本作为子串出现在页面可见文本中即匹配
  # exact: expected_texts 中任一文本与页面可见文本完全匹配
  # regex: expected_texts 中任一文本作为正则表达式匹配页面可见文本
  text_match_mode: "any_substring"

# --- 问题分类 ---
# 发现的问题按此分类，只有 code_defect 触发代码修复流程
issue_classification:
  # 代码缺陷：需修改源码修复
  code_defect:
    # 匹配关键词（用于自动分类控制台 error/warn）
    match_keywords:
      - "Failed to load module script"
      - "MIME type"
      - "404 Not Found"
      - "is not defined"
      - "is not a function"
    action: "fix_code"
  # 业务数据问题：需配置/数据修复，非代码缺陷
  business_data:
    match_keywords:
      - "尚未发布"
      - "为空"
      - "未配置"
      - "占位符"
    action: "report_only"
  # 框架预期行为：无需修复
  framework_behavior:
    match_keywords:
      - "cancel"
      - "deprecated"
      - "NavigationDuplicated"
    action: "ignore"
  # 环境问题：需环境层面修复
  environment:
    match_keywords:
      - "ECONNREFUSED"
      - "ENOENT"
      - "cannot find module"
    action: "fix_environment"

# --- 常见问题修复策略 ---
# 测试过程中可能遇到的问题及自动修复策略
fix_strategies:
  # 前端静态文件 404
  - problem: "前端页面返回 404 Not Found"
    diagnosis: "后端未正确挂载前端静态文件目录"
    fix: "检查 paths.py 中 resolve_admin_dist() 的路径是否指向实际构建产物目录"
    severity: "FAIL"

  # JS MIME 类型错误
  - problem: "Failed to load module script: MIME type of text/plain"
    diagnosis: "Windows mimetypes 模块缺少 .js/.css 的 MIME 映射"
    fix: "在 main.py 顶部添加 mimetypes.add_type() 显式注册 application/javascript 等"
    severity: "FAIL"

  # Playwright 浏览器未安装
  - problem: "Executable doesn't exist at chromium-XXXX"
    diagnosis: "Playwright 浏览器未安装或版本不匹配"
    fix: "运行 npx playwright install chromium 安装浏览器；版本不匹配时创建 junction 目录链接"
    severity: "WARN"

  # Chrome DevTools 元素交互超时
  - problem: "Element did not become interactive within timeout"
    diagnosis: "UI 组件库（如 Element Plus）的菜单项可能不是标准可点击元素"
    fix: "改用直接导航到页面 URL 的方式替代点击菜单项"
    severity: "WARN"

  # 健康检查超时
  - problem: "健康检查超时"
    diagnosis: "服务启动慢或初始化阻塞（如 APScheduler 启动）"
    fix: "增加 health_timeout 值或检查 lifespan 中的初始化逻辑是否有阻塞"
    severity: "FAIL"

  # PowerShell curl 引号转义
  - problem: "curl.exe -d JSON 参数解析失败"
    diagnosis: "PowerShell 中双引号转义与 curl.exe 不兼容"
    fix: "改用 PowerShell 的 Invoke-RestMethod 替代 curl.exe"
    severity: "WARN"

  # 数据库无管理员账号
  - problem: "登录失败：用户名或密码错误"
    diagnosis: "数据库 admin_user 表为空，无初始管理员账号"
    fix: "用 bcrypt 哈希密码后 INSERT 到 admin_user 表"
    severity: "FAIL"

  # 全页截图超时
  - problem: "Page.captureScreenshot timed out"
    diagnosis: "页面 DOM 复杂导致全页截图超时"
    fix: "降级为视口截图（screenshot.full_page=false）"
    severity: "WARN"

  # 快照输出被截断
  - problem: "快照输出过大被截断"
    diagnosis: "a11y 树过大（如日历/表格组件）"
    fix: "保存快照到文件后读取（snapshot.save_dir）"
    severity: "WARN"

  # 菜单点击不跳转
  - problem: "菜单点击成功但 URL 未变化"
    diagnosis: "UI 组件库菜单项路由未触发"
    fix: "自动改用 navigate_page 直接导航（menu_click_fallback）"
    severity: "WARN"

  # UI 组件库废弃 API 警告
  - problem: "label act as value is about to be deprecated"
    diagnosis: "UI 组件库（如 Element Plus）API 即将废弃"
    fix: "升级为新 API 用法（如 label → value）"
    severity: "WARN"
    issue_class: "code_defect"

  # 图表插件未注册
  - problem: "without the 'Filler' plugin enabled"
    diagnosis: "图表库（如 Chart.js）使用了 fill 选项但未注册对应插件"
    fix: "import 并 register 缺失的插件"
    severity: "WARN"
    issue_class: "code_defect"

# --- 截图策略 ---
screenshot:
  # 是否使用全页截图（false=仅视口截图，避免复杂页面超时）
  full_page: false
  # 截图超时（毫秒），超时后自动降级为视口截图
  timeout_ms: 10000
  # 是否强制使用绝对路径（MCP 工具 cwd 可能与项目目录不同）
  use_absolute_path: true
  # 截图保存目录（相对于项目根目录，配合页面名生成文件名）
  save_dir: "docs/test-reports/screenshots"
  # 截图格式
  format: "png"  # png | jpeg | webp

# --- 快照策略 ---
snapshot:
  # 快照最大大小（KB），超过则自动保存到文件避免输出截断
  max_size_kb: 8
  # 是否将大快照保存到文件
  save_to_file: true
  # 快照保存目录（相对于项目根目录）
  save_dir: "docs/test-reports/snapshots"
  # 是否使用 verbose 模式（包含完整 a11y 树信息）
  verbose: false

# --- 报告配置 ---
report:
  # 报告输出目录（为空则不写文件，仅输出到对话）
  output_dir: "docs/test-reports"
  # 报告格式
  format: "markdown"
  # 是否包含截图引用
  include_screenshots: true
  # 是否包含性能数据
  include_performance: true
  # 是否包含修复建议
  include_fix_suggestions: true
  # 是否包含按钮交互结果
  include_button_results: true
  # 是否包含问题分类信息
  include_issue_classification: true
  # 最大问题数（超过则概括）
  max_issues: 20

# --- 测试流程控制 ---
workflow:
  # 是否在测试前自动启动服务
  auto_start_service: true
  # 是否在测试后自动停止服务
  auto_stop_service: false
  # 遇到 FAIL 时是否继续测试
  continue_on_failure: true
  # 遇到 FAIL 时是否自动尝试修复
  auto_fix: true
  # 修复后是否自动回归测试
  regression_after_fix: true
  # 最大修复尝试次数
  max_fix_attempts: 3
  # 是否并行测试多个页面（通过 dispatching-parallel-agents）
  parallel_pages: false
  # 菜单点击 fallback（菜单点击不跳转时自动改用 URL 导航）
  menu_click_fallback:
    # 是否启用菜单点击 fallback
    enabled: true
    # 检测方式：点击后比对 URL 是否变化
    detect: "url_unchanged_after_click"
    # fallback 方式：直接导航到目标 URL
    fallback_action: "navigate_page"
  # 回归前构建（修复代码后重新构建前端）
  build_before_regression:
    # 是否启用回归前构建
    enabled: true
    # 构建命令
    command: "npm run build"
    # 构建工作目录（相对于项目根目录）
    cwd: "admin-web"
    # 是否检查 node_modules 完整性（构建失败时重装依赖）
    check_node_modules: true
    # 依赖完整性检查的目标文件（不存在则重装）
    node_modules_check_file: "node_modules/element-plus/dist/index.css"
    # 重装依赖命令
    reinstall_command: "npm install"
  # 回归测试缓存策略
  regression_cache_strategy:
    # 是否强制刷新页面（ignoreCache）
    ignore_cache: true
    # 是否清除 localStorage（避免旧 token 干扰）
    clear_storage: false

# --- 测试用例优先级分类（P0-P3）---
# 用于测试报告分类标识和执行顺序控制
test_priority:
  # P0：阻塞性测试（必须全部通过才能发布）
  P0:
    name: "阻塞性"
    description: "核心功能、安全相关，失败必须立即修复，阻止发布"
    color: "red"
    fail_action: "block_release"       # 阻止发布
    run_first: true                     # 优先执行
    examples:
      - "健康检查"
      - "登录流程"
      - "内容安全检测"
      - "数据库备份"
      - "今日节目"

  # P1：高优先级测试（重要功能，失败需尽快修复）
  P1:
    name: "高优先级"
    description: "重要业务功能，失败需在发版前修复"
    color: "orange"
    fail_action: "fix_before_release"  # 发版前修复
    run_first: false
    examples:
      - "审核列表"
      - "播放进度上报"
      - "收藏/取消收藏"
      - "提交反馈"
      - "验证码获取"
      - "feedback同步"
      - "批量删除"

  # P2：中优先级测试（辅助功能，失败可降级处理）
  P2:
    name: "中优先级"
    description: "辅助功能和非核心路径，失败可降级或下个迭代修复"
    color: "yellow"
    fail_action: "fix_next_iteration"  # 下个迭代修复
    run_first: false
    examples:
      - "倍速播放"
      - "快进快退"
      - "收藏列表"
      - "频道筛选"
      - "拖拽排序"
      - "柱状图数据"
      - "90天统计趋势"

  # P3：低优先级测试（边缘场景，失败仅记录）
  P3:
    name: "低优先级"
    description: "边缘场景和非关键 UI，失败仅记录不阻塞"
    color: "gray"
    fail_action: "log_only"            # 仅记录
    run_first: false
    examples:
      - "页面文本匹配"
      - "Lighthouse 性能审计"
      - "UI 组件库废弃 API 警告"

  # 默认优先级（未标注 priority 的测试用例）
  default_priority: "P2"
  # 报告中是否按优先级分组展示
  group_by_priority: true
  # 优先级执行顺序（P0 最先执行）
  execution_order: ["P0", "P1", "P2", "P3"]

# --- 环境隔离检查 ---
# 扫描代码中硬编码的 localhost/127.0.0.1，确保真机测试可达
env_isolation_check:
  # 是否启用环境隔离检查
  enabled: true
  # 检查阶段：pre_test（测试前预检）/ post_test（测试后验证）
  check_phase: "pre_test"
  # 需要扫描的文件清单（相对项目根目录）
  scan_files:
    - path: "miniprogram/services/api.js"
      # 硬编码值模式（出现即告警）
      hardcoded_patterns:
        - "http://127.0.0.1"
        - "http://localhost"
        - "http://0.0.0.0"
      # 期望来源（说明应从何处读取）
      expected_source: "应通过配置文件或环境变量读取"
    - path: "backend/app/services/content_service.py"
      hardcoded_patterns:
        - "http://localhost:8000"
        - "http://127.0.0.1:8000"
      expected_source: "应从 settings.AUDIO_BASE_URL 读取"
    - path: "backend/.env"
      # .env 中检查关键字段
      required_fields:
        APP_HOST: "0.0.0.0"
        AUDIO_BASE_URL: "http://<lan_ip>:8000"
  # LAN IP 自动检测命令（Windows PowerShell）
  lan_ip_detect_command: "ipconfig | Select-String 'IPv4'"
  # 严重级别：FAIL（真机测试必须修复）/ WARN（仅模拟器测试可忽略）
  severity_on_violation: "FAIL"
  # 修复建议
  fix_suggestion: "将所有硬编码 localhost/127.0.0.1 替换为局域网 IP，并通过配置文件管理"

# --- 小程序专项检查 ---
# 微信小程序页面文件完整性、事件绑定对称性检查
miniprogram_check:
  # 是否启用小程序专项检查
  enabled: true
  # 检查阶段
  check_phase: "pre_test"
  # 小程序根目录（相对项目根目录）
  root_dir: "miniprogram"
  # 页面四件套检查（每个页面必须有 .json/.js/.wxml/.wxss）
  page_files_check:
    enabled: true
    # 页面目录（相对 miniprogram root_dir）
    pages_dir: "pages"
    # 必需文件后缀
    required_extensions: [".json", ".js", ".wxml", ".wxss"]
    # 缺失文件严重级别
    severity_on_missing: "FAIL"
  # 事件绑定对称性检查（onXxx 必须有对应 offXxx）
  event_binding_check:
    enabled: true
    # 需要检查的页面文件（相对 miniprogram root_dir）
    scan_files:
      - "pages/index/index.js"
      - "pages/detail/detail.js"
      - "pages/profile/profile.js"
      - "pages/history/history.js"
    # 绑定方法前缀
    bind_prefixes: ["onPlay", "onPause", "onTimeUpdate", "onEnded", "onError", "onNext", "onPrev"]
    # 解绑方法前缀（与 bind_prefixes 一一对应）
    unbind_prefixes: ["offPlay", "offPause", "offTimeUpdate", "offEnded", "offError", "offNext", "offPrev"]
    # 解绑位置（onUnload / onHide）
    unbind_location: ["onUnload", "onHide"]
    # 严重级别
    severity_on_asymmetry: "WARN"
  # 401 重试循环防护检查
  auth_retry_check:
    enabled: true
    # 检查 api.js 中 request 函数是否有重试保护
    scan_files:
      - "services/api.js"
    # 必须存在的代码模式（任一缺失即告警）
    required_patterns:
      - "_retried"
      - "startsWith('/auth/')"
    severity_on_missing: "FAIL"

# --- 工具层 bug 特征库 ---
# 识别开发工具版本 bug，避免误判为代码缺陷
tool_bug_signatures:
  # 微信开发者工具 webview 路由 bug（3.17.0 灰度版）
  - name: "WeChat DevTools webview routing bug"
    tool: "wechat_devtools"
    # 受影响版本（正则）
    affected_versions: ["3.17.0"]
    version_pattern: '3\.17\.\d+'
    # 日志特征关键词（任一匹配即判定为工具层 bug）
    signature_keywords:
      - "routeDone with a webviewId"
      - "appservice/mainframe"
      - "mainframe 500"
    # 处理策略
    action: "downgrade_or_clear_cache"
    # 修复步骤
    fix_steps:
      - "降级调试基础库至稳定版（3.7.x 或 3.6.0）"
      - "清除开发者工具所有缓存（文件/数据/编译/网络/存储）"
      - "重启开发者工具"
      - "如仍无效，重装开发者工具"
    severity: "WARN"
    issue_class: "tool_layer_bug"
  # Edge 浏览器最小化自动恢复 bug
  - name: "Edge minimize auto-restore bug"
    tool: "edge"
    signature_keywords:
      - "window immediately restored after minimize"
    action: "reset_user_profile"
    fix_steps:
      - "关闭所有 Edge 窗口"
      - "重命名 %LOCALAPPDATA%\\Microsoft\\Edge\\User Data 为 User Data Backup"
      - "重启 Edge 重新生成用户配置"
    severity: "WARN"
    issue_class: "tool_layer_bug"

# --- 真机测试预检 ---
# 真机测试前的环境预检项（仅真机测试时启用）
realdevice_check:
  # 是否启用真机测试预检（默认关闭，真机测试时手动开启）
  enabled: false
  # 预检项清单
  preflight_checks:
    - name: "后端服务局域网可达性"
      check: "http_get"
      target: "${AUDIO_BASE_URL}/docs"
      expected: "HTTP 200"
      severity_on_fail: "FAIL"
    - name: "后端 APP_HOST 配置"
      check: "env_field"
      target: "backend/.env:APP_HOST"
      expected: "0.0.0.0"
      severity_on_fail: "FAIL"
    - name: "AUDIO_BASE_URL 配置"
      check: "env_field"
      target: "backend/.env:AUDIO_BASE_URL"
      expected: "http://<lan_ip>:8000"
      severity_on_fail: "FAIL"
    - name: "小程序 BASE_URL 配置"
      check: "file_pattern"
      target: "miniprogram/services/api.js"
      pattern: "BASE_URL.*http://<lan_ip>:8000"
      severity_on_fail: "FAIL"
    - name: "手机与电脑同 WiFi"
      check: "manual"
      instruction: "确保手机和电脑连接同一 WiFi 网络"
      severity_on_fail: "FAIL"
    - name: "开发者工具域名校验关闭"
      check: "manual"
      instruction: "微信开发者工具 → 详情 → 本地设置 → 勾选'不校验合法域名、web-view、TLS 版本以及 HTTPS 证书检查'"
      severity_on_fail: "FAIL"

# --- 异步交互测试配置 ---
async_interaction:
  # 异步按钮点击后等待响应的超时（毫秒）
  # 为什么：测试连接按钮点击后需等待 API 返回，否则读取快照看不到错误提示
  response_timeout_ms: 5000
  # 等待响应的轮询间隔（毫秒）
  poll_interval_ms: 500
  # 判断按钮已恢复可点击状态的信号（disabled 属性消失）
  button_ready_signal: "not disabled"
  # 异步操作期间按钮的禁用状态信号
  button_busy_signal: "disabled"

# --- 会话保持配置 ---
session_persistence:
  # 服务重启后登录态是否丢失
  # 为什么：服务重启后 cookie/localStorage 仍在但后端 token 失效，需重新登录
  relogin_after_restart: true
  # 检测登录态失效的信号
  auth_failure_signals:
    - "HTTP 500"
    - "未授权"
    - "登录已过期"
  # 自动重新登录的账号（从 credentials.admin 复用）
  auto_relogin: true

# --- 配置表单测试配置 ---
config_form_testing:
  # 密钥字段的脱敏前缀
  # 为什么：测试连接时前端回传 ****xxxx 脱敏值，后端需识别并回退到真实密钥
  masked_value_prefix: "****"
  # 字段标签禁用词（含义模糊的通用名称）
  # 为什么：API Key 标签含义模糊，应改为 AccessToken / SecretKey 等具体名称
  ambiguous_labels:
    - "API Key"
    - "App Key"
    - "Secret"
  # 密钥字段必须配套的获取入口超链接
  require_key_acquisition_link: true
  # 第三方错误码必须可读化
  third_party_error_code_readable: true

# --- AI 服务测试扩展 ---
ai_service_testing:
  # LLM 连接测试的最小请求参数
  llm_test_params:
    max_tokens: 5
    timeout_sec: 15
  # TTS 连接测试的鉴权请求参数
  tts_test_params:
    timeout_sec: 15
  # 阿里云 NLS 错误码可读化映射（与后端 NLS_ERROR_HINTS 一致）
  aliyun_nls_error_hints:
    40000001: "请确认填写的是 NLS AccessToken，而非 AccessKey Secret"
    40000010: "阿里云 NLS 免费试用已过期，请在控制台开通正式服务"
    40000004: "appkey 无效，请确认是 NLS 项目的 AppKey"
  # LLM 提供商预设列表（与后端 LLM_PRESETS 一致，用于测试时选择预设）
  llm_presets:
    - key: "qwen"
      label: "通义千问"
    - key: "openai"
      label: "OpenAI"
    - key: "deepseek"
      label: "DeepSeek"
    - key: "zhipu"
      label: "智谱 GLM"
    - key: "moonshot"
      label: "Moonshot"
    - key: "ernie"
      label: "百度文心"
    - key: "doubao"
      label: "字节豆包"
    - key: "ollama"
      label: "Ollama 本地"
    - key: "agnes"
      label: "Agnes AI"

# --- 数据库维护模块测试配置 ---
# 数据库维护页面预检（白名单表数、表浏览、CRUD、级联删除、导出导入）
# 复盘来源：2026-07-17 数据库维护模块 18/18 PASS 测试实践
db_admin_check:
  # 是否启用数据库维护模块测试
  enabled: true
  # 检查阶段：post_test（在常规测试后执行）
  check_phase: "post_test"
  # 页面路径（相对 base_url）
  page_path: "/maintenance/database-admin"
  # 页面预期文本（用于确认页面加载成功）
  expected_text: "数据库维护"
  # 白名单预期表数（与后端 DB_ADMIN_ALLOWED_TABLES 配置一致）
  expected_table_count: 16
  # 测试项配置
  checks:
    # 表浏览测试
    table_browse:
      enabled: true
      # 点击表名后检查右侧数据是否加载
      verify_data_loaded: true
    # CRUD 操作测试
    crud:
      enabled: true
      # 测试新增/编辑/删除的表（选择安全可测试的表，避免破坏核心数据）
      test_table: "feedback"
    # 级联删除预览测试
    cascade_delete:
      enabled: true
      # 检查级联预览弹窗是否显示受影响表和记录数
      verify_preview_dialog: true
    # 导出导入测试
    export_import:
      enabled: true
      # 导出格式
      export_format: "json"
      # 检查敏感字段是否脱敏
      verify_sensitive_masked: true
      # 敏感字段脱敏前缀
      masked_prefix: "****"

# --- 系统清理模块测试配置 ---
# 系统清理页面预检（dry_run 预览、VACUUM、过期记录清理、审计日志）
maintenance_check:
  # 是否启用系统清理模块测试
  enabled: true
  # 检查阶段
  check_phase: "post_test"
  # 页面路径
  page_path: "/maintenance/cleanup"
  # 页面预期文本
  expected_text: "系统清理"
  # 测试项配置
  checks:
    # dry_run 预览测试
    dry_run_preview:
      enabled: true
      # 默认是否为预览模式（安全优先）
      default_dry_run: true
    # VACUUM 测试
    vacuum:
      enabled: true
      # 检查数据库文件大小是否减小
      verify_size_reduced: true
    # 过期记录清理测试
    expired_cleanup:
      enabled: true
      # 清理类型列表（与后端 MAINTENANCE_CLEANUP_TYPES 配置一致）
      cleanup_types:
        - "expired_logs"
        - "orphan_files"
        - "temp_data"
    # 审计日志验证
    audit_log:
      enabled: true
      # 检查审计日志字段完整性
      required_fields:
        - "action"
        - "table_name"
        - "record_id"
        - "operator"
        - "created_at"

# --- CONFIRM_DELETE 令牌验证配置 ---
# 危险操作的令牌双重确认验证（删表/清空/VACUUM）
confirm_token_check:
  # 是否启用令牌验证测试
  enabled: true
  # 检查阶段
  check_phase: "post_test"
  # 令牌字符串（与后端 DB_ADMIN_CONFIRM_TOKEN 配置一致）
  token_string: "CONFIRM_DELETE"
  # 审计日志查询端点
  audit_log_endpoint: "/api/v1/audit-log"
  # 审计日志查询条数（查询最近 N 条）
  audit_log_limit: 50
  # 令牌比较方式验证（后端应使用 hmac.compare_digest）
  verify_hmac_compare: true

# === 2026-07-18 新增：SonarQube 迭代闭环复盘测试配置 ===
service_mode_detection:
  enabled: true
  patterns:
    dev:
      - "python -m uvicorn"
      - "python app/main.py"
      - "python -m app.main"
    exe:
      - ".exe"
    docker:
      - "docker run"
      - "docker compose"
  warn_on_unbuilt_changes: true
  unbuilt_change_patterns:
    - "backend/app/**/*.py"
    - "admin-web/src/**/*.{vue,js,ts}"
  rebuild_command: "构建打包.bat"

# API 登录协议适配（覆盖 credentials.admin 默认值）
login_protocol:
  default_content_type: "json"  # form | json
  fallback_to_form: false
  require_content_type_header: true

# 路由路径预验证
route_verification:
  enabled: true
  router_files:
    - "backend/app/routers/api/auth.py"
    - "backend/app/routers/admin/ads.py"
    - "backend/app/routers/internal/workflow.py"
  expected_prefixes:
    auth: "/api/auth"
    ads: "/api/admin/ads"
    workflow: "/api/internal"
  require_strict_match: true
  allow_suffix_only: false

# SonarQube 二次扫描回归
sonarqube_regression:
  enabled: true
  scanner_command: "sonar-scanner -Dsonar.projectKey=20_News -Dsonar.sources=backend/app,admin-web/src"
  token_env_var: "SONAR_TOKEN"
  scanner_path_env_var: "SONAR_SCANNER_HOME"
  task_search_endpoint: "http://localhost:9000/api/ce/tasks?component=20_News"
  issues_search_endpoint: "http://localhost:9000/api/issues/search?componentKeys=20_News"
  max_new_issues: 0
  max_wait_seconds: 300
  severity_must_fix:
    - "BLOCKER"
    - "CRITICAL"
  severity_should_fix:
    - "MAJOR"
  max_regression_retries: 3

# 三层测试验证（对应 news-code-dev S60 规范）
three_tier_testing:
  enabled: true
  unit_test_command: "pytest --asyncio-mode=auto"
  integration_test_command: "pytest tests/integration/"
  e2e_test_command: "python scripts/with_server.py -- python e2e_test.py"
  min_unit_coverage: 0.70
  require_integration_test: true
  require_e2e_test: true
  e2e_p0_must_pass: true

# === 2026-07-20 新增：小程序播放与跨端数据流复盘测试配置 ===
# 对应 SKILL.md 阶段 24-26，详见各阶段说明

# 阶段 24：小程序 URL 编码安全性预检（对应 news-code-dev R76）
url_safety_test:
  enabled: true
  scan_dirs:
    - "miniprogram/**/*.js"
    - "miniprogram/**/*.wxml"
  url_assignment_patterns:
    - "audioManager\\.src\\s*="
    - "src\\s*=\\s*[\"']http"
    - "wx\\.downloadFile\\(.*?url:"
    - "web-view.*src"
  require_encode_function: "encodeURI"
  forbidden_encode_function: "encodeURIComponent"
  non_ascii_pattern: "[\\u4e00-\\u9fa5]"
  backend_url_fields_to_check:
    - "audio_url"
    - "cover_url"
    - "source_url"

# 阶段 25 + 26：小程序播放安全测试（节流验证 + 跨端兼容验证）
miniprogram_playback_test:
  enabled: true
  # 阶段 25：高频回调节流与防重叠验证（对应 news-code-dev R78-R81）
  throttle_check:
    enabled: true
    update_interval_ms: 800
    max_setdata_per_sec: 2
    require_in_progress_flag: true
    require_pending_seek_pattern: true
    forbid_oncanplay_self_cleanup: true
    require_last_applied_cache: true
    cached_fields:
      - "playbackRate"
      - "volume"
    scan_dirs:
      - "miniprogram/services/audio.js"
      - "miniprogram/pages/detail/detail.js"
  # 阶段 26：iOS/Android 双端播放兼容性验证（对应 news-code-dev R77/R82-R84）
  cross_platform_check:
    enabled: true
    ios_device_required: true
    android_device_required: false  # Android 可选（行为与配置一致）
    require_pause_play_seek_for_rate: true
    require_resume_play_export: true
    forbid_inline_player_card: true
    require_state_clear_on_channel_switch: true
    clear_fields_expected:
      - "script"
      - "segments"
      - "comments"
      - "commentsTotal"
      - "bgCoverUrl"
    test_episodes_with_chinese_slug: true

# === 2026-07-21 新增：SonarQube 扫描测试过程复盘测试配置 ===
# 对应 SKILL.md 阶段 27-31，详见各阶段说明

# 阶段 27：NOSONAR 注释位置正确性验证（对应 news-code-dev S61/R86）
nosonar_positioning_test:
  enabled: true
  case_sensitive: true
  require_leading_space: true
  require_on_multiline_def_first_line: true
  scan_files:
    backend_patterns:
      - "backend/app/**/*.py"
    frontend_patterns:
      - "admin-web/src/**/*.vue"
      - "admin-web/src/**/*.js"
      - "miniprogram/**/*.js"
      - "miniprogram/**/*.wxml"
      - "miniprogram/**/*.wxss"
  valid_patterns:
    python_multiline_def: "\\bdef\\s+\\w+\\(.*#\\sNOSONAR\\s*$"
    python_single_line_def: "\\bdef\\s+\\w+\\(.*\\).*:\\s*#\\sNOSONAR\\s*$"
    js_line: "//\\s*NOSONAR\\s*$"
    js_block: "/\\*\\s*NOSONAR\\s*\\*/"
    vue_template: "<!--\\s*NOSONAR\\s*-->"
    wxss: "/\\*\\s*NOSONAR\\s*\\*/"
  invalid_patterns:
    - "\\)\\s*->\\s*.*:\\s*#\\sNOSONAR"
    - "//\\s*nosonar"
    - "//\\s*NoSonar"
  severity_on_violation: "FAIL"

# 阶段 28：SonarQube 扫描环境兼容性预检（对应 news-code-dev S62/R87）
sonarqube_environment_check:
  enabled: true
  node_version_check:
    enabled: true
    incompatible_versions:
      - "v24"
    recommended_versions:
      - "v20"
      - "v18"
    version_command: "node --version"
    fallback_strategy: "nvm use"
  powershell_version_check:
    enabled: true
    require_bat_wrapper_on_ps5: true
    ps_version_command: "$PSVersionTable.PSVersion.ToString()"
    ps5_threshold: "6.0"
  server_reachability_check:
    enabled: true
    server_url: "http://localhost:9000"
    expected_status: 200
  token_check:
    enabled: true
    token_env_var: "SONAR_TOKEN"
    forbidden_placeholder_values:
      - "your-sonar-token"
      - "<token>"
  scanner_path_check:
    enabled: true
    scanner_home_env_var: "SONAR_SCANNER_HOME"
    required_bin: "bin/sonar-scanner"
  severity_on_violation: "FAIL"

# 阶段 29：并行子代理修复结果二次核查（对应 news-code-dev S63/R88）
parallel_subagent_verification:
  enabled: true
  require_report_fields:
    - "file_list"
    - "fix_summary"
    - "fix_count"
  verify_items:
    - "file_exists"
    - "nosonar_written"
    - "nosonar_position"
    - "file_group_exclusive"
  verify_nosonar_keyword: "NOSONAR"
  require_position_correct: true
  require_file_group_exclusive: true
  severity_on_violation: "FAIL"

# 阶段 30：测试失败 git stash 验证（对应 news-code-dev S64/R89）
test_failure_diagnosis:
  enabled: true
  stash_command: "git stash push -u"
  pop_command: "git stash pop"
  test_command: "pytest --asyncio-mode=auto"
  indicators_of_preexisting_failure:
    - "测试用例引用已删除的字段"
    - "测试用例 mock 了不存在的服务"
    - "测试用例断言旧版本响应结构"
    - "测试文件 last_modified 早于最近重构"
  classification:
    preexisting_failure: "business_data"
    regression_introduced: "code_defect"
  severity_on_regression: "FAIL"
  severity_on_preexisting: "WARN"

# 阶段 31：NOSONAR 抑制 vs 代码修复决策验证（对应 news-code-dev S65/R90）
nosonar_decision_matrix:
  enabled: true
  require_reason_comment: true
  reason_comment_format: "# NOSONAR {rule_id}: {reason}"
  must_fix_rules:
    - "S5446"
    - "S930"
    - "S2817"
    - "S5886"
    - "S3699"
  can_suppress_rules:
    - "S3776"
    - "S7503"
    - "S125"
    - "S6353"
  unknown_rules_action: "warn"
  severity_on_must_fix_suppressed: "FAIL"
  severity_on_missing_reason: "WARN"

# 阶段 32：跨项目模块迁移 7 步法验证 + 移植适配检查（R86 + R153 合并）
cross_project_migration_test:
  description: "跨项目模块迁移 7 步法 + 移植适配验证配置"
  enabled: true
  # 必经步骤清单（缺一即 FAIL）
  required_steps:
    - "requirement_confirm"
    - "architecture_align"
    - "backend_dev"
    - "frontend_dev"
    - "test_write"
    - "test_execute"
    - "build_verify"
  # 架构对齐检查清单
  architecture_align_checklist:
    - "目录结构对齐"
    - "技术栈对齐"
    - "依赖库对齐"
    - "命名约定对齐"
    - "路径风格对齐"
  # 构建验证命令模板（{frontend_dir} / {backend_dir} 占位符）
  build_verify_command:
    frontend: "cd {frontend_dir} && npm run build"
    backend: "cd {backend_dir} && pyinstaller --noconfirm build.spec"
  # 测试框架清单（用于识别 test_write 步骤）
  test_frameworks:
    - "pytest"
    - "vitest"
    - "jest"
    - "playwright"
  # 构建验证是否必需
  build_verify_required: true
  # 测试执行是否必需（非仅编写）
  test_execute_required: true
  # === 移植适配检查（R153 补充字段） ===
  # 触发关键字（任一命中即认为本次任务属"参考式跨项目移植"）
  trigger_keywords: ["参考", "移植", "port from", "参考实现", "cross-project"]
  # 命名约定映射：用于检查源项目命名残留
  naming_convention_map:
    source_prefix: "XH_"
    target_prefix: "NEWS_"
    check_scope: ["variable_names", "env_vars", "config_keys"]
  # 配置格式映射：源项目与目标项目配置格式差异
  config_format_map:
    source_format: "yaml"
    target_format: "json"
  # 通知系统映射：源项目与目标项目通知机制差异
  notification_system_map:
    source: "EventType enum + Event dataclass"
    target: "NotificationEvent dataclass + NotifierHub"
  # 认证模型规则：保持目标项目认证模型，不照搬源项目
  auth_model:
    rule: "keep_target_project_auth_model"
    note: "不照搬源项目认证白名单，保持目标项目全部认证"
  # 适配检查清单（4 项）
  adaptation_checklist: ["naming_adaptation", "config_format", "notification_system", "auth_model"]
  # 严重级别（7 步法 + 适配共用）
  severity_on_missing_step: "FAIL"
  severity_on_skip_test_execute: "FAIL"
  severity_on_skip_build_verify: "FAIL"
  severity_on_naming_residual: "FAIL"
  severity_on_config_mismatch: "FAIL"
  severity_on_notification_mismatch: "FAIL"
  severity_on_auth_mismatch: "FAIL"

# 阶段 33：前端嵌套目录相对路径校验
frontend_nested_paths_test:
  enabled: true
  # 嵌套目录模式（正则）
  nested_dir_pattern: "views/<module>/<Page>.vue"
  # 父目录层级要求（views/<module>/<Page>.vue 为 2 层）
  parent_level_required: 2
  # 需要检查的路径类型
  path_types_to_check:
    - "scss_use"
    - "js_import"
    - "ts_import"
    - "vue_import"
  # 错误模式（正则，命中即 FAIL）
  invalid_patterns:
    - "@use\\s+'\\.\\./[^']"
    - "from\\s+'\\.\\./[^']*'"
    - "import\\s+.*from\\s+'\\.\\./[^']*'"
    - "require\\(['\"]\\.\\./[^'\"]*['\"]\\)"
  # 扫描目录
  scan_dirs:
    - "frontend/src/views/"
  # 前端源码目录（用于计算层级深度）
  frontend_src_dirs:
    - "frontend/src/"
  # 是否需要构建验证
  build_verify_required: true
  # 构建验证命令
  build_verify_command: "cd frontend && npm run build"
  # 严重级别
  severity_on_invalid_path: "FAIL"

# 阶段 34：UI 图标跨库迁移存在性验证
icon_migration_test:
  enabled: true
  # 目标图标库
  target_icon_library: "@element-plus/icons-vue"
  # 验证命令（获取目标库所有图标名）
  verify_command: "node -e \"const icons = require('@element-plus/icons-vue'); console.log(Object.keys(icons).join('\\n'))\""
  # 兜底图标（目标库中不存在时的替换建议）
  fallback_icon: "MagicStick"
  # 已知图标映射（参考项目图标 → 目标库图标）
  icon_mapping:
    "Rocket": "MagicStick"
    "Fire": "Sunny"
    "Bolt": "Lightning"
    "Chat": "ChatDotRound"
    "ChatBubble": "ChatDotRound"
    "Heart": "Star"
    "Star": "StarFilled"
    "Gear": "Setting"
    "Cog": "Setting"
  # 已知目标库中不存在的图标清单（直接报错）
  known_missing_icons:
    - "Rocket"
    - "Fire"
    - "Bolt"
    - "ChatBubble"
  # 是否在构建前必须验证
  verify_before_build: true
  # 前端源码扫描目录
  frontend_src_dirs:
    - "frontend/src/"
  # 严重级别
  severity_on_missing_icon: "FAIL"
  severity_on_mapping_available: "WARN"

# 阶段 35：模块级单例缓存测试隔离验证
cache_test_isolation_test:
  enabled: true
  # 是否强制要求 _reset_cache_for_test 函数
  require_reset_function: true
  # 重置函数命名约定
  reset_function_naming: "_reset_cache_for_test"
  # 是否强制在 fixture 中调用（autouse=True）
  reset_in_fixture: true
  # 需要重置的缓存类型
  cache_types_to_reset:
    - "TTLCache"
    - "dict_module_level"
    - "lru_cache"
    - "functools.cache"
    - "cachetools.LRUCache"
  # 模块级缓存容器定义模式（正则）
  module_cache_patterns:
    - "^_[a-z_]*_cache\\s*[:=]"
    - "^_[a-z_]*_dict\\s*[:=]"
    - "^_[a-z_]*_counter\\s*[:=]\\s*(0|\\{\\})"
  # 后端源码扫描目录
  backend_src_dirs:
    - "backend/app/"
  # 测试文件目录
  test_dirs:
    - "backend/tests/"
  # 排除文件
  exclude_files:
    - "__pycache__"
    - ".venv"
    - "migrations"
  # 严重级别
  severity_on_missing_reset_function: "FAIL"
  severity_on_missing_fixture_call: "WARN"
  severity_on_missing_autouse: "WARN"

# 阶段 36：多版本 Python 环境测试执行预检
python_env_test_check:
  enabled: true
  # 是否强制要求显式 Python 路径
  require_explicit_python_path: true
  # 系统 Python 路径（可被项目配置覆盖）
  system_python_path: "F:\\Program Files\\Python3.14\\python.exe"
  # 必需测试依赖清单
  required_test_deps:
    - "pytest"
    - "pytest-asyncio"
    - "aiosqlite"
    - "httpx"
  # 开发依赖文件名
  dev_requirements_file: "requirements-dev.txt"
  # 验证命令模板（{python_path} 占位符）
  verify_command: '& "{python_path}" -c "import pytest; print(pytest.__version__)"'
  # 测试执行命令模板
  test_run_command: '& "{python_path}" -m pytest backend/tests/ -v --tb=short'
  # 禁止的模式（grep 信号，命中即 WARN）
  forbidden_patterns:
    - "^python -m pytest"
    - "^python\\s+-m\\s+pytest"
  # 测试脚本路径
  test_script_path: "scripts/run_tests.ps1"
  # CI 配置文件清单
  ci_config_files:
    - ".github/workflows/"
    - ".gitlab-ci.yml"
    - "azure-pipelines.yml"
  # 不适用场景
  not_applicable_scenarios:
    - "Docker 容器内单一 Python 环境"
    - "Linux pyenv global 锁定版本"
    - "venv 虚拟环境激活后的 shell"
  # 严重级别
  severity_on_python_not_found: "FAIL"
  severity_on_pytest_not_installed: "FAIL"
  severity_on_missing_dev_requirements: "WARN"
  severity_on_forbidden_pattern: "WARN"

# === 2026-07-21 新增：综合复盘测试配置（阶段 37-42） ===
# 对应 SKILL.md 阶段 37-42，详见各阶段说明
# 来源：菜单分组、PWA 图标、图片爬虫、About/Help、P0/P1 监控改进等迭代测试复盘

# ---- 阶段 37：菜单分组与角色可见性测试 ----
# 背景：菜单数量 ≥10 时需用 el-sub-menu 分组，且不同角色可见分组需差异化控制。
# 本次菜单分组功能开发中发现手风琴效果失效、角色过滤不生效等问题。
menu_grouping_test:
  enabled: true
  # 触发分组检查的最小菜单数量（< 此值时 SKIP）
  min_menu_count_for_grouping: 10
  # 预期分组数量（与 groupConfig 数组长度一致）
  expected_group_count: 5
  # 路由配置文件清单（用于静态扫描 meta.group 字段）
  route_config_files:
    - "admin-web/src/router/index.js"
    - "admin-web/src/router/routes.js"
  # groupConfig 配置来源（验证从配置读取而非硬编码）
  group_config_source: "admin-web/src/config/menuGroups.js"
  # 是否要求手风琴效果（unique-opened）
  require_accordion: true
  # 是否要求角色可见性控制
  require_role_visibility: true
  # admin 角色名称（可见所有分组）
  admin_role: "admin"
  # operator 角色名称（仅可见部分分组）
  operator_role: "operator"
