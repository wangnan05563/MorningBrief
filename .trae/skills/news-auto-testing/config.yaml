# ---- 阶段 38：PWA 图标与 manifest 测试 ----
# 背景：PWA 安装依赖 manifest.json 和 icons 资源完整。
# 本次图标设计任务中发现 Content-Type 错误、缺 maskable purpose、缺 theme-color 等问题。
pwa_icon_test:
  enabled: true
  # manifest.json 路径（相对 base_url）
  manifest_path: "/manifest.json"
  # 期望的 manifest Content-Type
  expected_manifest_content_type: "application/manifest+json"
  # manifest.json 必需字段
  required_manifest_fields:
    - "name"
    - "short_name"
    - "start_url"
    - "display"
    - "icons"
  # 必需的 icon 尺寸
  required_icon_sizes:
    - "192x192"
    - "512x512"
  # 必需的 icon purpose（至少一个 icon 含此 purpose）
  required_icon_purpose: "any maskable"
