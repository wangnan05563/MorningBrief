  # 轮询间隔（毫秒）
  poll_interval_ms: 3000
  # 等待轮询触发时间（毫秒）
  wait_for_poll_ms: 8000
  # 终态列表
  terminal_states:
    - "success"
    - "failed"
  # 运行态
  running_state: "running"
  # 测试页面
  test_pages:
    - path: "/workflows/{workflow_id}"
      name: "工作流详情页"
      require_login: true
  # 验证项
  verify_items:
    # setInterval 必须配对 clearInterval
    - name: "clearinterval_paired"
      check: "verify_timer_cleanup"
    # 轮询必须检查 document.hidden
    - name: "hidden_check_in_polling"
      check: "verify_hidden_check"
    # 轮询请求必须 silent
    - name: "silent_polling"
      check: "verify_silent_request"
    # 必须有 visibilitychange 监听
    - name: "visibility_listener"
      check: "verify_visibility_listener"
    # 终态必须停止轮询
    - name: "terminal_stop"
      check: "verify_terminal_stop"
  # 网络请求验证
  verify_network_requests:
    # 轮询请求 URL 模式
    poll_url_pattern: "/admin/api/v1/workflows/.*"
    # 验证请求头含 silent 标记（通过 config.silent）
    verify_silent_config: true
  # 失败信号
  failure_signals:
    - "setInterval without clearInterval"
    - "polling without document.hidden check"
    - "polling request without silent flag"
    - "no visibilitychange listener"
    - "polling continues after terminal state"

stage_step_progress_render_test:
  description: "步骤进度条渲染测试（阶段 55，对应 R124）"
  enabled: true
  # 测试目标：验证工作流步骤进度条正确渲染
  test_goal: "verify_progress_render"
  # 测试页面
  test_pages:
    - path: "/workflows/{workflow_id}"
      name: "工作流详情页"
      require_login: true
  # 验证 el-progress 组件存在
  verify_el_progress_exists: true
  # 期望的进度条数量（crawl/rewrite/tts/stitch 4 步 + 可能的开场/结尾）
  expected_progress_count_min: 4
  # 状态映射验证
  state_mapping:
    pending: 0
    running: 50
    retrying: 50
    success: 100
    failed: 100
  # 验证条纹动画（running/retrying 状态）
  verify_stripe_animation: true
  stripe_states:
    - "running"
    - "retrying"
  # 验证颜色（success=绿色，failed=红色）
  verify_status_color: true
  success_status: "success"
  failed_status: "exception"
  # 验证脚本
  verify_scripts:
    - "document.querySelectorAll('.el-progress').length >= 4"
    - "document.querySelectorAll('.el-progress-bar__inner').length >= 4"
  # 失败信号
  failure_signals:
    - "el-progress component not found"
    - "progress percentage mismatch with status"
    - "no stripe animation for running state"
    - "wrong color for success/failed status"

stage_edit_integrity_verify_test:
  description: "文件编辑完整性验证测试（阶段 56，对应 R123）"
  enabled: true
  # 测试目标：验证修复代码已正确编译到构建产物
  test_goal: "verify_build_artifact_contains_fix"
  # 构建产物路径
  build_artifact_path: "admin-web/dist/assets"
  # 验证关键词（修复代码的特征）
  verify_keywords:
    - "document.hidden"
    - "router.push"
    - "silent"
  # 验证禁止关键词（不应出现在构建产物中）
  forbid_keywords:
    - "location.href"
    - "reesponse"
    - "Mesror"
  # 验证方式：Grep 构建产物
  verify_method: "grep_build_artifact"
  # 失败信号
  failure_signals:
    - "fix keyword not found in build artifact"
    - "forbidden keyword found in build artifact"
    - "build artifact corrupted"

stage_masked_key_fallback_test:
  description: "API Key 脱敏回退链路测试（阶段 57，对应 R122）"
  enabled: true
  # 测试目标：验证 API Key 脱敏回退链路完整
  test_goal: "verify_masked_key_fallback"
  # 测试页面
  test_pages:
    - path: "/ai-config"
      name: "AI 服务配置"
      require_login: true
  # 验证项
  verify_items:
    # 返回前端前必须脱敏
    - name: "api_key_masked"
      check: "verify_api_key_masked"
      # 脱敏前缀
      masked_prefix: "sk-****"
    # 切换预设后 API Key 跟随返显
    - name: "preset_switch_reflect"
      check: "verify_preset_switch_reflect"
      # 测试预设列表
      test_presets:
        - "deepseek"
        - "agnes"
        - "qwen"
    # 旧数据兼容：切换回未存储的预设时用全局值填充
    - name: "legacy_data_compat"
      check: "verify_legacy_compat"
    # 提交 is_masked=true 时后端回退真实值
    - name: "fallback_to_db"
      check: "verify_fallback_to_db"
  # 网络请求验证
  verify_network_requests:
    # GET /ai/config 返回的 api_key 必须是脱敏的
    verify_masked_return: true
    # POST /ai/config 提交 is_masked=true 时后端不覆盖
    verify_fallback_on_submit: true
  # 失败信号
  failure_signals:
    - "api_key returned in plaintext"
    - "preset switch does not reflect api_key"
    - "legacy data not compatible"
    - "is_masked=true but api_key overwritten"

# --- V2.2 新增：外部服务降级与异常过滤测试（2026-07-22 复盘，对应编码规范 R127-R129）---

external_storage_fallback_test:
  description: "TTS COS 降级本地存储测试（阶段 52）"
  enabled: true
  severity: "CRITICAL"
  # 模拟 COS 未配置
  cos_configured_mock: false
  # 本地降级目录（与后端 config.yaml 一致）
  local_dir: "data/audio_cache"
  # 静态目录挂载点
  static_mount_point: "/audio"
  # 预期返回 URL 前缀（相对路径）
  expected_url_prefix: "/audio/"
  # 测试工作流类型
  test_workflow: "tts"
  # 断言项
  assertions:
    file_exists_in_local_dir: true
    url_starts_with: "/audio/"
    frontend_can_play: true
    fallback_ui_alert_displayed: true
  # 判断信号
  signals:
    - "is_cos_configured"
    - "cos_client\\.put_object"
  # 扫描目录
  scan_dirs:
    - "backend/app/workflow/tts/"

asyncio_exception_filter_test:
  description: "Windows asyncio 异常过滤测试（阶段 53）"
  enabled: true
  severity: "MEDIUM"
  # 启用平台（仅 Windows）
  enabled_platforms:
    - "win32"
  # 被过滤的异常
  ignored_exception: "ConnectionResetError"
  ignored_transport: "ProactorBasePipeTransport"
  ignored_winerror: 10054
  # 预期日志级别
  expected_log_level: "DEBUG"
  # 断言项
  assertions:
    no_error_in_log: true
    only_debug_level: true
  # 判断信号
  signals:
    - "ProactorBasePipeTransport\\._call_connection_lost"
    - "ConnectionResetError.*WinError.*10054"
  # 扫描目录
  scan_dirs:
    - "backend/app/main.py"
    - "backend/app/core/"

local_path_url_test:
  description: "本地路径 URL 约定测试（阶段 54）"
  enabled: true
  severity: "HIGH"
  # URL 前缀
  url_prefix: "/audio/"
  # 物理目录
  physical_dir: "data/audio_cache"
  # 拷贝策略
  copy_strategy: "shutil.copyfile"
  # 禁止的自回路请求模式
  forbidden_patterns:
    - "httpx\\.get\\(.*localhost.*audio"
    - "httpx\\.get\\(.*127\\.0\\.0\\.1.*audio"
  # 断言项
  assertions:
    no_httpx_call: true
    file_copied: true
    content_correct: true
    frontend_supports_relative: true
  # 判断信号
  signals:
    - "def\\s+download_file\\("
    - "url\\.startswith\\(['\"]/audio/['\"]\\)"
  # 扫描目录
  scan_dirs:
    - "backend/app/workflow/stitch/"
    - "backend/app/workflow/tts/"

# ===== 阶段 58-63：浏览器环境诊断与防御纵深复盘测试（对应 R130-R139）=====
# 来源：Edge 浏览器最小化自动弹出问题复盘（5 轮代码修复无效 → 重置 Edge 个人资料解决）
# 所有测试参数通过 config.yaml 管理，技能本身不含硬编码值

stage_browser_environment_isolation_test:
  description: "浏览器环境隔离验证测试（阶段 58，对应 R130）"
  enabled: true
  severity: "CRITICAL"
  # 测试目标：验证 UI 异常排查执行了环境隔离验证三步法
  test_goal: "verify_environment_isolation_three_steps"
  # 环境隔离验证三步法
  isolation_steps:
    - step: "step1_repro_normal"
      description: "在普通浏览器窗口复现问题"
      required: true
    - step: "step2_incognito_test"
      description: "在无痕/隐私模式下测试（关键分水岭）"
      required: true
      # 无痕模式正常的判断信号
      incognito_normal_signal: "问题在无痕模式下不复现"
      # 无痕模式正常的判断结论
      incognito_normal_conclusion: "用户配置数据问题"
      # 无痕模式异常的判断结论
      incognito_abnormal_conclusion: "代码层问题"
    - step: "step3_cross_browser"
      description: "在另一浏览器测试"
      required: true
      # 必须测试的浏览器列表（配置驱动）
      test_browsers:
        - "chrome"
        - "edge"
      # 仅单浏览器复现的判断结论
      single_browser_conclusion: "浏览器特定行为/配置"
      # 多浏览器都复现的判断结论
      all_browser_conclusion: "应用代码问题"
    - step: "step4_disable_extensions"
      description: "禁用所有扩展测试"
      required: true
    - step: "step5_reset_profile"
      description: "重置用户配置文件（最后手段）"
      required: false
      # 重置前必须警告数据丢失
      require_data_loss_warning: true
  # 测试报告必须包含的章节
  required_report_sections:
    - "环境隔离验证结果"
    - "无痕模式测试结果"
    - "跨浏览器测试结果"
    - "扩展禁用测试结果"
    - "诊断方向评估"
  # 失败信号
  failure_signals:
    - "未执行无痕模式测试"
    - "未执行跨浏览器测试"
    - "未执行扩展禁用测试"
    - "环境隔离验证结果缺失"

stage_continuous_fix_failure_reassess_test:
  description: "连续修复失败重评机制测试（阶段 59，对应 R131）"
  enabled: true
  severity: "HIGH"
  # 测试目标：验证连续代码修复失败时触发重评机制
  test_goal: "verify_reassess_on_continuous_failure"
  # 连续修复失败上限（配置驱动）
  max_code_fix_rounds: 3
  # 重评检查清单
  reassess_checklist:
    - "环境隔离验证是否执行"
    - "无痕模式是否测试"
    - "浏览器配置文件损坏是否考虑"
    - "系统级问题是否考虑"
  # 重评后必须切换诊断方向
  require_diagnosis_direction_switch: true
  # 测试场景
  test_scenarios:
    - name: "连续 3 轮代码修复无效"
      actions:
        - "执行代码修复 round 1"
        - "验证问题仍存在"
        - "执行代码修复 round 2"
        - "验证问题仍存在"
        - "执行代码修复 round 3"
        - "验证问题仍存在"
      expected: "触发重评检查清单"
    - name: "重评后切换诊断方向"
      actions:
        - "触发重评检查清单"
        - "执行环境隔离验证"
        - "执行无痕模式测试"
      expected: "诊断方向从代码层切换到环境层"
  # 失败信号
  failure_signals:
    - "连续 3 轮代码修复无效未触发重评"
    - "重评后未切换诊断方向"
    - "重评检查清单缺失"

stage_browser_profile_corruption_test:
  description: "浏览器配置文件损坏诊断测试（阶段 60，对应 R132）"
  enabled: true
  severity: "HIGH"
  # 测试目标：验证浏览器配置文件损坏诊断流程
  test_goal: "verify_profile_corruption_diagnosis"
  # 诊断信号组合
  diagnostic_signals:
    - signal: "incognito_mode_normal"
      description: "无痕模式正常"
      weight: "strong"
    - signal: "normal_mode_abnormal"
      description: "普通模式异常"
      weight: "strong"
    - signal: "window_auto_restore"
      description: "窗口自动恢复"
      weight: "strong"
    - signal: "focus_anomaly"
      description: "焦点异常"
      weight: "medium"
  # 强信号组合判断
  strong_signal_combination:
    - "incognito_mode_normal + normal_mode_abnormal"
    - "window_auto_restore + incognito_mode_normal"
  # 修复方法
  fix_method: "rename_user_data_folder"
  # 浏览器配置文件路径（配置驱动）
  browser_profile_paths:
    edge: "%LOCALAPPDATA%\\Microsoft\\Edge\\User Data"
    chrome: "%LOCALAPPDATA%\\Google\\Chrome\\User Data"
    firefox: "%APPDATA%\\Mozilla\\Firefox\\Profiles"
  # 重置前必须警告
  require_data_loss_warning: true
  data_loss_warning_content: "重置将丢失浏览器扩展/书签/历史等数据"
  # 测试场景
  test_scenarios:
    - name: "无痕正常 + 普通异常 = 配置文件损坏"
      inputs:
        - "incognito_mode_normal: true"
        - "normal_mode_abnormal: true"
      expected: "诊断结论为浏览器配置文件损坏"
    - name: "无痕异常 + 普通异常 = 代码层问题"
      inputs:
        - "incognito_mode_normal: false"
        - "normal_mode_abnormal: true"
      expected: "诊断结论为代码层问题"
  # 失败信号
  failure_signals:
    - "无痕正常信号未被利用"
    - "未尝试重置浏览器配置文件"
    - "重置前未警告数据丢失"

stage_window_management_safety_test:
  description: "浏览器窗口管理安全测试（阶段 61，对应 R133-R137）"
  enabled: true
  severity: "HIGH"
  # 测试目标：验证浏览器窗口管理代码符合安全规范
  test_goal: "verify_window_management_safety"
  # window.focus() 必须检查 visibilityState
  verify_window_focus_visibility_check: true
  window_focus_pattern: "window\\.focus\\("
  visibility_check_pattern: "document\\.visibilityState\\s*!==\\s*['\"]hidden['\"]"
  # blur 事件不能单独使用
  verify_blur_not_alone: true
  blur_pattern: "addEventListener\\(['\"]blur['\"]"
  visibilitychange_pattern: "addEventListener\\(['\"]visibilitychange['\"]"
  # SSE 必须在页面隐藏时断开
  verify_sse_disconnect_on_hidden: true
  eventsource_pattern: "new\\s+EventSource\\("
  sse_disconnect_pattern: "eventSource\\.close\\(\\)"
  # ElMessage 必须使用安全包装器
  verify_safe_elmessage_wrapper: true
  forbidden_elmessage_pattern: "ElMessage\\.(error|warning|success|info)\\("
  safe_wrapper_pattern: "safeElMessage|safeElMessageBox"
  # HTMLElement.prototype.focus 必须被拦截
  verify_prototype_focus_intercept: true
  prototype_focus_pattern: "HTMLElement\\.prototype\\.focus"
  # 拦截 API 列表（配置驱动）
  intercept_apis:
    - "focus"
    - "open"
    - "alert"
    - "location"
    - "title"
    - "EventSource"
    - "fetch"
    - "XHR"
  # 测试页面（必须登录的页面）
  test_pages:
    - path: "/workflows"
      name: "工作流监控"
      require_login: true
    - path: "/ai-config"
      name: "AI 服务配置"
      require_login: true
    - path: "/review"
      name: "内容审核"
      require_login: true
  # 验证脚本（evaluate_script）
  verify_scripts:
    - "typeof window.guardInstalled !== 'undefined' && window.guardInstalled === true"
    - "typeof HTMLElement.prototype.focus._original !== 'undefined'"
    - "document.querySelectorAll('[autofocus]').length === 0"
  # 失败信号
  failure_signals:
    - "window.focus() called without visibilityState check"
    - "blur event listener without visibilitychange"
    - "EventSource created without disconnect handler"
    - "ElMessage called without safe wrapper"
    - "HTMLElement.prototype.focus not intercepted"
    - "autofocus attribute found in DOM"

stage_pwa_manifest_config_test:
  description: "PWA manifest 配置化测试（阶段 62，对应 R138）"
  enabled: true
  severity: "MEDIUM"
  # 测试目标：验证 PWA manifest 的 display 字段从配置读取
  test_goal: "verify_pwa_manifest_config_driven"
  # manifest 文件路径
  manifest_paths:
    - "admin-web/public/manifest.json"
    - "admin-web/public/manifest.webmanifest"
  # display 字段不能硬编码
  forbid_hardcoded_display: true
  display_pattern: "\"display\"\\s*:\\s*['\"](standalone|browser|minimal-ui|fullscreen)['\"]"
  # 支持的 display 取值
  supported_display_values:
    - "standalone"
    - "browser"
    - "minimal-ui"
    - "fullscreen"
  # 默认 display 模式
  default_display: "browser"
  # 业务场景与 display 模式映射
  business_scenario_mapping:
    real_time_collaboration: "browser"
    offline_tool: "standalone"
    immersive_content: "fullscreen"
    simple_admin: "minimal-ui"
  # 验证项
  assertions:
    manifest_exists: true
    display_not_hardcoded: true
    display_value_valid: true
    index_html_links_manifest: true
  # 验证脚本
  verify_scripts:
    - "fetch('/manifest.json').then(r => r.json()).then(m => m.display !== undefined)"
    - "document.querySelector('link[rel=manifest]') !== null"
  # 失败信号
  failure_signals:
    - "manifest.json 不存在"
    - "display 字段硬编码"
    - "display 取值不在支持列表中"
    - "index.html 未引用 manifest.json"

stage_cross_browser_event_order_test:
  description: "跨浏览器事件触发顺序测试（阶段 63，对应 R139）"
  enabled: true
  severity: "HIGH"
  # 测试目标：验证事件触发顺序在 Chrome 和 Edge 中一致
  test_goal: "verify_cross_browser_event_order"
  # 必须测试的浏览器列表（配置驱动）
  required_browsers:
    - "chrome"
    - "edge"
  optional_browsers:
    - "firefox"
    - "safari"
  # 必须验证的事件触发顺序
  critical_event_sequences:
    - events: ["blur", "visibilitychange"]
      description: "Edge 中 blur 先于 visibilitychange 触发"
      chrome_order: ["visibilitychange", "blur"]
      edge_order: ["blur", "visibilitychange"]
      risk: "单独使用 blur 事件会误判页面隐藏"
    - events: ["pagehide", "pageshow"]
      description: "页面缓存行为差异"
      chrome_order: ["pagehide", "pageshow"]
      edge_order: ["pagehide", "pageshow"]
      risk: "可能导致 SSE 连接未正确断开"
    - events: ["focus", "visibilitychange"]
      description: "focus 事件触发时机差异"
      chrome_order: ["focus", "visibilitychange"]
      edge_order: ["visibilitychange", "focus"]
      risk: "可能导致窗口焦点判断错误"
  # 必须验证的 API 行为差异
  api_behavior_differences:
    - api: "HTMLElement.prototype.focus"
      chrome_behavior: "最小化时调用不激活窗口"
      edge_behavior: "最小化时调用激活窗口"
      risk: "窗口自动弹出"
    - api: "window.focus"
      chrome_behavior: "行为可预测"
      edge_behavior: "行为与 Chrome 不一致"
      risk: "窗口意外激活"
    - api: "EventSource"
      chrome_behavior: "断开重连行为标准"
      edge_behavior: "断开重连行为差异"
      risk: "SSE 连接异常"
  # 测试场景
  test_scenarios:
    - name: "最小化测试"
      actions:
        - "导航到测试页面"
        - "注册事件监听器（blur/visibilitychange/focus/pagehide）"
        - "最小化浏览器窗口"
        - "等待 5 秒"
        - "记录事件触发顺序"
      expected: "Chrome 和 Edge 事件顺序一致或差异已记录"
    - name: "SSE 断开测试"
      actions:
        - "导航到 SSE 测试页面"
        - "建立 SSE 连接"
        - "最小化浏览器窗口"
        - "等待 5 秒"
        - "验证 SSE 连接已断开"
      expected: "Chrome 和 Edge 都正确断开 SSE 连接"
    - name: "无痕模式测试"
      actions:
        - "在无痕模式下导航到测试页面"
        - "执行最小化测试"
        - "执行 SSE 断开测试"
      expected: "无痕模式行为与普通模式一致"
  # 测试报告必须包含的内容
  required_report_content:
    - "跨浏览器事件触发顺序对比表"
    - "API 行为差异对比表"
    - "无痕模式测试结果"
    - "兼容性风险评估"
  # 失败信号
  failure_signals:
    - "未在 Chrome 测试"
    - "未在 Edge 测试"
    - "事件触发顺序差异未记录"
    - "API 行为差异未验证"
    - "无痕模式未测试"

# ===== 阶段 64-66：频道管理与 AI 接口稳定性复盘测试（2026-07-22 复盘）=====
# 对应 SKILL.md 阶段 64-66，详见各阶段说明
# 来源：频道管理 el-switch 状态不持久化、AI 重新生成超时、频道级配置覆盖全局等问题复盘
# 所有测试参数通过 config.yaml 管理，禁止硬编码

# 阶段 64：el-switch 状态持久化测试
switch_persistence_test:
  enabled: true
  priority: P1
  pages:
    - path: /channels
      name: 频道管理
      switches:
        - selector: ".el-switch"
          active_value: 1
          inactive_value: 0
          backend_field: is_active
  require_no_change_event_on_init: true
  require_state_persist_after_refresh: true
  description: 验证 el-switch 状态切换后刷新页面仍保持状态，初始化时不误触发 change 事件

# 阶段 65：AI 长耗时接口超时测试
ai_timeout_test:
  enabled: true
  priority: P1
  endpoints:
    - method: POST
      path: /admin/api/v1/channels/{id}/generate-prompts
      name: 频道提示词 AI 生成
      requires_auth: true
      expected_max_response_sec: 60
      expected_fields:
        - intro_prompt
        - outro_prompt
        - constraint_prompt
        - rewrite_template
      timeout_keyword: "timeout"
  buffer_ms: 5000
  description: 验证 AI 生成类接口在配置的超时时间内正常响应，无 timeout 报错

# 阶段 66：频道级配置覆盖测试
channel_config_override_test:
  enabled: true
  priority: P1
  channel_fields:
    - intro_prompt
    - outro_prompt
    - constraint_prompt
    - rewrite_template
    - schedule_time
    - is_active
  test_steps:
    - channel_config_priority
    - empty_field_fallback
    - schedule_change_cron_reregister
    - disable_channel_cancel_queued
  cron_wait_timeout_sec: 180
  description: 验证频道级配置字段优先于全局配置，频道字段变更联动定时任务

# ===== 阶段 67-70：AI 配置持久化与跨页同步复盘测试（2026-07-22 复盘）=====
# 对应 SKILL.md 阶段 67-70，详见各阶段说明
# 来源：AI 服务配置页面目标时长参数不持久化、菜单图标不存在、参数计算器跨页跳转不同步等问题复盘
# 所有测试参数通过 config.yaml 管理，禁止硬编码

# 阶段 67：Pydantic 字段持久化往返测试（对应 R144）
pydantic_field_roundtrip_test:
  enabled: true
  priority: P0
  description: 验证前端提交的配置字段在后端 Pydantic Body 模型中完整声明，提交后 GET 返回值与提交值一致
  # 测试的配置端点（POST 提交 + GET 读取）
  config_endpoints:
    - name: "AI 配置"
      post_path: "/admin/api/v1/ai/config"
      get_path: "/admin/api/v1/ai/config"
      requires_auth: true
      # 测试字段清单（字段名、测试值、期望类型）
      test_fields:
        - field: "target_duration_sec"
          test_value: 900
          expected_type: "int"
          min: 60
          max: 1800
        - field: "temperature"
          test_value: 0.5
          expected_type: "float"
          min: 0.0
          max: 2.0
        - field: "model"
          test_value: "qwen-turbo"
          expected_type: "str"
      # 原始值备份用于测试后恢复
      backup_before_test: true
      restore_after_test: true
  # 往返一致性判断标准
  roundtrip_assertions:
    require_post_success: true
    require_get_after_post: true
    require_field_value_match: true
    forbid_silent_drop: true
  # 静默丢弃检测信号
  silent_drop_signals:
    - "POST 200 但 GET 返回值 != 提交值"
    - "POST 200 但 GET 返回字段为默认值"

# 阶段 68：Element Plus 图标库可用性预检（对应 R145）
icon_library_existence_test:
  enabled: true
  priority: P1
  description: 验证 router/index.js 中 meta.icon 引用的图标名在 @element-plus/icons-vue 中存在
  # 图标库配置（支持多个图标库）
  icon_libraries:
    - name: "@element-plus/icons-vue"
      # 验证命令模板（{icon_name} 为占位符）
      verify_command: 'node -e "import(''@element-plus/icons-vue'').then(m => process.exit(Object.keys(m).includes(''{icon_name}'') ? 0 : 1))"'
      # 扫描的文件 glob 模式
      scan_files:
        - "admin-web/src/router/index.js"
        - "admin-web/src/router/**/*.js"
      # 提取图标引用的正则
      icon_extract_pattern: "icon:\\s*['\"]([^'\"]+)['\"]"
    # 可扩展其他图标库
    # - name: "other-icon-library"
    #   verify_command: "..."
    #   scan_files: ["..."]
    #   icon_extract_pattern: "..."
  # 通用断言
  assertions:
    require_all_icons_exist: true
    report_nonexistent_icons: true
    suggest_alternative_icons: true
  # 已知不存在的图标名（从历史复盘中提取）
  known_nonexistent_icons:
    - "Calculator"  # 应使用 Stopwatch 替代
  # 语义匹配建议（图标名 → 功能含义）
  semantic_match_suggestions:
    "Calculator": "Stopwatch"
    "Setting": "Tools"

# 阶段 69：参数计算器跨页同步测试（对应 R146）
cross_page_param_sync_test:
  enabled: true
  priority: P1
  description: 验证跨页面参数传递通过 router query 完成，目标页 onMounted 同步后清除 query
  # 测试的跨页面参数传递场景
  cross_page_scenarios:
    - name: "参数计算器 → AI 配置"
      source_page:
        path: "/param-calculator"
        name: "参数计算器"
        # 触发跳转的按钮文本
        trigger_button: "应用到AI配置"
        # 期望传递的 query 参数
        expected_query_params:
          - "target_duration"
          - "segment_count"
      target_page:
        path: "/ai-config"
        name: "AI 服务配置"
        # 期望 onMounted 读取的 query 参数
        expected_onmounted_read: true
        # 期望同步后清除 query
        expected_query_clear: true
        # 期望同步后的视觉反馈
        expected_feedback: "参数已同步"
        # 验证同步的字段
        verify_synced_fields:
          - field: "target_duration_sec"
            query_param: "target_duration"
            transform: "Number"
          - field: "segment_count"
            query_param: "segment_count"
            transform: "Number"
            default: 5
      # 测试步骤
      test_steps:
        - "navigate_source_page"
        - "fill_calculator_params"
        - "click_apply_button"
        - "verify_url_contains_query"
        - "verify_target_page_loaded"
        - "verify_form_fields_synced"
        - "verify_query_cleared"
        - "verify_user_feedback"
  # 通用断言
  assertions:
    require_query_in_push: true
    require_onmounted_read: true
    require_replace_after_consume: true
    require_type_conversion: true
    require_user_feedback: true
  # 失败信号
  failure_signals:
    - "router.push 无 query 参数"
    - "目标页 onMounted 未读取 route.query"
    - "query 参数消费后未 router.replace 清除"
    - "query 参数未类型转换（字符串 vs 数字）"
    - "跨页同步后无视觉反馈"

# 阶段 70：配置键一致性测试（对应 R147）
config_key_consistency_test:
  enabled: true
  priority: P0
  description: 验证配置键命名在四端（前端 form + 后端 Body + CONFIG_KEY_MAP + 数据库 settings）保持一致
  # 四端配置来源
  config_ends:
    - name: "前端 form"
      scan_files:
        - "admin-web/src/views/ai/AIConfig.vue"
        - "admin-web/src/views/ai/components/*.vue"
      # 提取 form 字段名的正则
      field_extract_pattern: "(?:form|ttsForm|llmForm)\\.([a-z_]+)"
    - name: "后端 Body 模型"
      scan_files:
        - "backend/app/routers/admin/ai_config.py"
      # 提取 Body 模型字段名的正则
      field_extract_pattern: "^\\s+(\\w+):\\s+.*=.*Field\\("
    - name: "CONFIG_KEY_MAP"
      scan_files:
        - "backend/app/config.py"
      # 提取 CONFIG_KEY_MAP 键名的正则
      field_extract_pattern: '"([a-z_]+)":\\s*'
    - name: "数据库 settings"
      # 通过 API 获取数据库中的配置键
      api_endpoint: "/admin/api/v1/ai/config"
      requires_auth: true
      # 从返回 JSON 中提取键名
      response_key_path: "data"
  # 一致性断言
  consistency_assertions:
    require_four_end_match: true
    forbid_mixed_prefix: true
    require_legacy_key_map_on_change: true
  # 前缀风格检查
  prefix_style_check:
    # 支持的前缀模式
    valid_prefixes:
      - "edge_tts_"
      - "aliyun_tts_"
      - "tencent_tts_"
      - "llm_"
    # 禁止混用的前缀对
    forbidden_mixed_pairs:
      - ["edge_tts_", "edge_"]
      - ["aliyun_tts_", "aliyun_"]
  # 失败信号
  failure_signals:
    - "四端字段集不一致（任一端缺失字段）"
    - "CONFIG_KEY_MAP 中存在混用前缀"
    - "配置键变更后无 LEGACY_KEY_MAP 兼容映射"
    - "前端 form 字段名与后端 Body 模型字段名不一致"

# ===== 阶段 71-75：测试场景与流程优化复盘新增（2026-07-22 复盘）=====
# 对应 SKILL.md 阶段 71-75，详见各阶段说明
# 来源：axios 响应拦截器 blob 处理、工作流重跑状态重置、时区基线漂移、外键删除隔离、flaky 根因修复等复盘
# 所有测试参数通过 config.yaml 管理，禁止硬编码

# 阶段 71：响应拦截器 blob 响应兼容性测试
blob_interceptor_compat_test:
  description: "响应拦截器 blob/arraybuffer 响应兼容性测试（阶段 71）"
  enabled: true
  severity: "HIGH"
  # 测试的响应类型清单（拦截器应支持所有列出的类型）
  response_types:
    - "blob"
    - "arraybuffer"
  # 拦截器源码判断信号（grep 命中表示拦截器无分支判断）
  interceptor_signal: "response\\.config\\?\\.responseType"
  # 拦截器源码路径
  interceptor_files:
    - "admin-web/src/utils/request.js"
    - "admin-web/src/api/request.js"
  # 禁止出现的错误信息（出现即 FAIL，表示误按 JSON 解构）
  forbidden_error_messages:
    - "code undefined"
    - "message undefined"
    - "Cannot read properties of undefined"
  # JSON 对照响应（验证正常解构流程不受影响）
  json_control_response:
    code: 0
    message: "ok"
    data:
      sample_field: "sample_value"
  # 断言项
  assertions:
    blob_returns_data_directly: true
    arraybuffer_returns_data_directly: true
    json_destructures_correctly: true
    no_false_error_message: true
    interceptor_has_response_type_branch: true
  # 扫描目录
  scan_dirs:
    - "admin-web/src/"

# 阶段 72：工作流重跑前后状态验证
workflow_retry_state_test:
  description: "工作流重跑前后状态验证（阶段 72）"
  enabled: true
  severity: "CRITICAL"
  # 重跑起始步骤字段名（不硬编码字段名，通过配置管理）
  from_step_field: "from_step"
  triggered_by_field: "triggered_by"
  # 重跑后期望的初始状态
  expected_initial_status: "queued"
  # 需要重置的字段清单（重跑后应为 None）
  fields_to_reset:
    - "error"
    - "finished_at"
  # 前驱步骤应保留的状态
  preserved_step_status: "success"
  # 步骤记录字段名
  step_name_field: "step_name"
  step_status_field: "status"
  step_result_field: "result"
  # 优先队列 mock 配置
  priority_queue_mock:
    enabled: true
    method_name: "put"
    expected_call_count: 1
  # 断言项
  assertions:
    workflow_id_unchanged: true
    subsequent_steps_deleted: true
    preceding_steps_preserved: true
    preserved_result_complete: true
    status_reset_to_queued: true
    error_field_cleared: true
    finished_at_field_cleared: true
    workflow_re_enqueued: true

# 阶段 73：时区敏感测试基线对齐
timezone_baseline_alignment_test:
  description: "时区敏感测试基线对齐（阶段 73）"
  enabled: true
  severity: "MEDIUM"
  # 测试代码中禁止使用的时间函数
  forbidden_time_functions:
    - "datetime\\.utcnow\\(\\)"
    - "datetime\\.utcnow\\(\\)\\.replace\\(tzinfo=None\\)"
  # 生产代码使用的时间函数（用于对齐测试基线）
  production_time_function: "utcnow_naive"
  # 生产时间函数返回类型（local_time 或 utc_time）
  production_returns: "local_time"
  # 时间比较近似断言的 epsilon 值（秒）
  epsilon_seconds: 1.0
  # 稳定性验证运行次数
  stability_run_count: 3
  # 精确等于断言检查（命中即 WARN，建议改近似断言）
  exact_equality_patterns:
    - "==\\s*datetime\\."
    - "assertEqual\\(.*datetime\\."
  # 断言项
  assertions:
    no_forbidden_time_functions: true
    baseline_aligned: true
    approximate_assertions: true
    stability_verified: true
  # 扫描目录（测试文件）
  scan_dirs:
    - "backend/tests/"

# 阶段 74：外键关联删除验证
foreign_key_cascade_delete_test:
  description: "外键关联删除验证（阶段 74）"
  enabled: true
  severity: "HIGH"
  # 父表配置（不硬编码表名，通过配置管理）
  parent_table:
    name: "channel"
    create_endpoint: "/api/admin/channels"
    delete_endpoint: "/api/admin/channels/{id}"
  # 子表配置（外键指向父表）
  child_table:
    name: "episode"
    foreign_key_field: "channel_id"
    create_endpoint: "/api/admin/episodes"
    query_endpoint: "/api/admin/episodes?channel_id={id}"
  # 期望的级联动作（set_null / cascade / restrict）
  expected_cascade_action: "set_null"
  # 是否验证不依赖 PRAGMA foreign_keys 开关
  check_pragma_independence: true
  # PRAGMA 查询语句
  pragma_query: "PRAGMA foreign_keys"
  # 测试环境期望的 PRAGMA 值（默认未开启）
  expected_pragma_value: 0
  # 断言项
  assertions:
    foreign_key_handled_correctly: true
    parent_record_deleted: true
    pragma_independent: true
    env_consistent: true

# 阶段 75：flaky 测试根因修复验证
flaky_root_cause_fix_test:
  description: "flaky 测试根因修复验证（阶段 75）"
  enabled: true
  severity: "MEDIUM"
  # 已知 flaky 测试清单（测试用例 ID 或文件名）
  known_flaky_tests: []
  # 根因分类清单
  root_cause_categories:
    - "timezone"
    - "concurrency"
    - "random"
    - "time_precision"
    - "test_order"
    - "resource_leak"
  # 时间比较近似断言的 epsilon 值（秒）
  epsilon_seconds: 1.0
  # 稳定性验证运行次数
  stability_run_count: 3
  # 是否检查修复引入新失败
  check_no_new_failures: true
  # 随机种子固定值（用于固定随机数）
  random_seed: 42
  # 断言项
  assertions:
    root_cause_classified: true
    root_cause_eliminated: true
    stability_verified: true
    no_new_failures: true

# ===== 测试流程优化（v10 新增）=====

# 流程优化 1：区分本次引入 vs 预先存在的失败
test_failure_diff_check:
  description: "区分本次修改引入 vs 预先存在的测试失败（流程优化 1）"
  enabled: true
  stash_command: "git stash push -u"
  pop_command: "git stash pop"
  test_command: "pytest --asyncio-mode=auto"
  # 如 stashed 状态测试环境不可用则跳过本流程
  skip_on_env_unavailable: true
  # 失败分类
  classification:
    preexisting_failure: "business_data"
    regression_introduced: "code_defect"
  # 严重级别
  severity_on_regression: "FAIL"
  severity_on_preexisting: "WARN"

# 流程优化 2：分步验证策略
stepwise_verification_strategy:
  description: "分步验证策略（流程优化 2）"
  enabled: true
  steps:
    - name: "syntax_check"
      command: "python -m py_compile {modified_file}"
      stop_on_fail: true
    - name: "target_test"
      command: "pytest {target_test_file} -v"
      stop_on_fail: true
    - name: "full_test_suite"
      command: "pytest --asyncio-mode=auto"
      # 完整套件失败时区分回归 vs 预先存在
      stop_on_fail: false
    - name: "frontend_build"
      command: "npm run build"
      stop_on_fail: true
      cwd: "admin-web"
  # 是否记录每步执行耗时
  record_timing: true

# 流程优化 3：PowerShell 兼容性策略
powershell_compatibility_strategy:
  description: "PowerShell 兼容性策略（流程优化 3）"
  enabled: true
  # 禁止的语法（PowerShell 5.x 不支持）
  forbidden_syntax:
    - "&&"
    - "||"
  # 推荐的命令分隔符
  recommended_separator: ";"
  # Python 脚本调用规范
  require_python_unbuffered: true
  require_stderr_redirect: true
  python_call_pattern: "python -u {script} 2>&1"
  # 临时脚本管理
  temp_script_dir: ".tmp"
  cleanup_temp_scripts: true
  # 禁止因 PowerShell RemoteException 警告而 exit 1
  forbidden_exit_on_warning: true
  # 扫描文件（检查 PowerShell 兼容性）
  scan_files:
    - "*.ps1"
    - "package.json"
  # 严重级别
  severity_on_violation: "WARN"

# ============================================================
# 辅助阶段 65：命令链语法适配预检（R149）
# ============================================================
command_chain_syntax_check:
  description: "命令链语法适配预检配置"
  enabled: true
  target_platforms: ["powershell_5"]
  shell_separators:
    powershell_5: ";"
    powershell_7: ";"
    cmd: "&"
    bash: "&&"
    zsh: "&&"
  error_signal: "The token '&&' is not a valid statement separator"
  auto_fix: true
  auto_fix_replacement: ";"
  severity_on_detect: "WARN"

# ============================================================
# 辅助阶段 66：模块级函数对称性预检（R150）
# ============================================================
function_symmetry_check:
  description: "模块级函数对称性预检配置"
  enabled: true
  target_modules: ["app/paths.py", "app/utils/*.py", "app/core/*.py"]
  symmetric_function_patterns:
    - "resolve_*_path"
    - "get_*_config"
    - "check_*_exists"
    - "format_*_url"
  known_pairs:
    - func_a: "resolve_ffmpeg_path"
      func_b: "resolve_ffprobe_path"
      module: "app.paths"
    - func_a: "resolve_data_dir"
      func_b: "resolve_log_dir"
      module: "app.paths"
  verify_command: 'python -c "from module import *"'
  severity_on_missing: "FAIL"
  severity_on_asymmetric: "WARN"

# ============================================================
# 辅助阶段 67：服务重启加载新代码验证（R151）
# ============================================================
service_restart_verification:
  description: "服务重启加载新代码验证配置"
  enabled: true
  # 前端构建后是否需要重启后端
  # 为什么：开发模式下前端构建产物在 admin-web/dist，后端静态文件挂载需重启才生效
  rebuild_requires_backend_restart: true
  openapi_endpoint: "/openapi.json"
  health_endpoint: "/api/health"
  # 健康检查重试次数 + 单次超时（秒）双控
  health_check_retries: 30
  health_timeout_sec: 30
  # 健康检查期望 HTTP 状态码（200 表示服务就绪）
  health_expected_code: 200
  start_script: "scripts/启动服务.bat"
  stop_script: "scripts/停止服务.bat"
  verify_endpoint_count: true
  verify_endpoint_paths: true
  trigger_on_files: ["routers/**/*.py", "main.py", "services/**/*.py"]
  severity_on_stale_code: "FAIL"
  severity_on_startup_failure: "FAIL"

# ============================================================
# 辅助阶段 68：API 认证验证矩阵（R152）
# ============================================================
auth_verification_matrix:
  description: "API 认证验证矩阵配置"
  enabled: true
  token_present_expected_status: 200
  token_absent_expected_status: 401
  token_expired_expected_status: 401
  token_invalid_expected_status: 401
  test_scenarios: ["with_token", "without_token"]
  optional_scenarios: ["expired_token", "invalid_token"]
  login_endpoint: "/admin/api/v1/auth/login"
  login_response_token_field: "token"
  report_format: "matrix_table"
  severity_on_auth_bypass: "FAIL"
  severity_on_auth_overblock: "WARN"

# ============================================================
# 辅助阶段 69：跨项目移植适配验证（R153）
# 说明：本阶段配置已合并至上方"阶段 32"的 cross_project_migration_test 配置块
# （7 步法 + 4 项适配检查合并为一个完整配置节点，避免 YAML 重复键覆盖问题）
# ============================================================

# ============================================================
# 辅助阶段 70：小程序原生代码 4 维静态验证（R174）
# 来源：2026-07-31 微信登录修复复盘。小程序原生代码无法用 Playwright 直接测试，
#       需通过语法/接口/契约/渲染 4 维静态验证覆盖。
# ============================================================
miniprogram_static_check:
  description: "小程序原生代码 4 维静态验证（语法/接口/契约/渲染）"
  enabled: true
  trigger_on_files:
  - "miniprogram/**/*.js"
  - "miniprogram/**/*.wxml"
  - "miniprogram/**/*.wxss"
  - "miniprogram/**/*.json"
  dimensions:
  - id: "syntax"
    name: "语法维"
    description: "用 node --check 检查所有修改的 .js 文件语法"
    command: "node --check {file}"
    applicable_files:
    - "miniprogram/**/*.js"
    stop_on_fail: true
    severity_on_fail: "FAIL"
  - id: "interface"
    name: "接口维"
    description: "验证调用的依赖模块函数签名一致"
    check_items:
    - "require() 路径存在"
    - "导出函数名与调用方一致"
    - "参数个数与签名一致"
    - "返回值结构与使用方一致"
    applicable_files:
    - "miniprogram/**/*.js"
    stop_on_fail: true
    severity_on_fail: "FAIL"
  - id: "contract"
    name: "契约维"
    description: "验证前端请求/响应字段与后端路由定义对齐"
    check_items:
    - "请求字段名 vs 后端 Pydantic Model 字段名"
    - "响应字段名 vs 前端使用字段名"
    - "snake_case / camelCase 一致性"
    - "兜底链数据源完整性"
    backend_route_glob: "backend/app/routers/**/*.py"
    applicable_files:
    - "miniprogram/**/*.js"
    stop_on_fail: false
    severity_on_fail: "WARN"
  - id: "render"
    name: "渲染维"
    description: "验证 .wxml 数据绑定字段名与 setData 一致"
    check_items:
    - "wxml 中 {{field}} 在 data 或 setData 中存在"
    - "wx:for 绑定的数组名在 data 中存在"
    - "绑定的函数名在 Page/Component methods 中存在"
    applicable_files:
    - "miniprogram/**/*.wxml"
    - "miniprogram/**/*.js"
    stop_on_fail: false
    severity_on_fail: "WARN"
  report_format: "dimension_table"
  report_columns:
  - "dimension"
  - "status"
  - "issues"
  - "file"
  - "line"
  severity_on_skip: "FAIL"  # 修改了小程序代码但跳过 4 维验证属严重违规
  skip_detection:
    grep_pattern: "node --check"
    check_location: "git commit message + PR description"

# ============================================================
# 辅助阶段 71：前后端字段契约验证清单（R175）
# 来源：2026-07-31 微信登录修复复盘。规范 R16 定义原则，本阶段补充可操作的验证清单。
# ============================================================
field_contract_check:
  description: "前后端字段契约验证清单（请求/响应/兜底链）"
  enabled: true
  trigger_on_api_changes: true
  api_change_detection:
    backend_glob:
    - "backend/app/routers/**/*.py"
    - "backend/app/schemas/**/*.py"
    frontend_glob:
    - "admin-web/src/api/**/*.js"
    - "miniprogram/services/*.js"
  verification_items:
  - id: "request_fields"
    name: "请求字段对齐"
    description: "前端发送的字段名 vs 后端 Pydantic Model 字段名"
    check_method: "对比前端 api.js 请求 payload 与后端 Pydantic Schema 字段"
    severity_on_mismatch: "FAIL"
  - id: "response_fields"
    name: "响应字段对齐"
    description: "后端返回的字段名 vs 前端使用的字段名"
    check_method: "对比后端路由返回 dict 与前端 res.xxx 取值"
    severity_on_mismatch: "FAIL"
  - id: "fallback_chain"
    name: "兜底链数据源验证"
    description: "前端多名字兜底（如 avatar_url || avatar || avatarUrl）每个名字都有数据源"
    check_method: "提取 || 链中每个字段名，验证至少一个数据源返回"
    severity_on_redundant: "WARN"
  naming_style:
    backend: "snake_case"
    frontend_passthrough: true
    forbid_camelcase_transform: true
  known_field_pairs:
  - backend: "audio_url"
    frontend_wrong: "audioUrl"
    description: "音频地址（snake_case 透传）"
    severity: "MEDIUM"
  - backend: "episode_id"
    frontend_wrong: "episodeId"
    description: "节目 ID（前端变量可用 camelCase，但取后端字段需用 episode_id）"
    severity: "LOW"
  - backend: "categories"
    frontend_wrong: "category"
    description: "分类列表（复数，禁止单数）"
    severity: "MEDIUM"
  - backend: "script"
    frontend_wrong: "content"
    description: "稿件内容（历史兼容可 fallback：res.script || res.content）"
    severity: "MEDIUM"
    allow_fallback: true
  - backend: "placements"
    frontend_wrong: "dates"
    description: "排期投放数组（结构不同，dates 是 map，placements 是数组）"
    severity: "HIGH"
  - backend: "avatar_url"
    frontend_wrong: "avatarUrl"
    description: "头像地址（snake_case 透传，前端兜底链可包含）"
    severity: "MEDIUM"
    allow_fallback: true
  report_format: "contract_matrix"
  report_columns:
  - "api_endpoint"
  - "field_name"
  - "backend_definition"
  - "frontend_usage"
  - "status"
  - "severity"
  - "suggestion"
  cross_reference_config: "news-frontend-code-review/config.yaml#field_contract_frontend"

# ============================================================
# 辅助阶段 89-95：多页面共享状态同步复盘新增测试阶段（规范 66-72）
# 来源：2026-07-31 "我的偏爱"频道显示异常复盘。多页面共享状态（用户偏好、
#       筛选条件、登录态）在 onShow 时若仅依赖 data 镜像或单信号时间戳，
#       会出现切换 Tab 后残留旧数据或漏刷新的问题。本区块通过 7 个阶段
#       覆盖共享状态同步、防御性过滤、空状态标记、双校验、异步窗口读取、
#       globalData 同步、生命周期刷新策略。
# 通用性：参数均通过本区块管理，trigger_on_files 可配置 React/Vue/Taro/
#        uni-app 等任意框架路径，shared_state_fields 可配置任意共享状态字段。
# ============================================================
shared_state_testing:
  description: "多页面共享状态同步 7 维测试（规范 66-72）"
  enabled: true
  report_format: "stage_matrix"
  report_columns:
  - "stage"
  - "rule_ref"
  - "status"
  - "issues"
  - "file"
  - "line"
  - "severity"
  cross_reference:
    coding_standards: "news-code-dev/references/lessons-learned.md#规范66-72"
    frontend_review: "news-frontend-code-review/config.yaml#shared_state_sync"
  retrospective_dimensions:
  - "成功执行任务的完整步骤"
  - "任务执行过程中的不确定性与失败点"
  - "可抽象的固定流程与判断逻辑"
  - "适用场景与不适用场景"

  # ----------------------------------------------------------
  # 阶段 89：多页面共享状态 onShow 同步测试（规范 66）
  # ----------------------------------------------------------
  stage_89:
    description: "跨页面共享状态在 onShow 必须从权威源重新读取"
    enabled: true
    severity: HIGH
    rule_ref: "规范 66"
    category: "shared_state_sync"
    trigger_on_files:
    - "miniprogram/pages/**/*.js"
    - "miniprogram/pages/**/*.ts"
    authority_source_patterns:
    - "localData\\."
    - "getApp\\(\\)\\.globalData\\."
    shared_state_fields:
    - "isPreferredMode"
    - "currentChannelId"
    - "preferredIds"
    lifecycle_hook: "onShow"
    signals:
    - id: "no_authority_source_in_onshow"
      description: "onShow 中涉及共享状态字段但未调用权威源"
      pattern: "(?s)onShow\\s*\\([^)]*\\)\\s*\\{(?:(?!localData\\.|getApp\\(\\)\\.globalData\\.).)*?(?:isPreferredMode|currentChannelId|preferredIds)"
      severity_on_match: "FAIL"
    test_steps:
    - "设置共享状态值 A → 切换到其他 Tab → 切回 → 验证 UI 显示 A 对应数据"
    - "清空共享状态值 → 切换到其他 Tab → 切回 → 验证显示空状态引导提示"
    pass_criteria:
    - "切 Tab 后 UI 数据与权威源最新值一致"
    - "清空状态后 UI 显示空状态引导提示，不残留旧数据"

  # ----------------------------------------------------------
  # 阶段 90：过滤模式防御性二次过滤测试（规范 67）
  # ----------------------------------------------------------
  stage_90:
    description: "列表渲染层必须按当前过滤条件对数据二次校验"
    enabled: true
    severity: HIGH
    rule_ref: "规范 67"
    category: "defensive_filter"
    trigger_on_files:
    - "miniprogram/pages/**/*.js"
    - "miniprogram/pages/**/*.ts"
    apply_data_func_pattern: "_apply\\w*Data"
    filter_method: ".filter("
    filter_mode_values:
    - "preferred"
    - "admin"
    - "premium"
    signals:
    - id: "no_defensive_filter_in_apply"
      description: "数据应用函数在过滤模式下未对数据二次过滤"
      pattern: "(?s)_apply\\w*Data\\s*\\([^)]*\\)\\s*\\{(?:(?!\\.filter\\().)*?currentChannelId\\s*===\\s*'preferred'"
      severity_on_match: "FAIL"
    test_steps:
    - "设置过滤模式 → 触发 onLoad 预渲染（globalData 残留全量数据）→ 验证 UI 只显示过滤后数据"
    - "设置过滤模式 → 调用数据应用函数传入全量数据 → 验证输出只包含过滤后数据"
    pass_criteria:
    - "UI 显示的数据严格符合当前过滤条件"
    - "即使上游返回全量数据，UI 也不泄漏未过滤内容"

  # ----------------------------------------------------------
  # 阶段 91：空状态显式标记测试（规范 68）
  # ----------------------------------------------------------
  stage_91:
    description: "每个可能为空的状态必须有 xxxEmpty 标志并显式设置"
    enabled: true
    severity: MEDIUM
    rule_ref: "规范 68"
    category: "empty_state_explicit"
    trigger_on_files:
    - "miniprogram/pages/**/*.js"
    - "miniprogram/pages/**/*.wxml"
    load_func_pattern: "async\\s+load\\w*"
    empty_flag_suffix: "Empty"
    empty_state_fields:
    - "todayList"
    - "historyList"
    - "renderList"
    - "list"
    signals:
    - id: "empty_flag_not_set_in_load"
      description: "数据加载函数未在所有分支显式设置空状态标志"
      pattern: "(?s)async\\s+load\\w*\\s*\\([^)]*\\)\\s*\\{(?:(?!Empty).)*?setData"
      severity_on_match: "WARN"
    - id: "empty_flag_not_used_in_wxml"
      description: "wxml 中未通过空状态标志显示引导提示"
      pattern: "wx:if=\"\\{{[^}]*List\\s*&&\\s*[^}]*List\\.length"
      severity_on_match: "WARN"
    test_steps:
    - "未设置状态 → 调用加载函数 → 验证 xxxEmpty=true 且 UI 显示引导提示"
    - "设置状态但过滤后为空 → 调用加载函数 → 验证 xxxEmpty=true"
    - "设置状态且过滤后有数据 → 调用加载函数 → 验证 xxxEmpty=false"
    pass_criteria:
    - "所有数据加载分支（未设置、加载失败、过滤后空）显式设置 xxxEmpty"
    - "wxml 通过 xxxEmpty 标志显示引导提示，不依赖列表长度判断"

  # ----------------------------------------------------------
  # 阶段 92：时间戳+内容双校验变更检测测试（规范 69）
  # ----------------------------------------------------------
  stage_92:
    description: "跨页面状态变更检测必须采用时间戳 OR 内容双校验"
    enabled: true
    severity: HIGH
    rule_ref: "规范 69"
    category: "dual_signal_detect"
    trigger_on_files:
    - "miniprogram/pages/**/*.js"
    timestamp_field_pattern: "_last\\w+Ts"
    content_compare_method: "JSON.stringify"
    change_indicator_pattern: "\\w+Changed"
    signals:
    - id: "only_timestamp_check"
      description: "仅时间戳单信号检测，缺少内容校验"
      pattern: "(?s)_last\\w+Ts\\s*!==\\s*[\\w.]+Changed(?!.*JSON\\.stringify)"
      severity_on_match: "WARN"
    test_steps:
    - "修改状态但不变更时间戳（如 Tab 切换）→ 验证仍能检测到变更并刷新"
    - "修改状态并变更时间戳 → 验证检测到变更并刷新"
    - "状态未变更 → 验证不触发冗余刷新"
    pass_criteria:
    - "时间戳变化 OR 内容不一致任一满足即刷新"
    - "Tab 切换等不更新时间戳的场景也能正确检测变更"

  # ----------------------------------------------------------
  # 阶段 93：异步窗口本地存储直接读取测试（规范 70）
  # ----------------------------------------------------------
  stage_93:
    description: "setData 后立即需要最新值时必须从权威源直接读取"
    enabled: true
    severity: HIGH
    rule_ref: "规范 70"
    category: "async_window_read"
    trigger_on_files:
    - "miniprogram/pages/**/*.js"
    load_func_pattern: "load(?:Preferred|History|\\w+)"
    forbidden_mirror_read: "this\\.data\\.(?:preferredIds|\\w+Ids)"
    authority_method_patterns:
    - "localData\\.get\\w+\\(\\)"
    - "getApp\\(\\)\\.globalData\\.\\w+"
    signals:
    - id: "read_data_mirror_in_load"
      description: "加载函数中读取 this.data 镜像而非权威源"
      pattern: "(?s)load(?:Preferred|History|\\w+)\\s*\\([^)]*\\)\\s*\\{(?:(?!localData\\.get|getApp\\(\\)\\.globalData).)*?this\\.data\\.(?:preferredIds|\\w+Ids)"
      severity_on_match: "FAIL"
    test_steps:
    - "onShow 中 setData 更新状态 → 立即调用 loadXxx → 验证加载函数读取权威源最新值"
    - "快速连续切换状态 → 验证加载函数每次读取的都是最新值，不是旧镜像"
    pass_criteria:
    - "加载函数在异步窗口内直接从权威源读取，不依赖 this.data 镜像"
    - "快速连续操作不会读到旧值"

  # ----------------------------------------------------------
  # 阶段 94：globalData 与 data 镜像同步测试（规范 71）
  # ----------------------------------------------------------
  stage_94:
    description: "清空/更新 data 镜像时必须同步清空/更新 globalData 对应字段"
    enabled: true
    severity: HIGH
    rule_ref: "规范 71"
    category: "globaldata_sync"
    trigger_on_files:
    - "miniprogram/pages/**/*.js"
    sync_field_pairs:
    - { data_field: "todayList", global_field: "todayList" }
    - { data_field: "currentEpisode", global_field: "currentEpisode" }
    - { data_field: "historyList", global_field: "historyList" }
    empty_value: "[]"
    signals:
    - id: "clear_data_without_globaldata"
      description: "清空 data 镜像但未同步清空 globalData"
      pattern: "(?s)setData\\s*\\(\\s*\\{[^}]*todayList:\\s*\\[\\](?!.*globalData\\.todayList\\s*=\\s*\\[\\])"
      severity_on_match: "FAIL"
    test_steps:
    - "清空 data.todayList → 验证 globalData.todayList 也被清空"
    - "更新 data.currentEpisode → 验证 globalData.currentEpisode 同步更新"
    - "从其他页面读取 globalData → 验证不读到残留数据"
    pass_criteria:
    - "data 镜像清空/更新时 globalData 对应字段同步清空/更新"
    - "其他页面从 globalData 读取到的是最新值，不是残留数据"

  # ----------------------------------------------------------
  # 阶段 95：页面生命周期刷新策略测试（规范 72）
  # ----------------------------------------------------------
  stage_95:
    description: "onShow 检测到状态变更后必须强制重新加载当前模式数据"
    enabled: true
    severity: HIGH
    rule_ref: "规范 72"
    category: "lifecycle_reload"
    trigger_on_files:
    - "miniprogram/pages/**/*.js"
    required_load_funcs:
    - "loadPreferred"
    - "loadHistory"
    - "loadToday"
    - "loadChannel"
    mode_field: "isPreferredMode"
    mode_load_mapping:
    - { mode_value: true, load_func: "loadPreferred" }
    - { mode_value: false, load_func: "loadToday" }
    signals:
    - id: "sync_without_reload"
      description: "onShow 同步状态后未调用加载函数"
      pattern: "(?s)onShow\\s*\\([^)]*\\)\\s*\\{(?:(?!loadPreferred|loadHistory|loadToday|loadChannel).)*?setData"
      severity_on_match: "FAIL"
    test_steps:
    - "修改共享状态 → 切换 Tab → 切回 → 验证 onShow 调用对应加载函数"
    - "修改共享状态但当前模式未变 → 验证 onShow 仍重新加载当前模式数据"
    pass_criteria:
    - "onShow 检测到状态变更后调用对应模式的加载函数"
    - "禁止仅同步状态而不触发加载"
