# ===== 前端自动化测试技能配置模板 =====
# 复制本文件为 config.yaml 并按项目实际情况修改
# 所有测试参数（URL、账号、页面清单、阈值等）均通过本文件管理，技能本身不含硬编码值

# --- 服务配置 ---
service:
  # 基础 URL（不含尾斜杠）
  base_url: "http://127.0.0.1:8000"
  # 健康检查端点
  health_endpoint: "/api/health"
  # 健康检查超时（秒）
  health_timeout: 30
  # 健康检查期望的 code 字段值
  health_expected_code: 0
  # 启动脚本路径（相对于项目根目录，留空则跳过自动启动）
  start_script: "scripts/start.ps1"
  # 启动脚本参数（如 ["-Dev"] 强制开发模式）
  start_args: []
  # 停止脚本路径（留空则跳过自动停止）
  stop_script: "scripts/stop.ps1"

# --- MCP 工具配置 ---
mcp_tools:
  # Playwright MCP 服务器名称（对应 .trae-cn/mcps 中的配置）
  playwright_server: "mcp_Playwright"
  # Chrome DevTools MCP 服务器名称
  chrome_devtools_server: "mcp_Chrome_DevTools_MCP"
  # 优先使用的工具（primary 为主，fallback 为备选）
  primary_tool: "chrome_devtools"  # chrome_devtools | playwright
  fallback_tool: "playwright"
  # Playwright 浏览器配置
  playwright:
    # 无头模式
    headless: true
    # 视口宽度
    viewport_width: 1280
    # 视口高度
    viewport_height: 800
    # 浏览器类型
    browser: "chromium"
    # 浏览器安装命令（用于首次安装）
    install_command: "npx playwright install chromium"
  # Chrome DevTools 配置
  chrome_devtools:
    # 导航超时（毫秒）
    nav_timeout: 15000
    # 元素交互超时（毫秒）
    interaction_timeout: 10000

# --- 测试账号 ---
credentials:
  # 管理后台（B 端）账号
  admin:
    username: "admin"
    password: "admin123"
    # 登录 API 端点
    login_endpoint: "/admin/api/v1/auth/login"
    # 登录方法 POST/GET
    login_method: "POST"
    # 登录页 URL
    login_page: "/login"
    # 登录成功后跳转的页面（用于验证登录是否成功）
    expected_redirect: "/review"
    # token 在响应 JSON 中的字段路径（点分路径）
    token_path: "data.token"
    # token 存储的 localStorage key（用于前端验证）
    token_storage_key: "admin_token"
    # 用户名输入框 CSS 选择器
    username_selector: 'input[type="text"]'
    # 密码输入框 CSS 选择器
    password_selector: 'input[type="password"]'
    # 登录按钮 CSS 选择器
    submit_selector: "button.login-btn"
  # C 端用户账号（如需要测试小程序接口）
  # consumer:
  #   login_endpoint: "/api/v1/auth/login"
  #   login_method: "POST"
  #   login_payload: { "code": "test_code" }

# --- 页面清单 ---
# 每个页面会执行：导航 → 截图 → 快照 → 控制台检查 → 网络请求检查
pages:
  - name: "登录页"
    path: "/login"
    # 预期页面标题包含的文本
    expected_title: ""
    # 预期页面中出现的文本（至少一个）
    expected_texts: ["登录"]
    # 是否需要登录才能访问
    requires_auth: false
    # 是否跳过测试
    skip: false

  - name: "内容审核"
    path: "/review"
    expected_title: ""
    expected_texts: ["内容审核", "待审核"]
    requires_auth: true
    skip: false

