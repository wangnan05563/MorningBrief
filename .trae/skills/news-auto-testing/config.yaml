# ===== 阶段 52-57：前端交互稳定性与编辑完整性复盘测试（对应 R118-R126）=====

stage_minimize_guard_test:
  description: "浏览器窗口最小化防护测试（阶段 52，对应 R118）"
  enabled: true
  # 测试目标：验证浏览器最小化时不会自动弹出
  test_goal: "verify_minimize_no_popup"
  # 最小化后等待时间（毫秒）
  minimize_wait_ms: 5000
  # 验证窗口是否保持最小化
  verify_window_minimized: true
  # 验证 401 跳转用 router.push 而非 location.href
  verify_router_push_not_location_href: true
  # 验证 ElMessage 调用前有 document.hidden 检查
  verify_hidden_check_before_elmessage: true
  # 验证轮询请求有 silent 标记
  verify_silent_polling: true
  # 验证路径判断用严格相等
  verify_strict_path_match: true
  # 测试页面
  test_pages:
    - path: "/workflows"
      name: "工作流监控"
      require_login: true
    - path: "/ai-config"
      name: "AI 服务配置"
      require_login: true
  # 验证脚本（evaluate_script）
  verify_scripts:
    - "document.querySelector('script[src*=index]') !== null"
    - "typeof router !== 'undefined' && router.push !== undefined"
  # 失败信号
  failure_signals:
    - "window restored from minimized state"
    - "ElMessage called without document.hidden check"
    - "location.href assignment detected"

stage_route_param_timing_test:
  description: "异步路由参数时序测试（阶段 53，对应 R119）"
  enabled: true
  # 测试目标：验证 router.replace 后 loadDetail 用显式传参
  test_goal: "verify_explicit_param_after_replace"
  # 测试页面（工作流详情页）
  test_pages:
    - path: "/workflows/{workflow_id}"
      name: "工作流详情页"
      require_login: true
      # 模拟重跑操作
      actions:
        - name: "trigger_retry"
          button_hint: "重跑"
          expected_action: "url_change"
          # 验证新工作流 ID 被正确加载
          verify_new_workflow_loaded: true
  # 验证 loadDetail 接受显式参数
  verify_explicit_param: true
  # 验证轮询用 detail.value 而非 route.params
  verify_detail_value_in_polling: true
  # 网络请求验证：重跑后请求的是新 ID
  verify_network_request_new_id: true
  # 失败信号
  failure_signals:
    - "loadDetail called without explicit param after router.replace"
    - "polling reads route.params instead of detail.value"
    - "network request uses old workflow_id"

stage_polling_state_sync_test:
  description: "列表数据动态轮询状态同步测试（阶段 54，对应 R120）"
  enabled: true
