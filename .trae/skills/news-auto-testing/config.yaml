# ============================================================
# === 2026-07-21 新增：小程序真机调试复盘测试配置（阶段 43-46）===
# ============================================================
# 对应 news-code-dev 元规范 R101-R108，详见 SKILL.md 阶段 43-46
# 所有扫描目录、URL 模式、测试用例 ID 均通过本节管理，禁止硬编码业务值

# ---- 阶段 43：小程序 Page 方法名唯一性测试（对应 R101）----
# 背景：webview.js 中 onLoad 被定义两次（生命周期 + bindload 回调），后定义覆盖前定义导致 url 参数丢失
# 规则：Page 对象内方法名唯一，生命周期不与 wxml 回调方法重名
stage_43_page_method_uniqueness:
  enabled: true
  # 扫描 glob 模式
  scan_glob: "miniprogram/pages/**/*.js"
  # 生命周期方法清单（必须唯一）
  lifecycle_methods:
    - "onLoad"
    - "onShow"
    - "onReady"
    - "onHide"
    - "onUnload"
    - "onPullDownRefresh"
    - "onReachBottom"
  # wxml 回调方法绑定模式（与生命周期重名即违规）
  wxml_callback_patterns:
    - "bindload"
    - "binderror"
    - "bindtap"
    - "bindinput"
    - "bindchange"
  # 是否禁止 Page 对象内同名键
  forbid_duplicate_keys: true
  # 是否禁止生命周期与 wxml 回调方法重名
  forbid_lifecycle_collision: true
  # 严重级别
  severity_on_duplicate: "FAIL"
  severity_on_lifecycle_collision: "FAIL"
  severity_on_custom_method_collision: "WARN"

# ---- 阶段 44：小程序外链 ActionSheet 兜底测试（对应 R104）----
# 背景：业务域名未配置时 wx.navigateTo 跳转 webview 白屏，binderror 不触发
# 规则：外链跳转必须 wx.showActionSheet 提供"复制链接"兜底
stage_44_external_link_fallback:
  enabled: true
  # 扫描 glob 模式
  scan_glob: "miniprogram/pages/**/*.js"
  # 外链跳转模式（命中即检查是否有 ActionSheet 兜底）
  nav_patterns:
    - "wx.navigateTo.*webview"
    - "wx.navigateTo.*url.*http"
    - "wx.navigateTo.*url.*encodeURIComponent"
  # 是否强制 ActionSheet 兜底
  require_action_sheet: true
  # 是否强制 fail 回调
  require_fail_callback: true
  # ActionSheet 必须包含的选项
  required_actions:
    - "复制链接"
    - "在小程序内打开"
  # 是否在跳转失败时回退到剪贴板
  fallback_to_clipboard: true
  # 剪贴板复制函数命名约定
  clipboard_function_pattern: "_copySourceUrl|_copyToClipboard"
  # 测试用 URL 清单（含中文路径、特殊字符）
  test_urls:
    - "https://example.com/article/1"
    - "https://example.com/article/中文路径"
    - "https://example.com/article?a=1&b=2"
  # 严重级别
  severity_on_no_action_sheet: "FAIL"
  severity_on_no_fail_callback: "FAIL"
  severity_on_missing_copy_action: "WARN"

# ---- 阶段 45：跨页布局一致性测试（对应 R108）----
# 背景：历史页用上下卡片，首页用行式卡片，用户切换页面视觉跳跃
# 规则：列表页与详情页卡片类名一致，_enrichEpisode 字段同步
stage_45_cross_page_layout_consistency:
  enabled: true
  # 页面对清单（每对需检查卡片类名一致性）
  page_pairs:
    - source: "pages/index/index"
      target: "pages/history/history"
      shared_card_class: "episode-row-card"
    - source: "pages/index/index"
      target: "pages/detail/detail"
      shared_card_class: "episode-row-card"
  # 是否强制 _enrichEpisode 字段同步
  require_enrich_episode_sync: true
  # 必须同步的字段清单
  required_fields:
    - "date_label"
    - "duration_label"
    - "play_count"
    - "channel_name"
  # 是否启用截图对比
  screenshot_compare: true
  # 截图差异阈值（0-1，超过此值视为布局不一致）
  diff_threshold: 0.1
  # 卡片样式必须一致的字段清单
  consistent_style_fields:
    - "padding"
    - "margin"
    - "border-radius"
    - "font-size"
  # 严重级别
  severity_on_class_mismatch: "FAIL"
  severity_on_field_missing: "FAIL"
  severity_on_style_diff: "WARN"

# ---- 阶段 46：聚合序号独立计数测试（对应 R106 后端侧）----
# 背景：节目来源序号从 2 开始因后端复用 segment.seq
# 规则：sources 序号从 1 重新编号，不复用外部 seq
stage_46_aggregated_seq_independence:
  enabled: true
  # 测试 API 端点（{id} 为占位符）
  api_endpoint: "/api/v1/episodes/{id}/script"
  # 聚合字段清单（每个字段都需检查序号独立性）
  aggregated_fields:
    - "sources"
    - "chapters"
    - "timestamps"
  # 是否强制从 1 开始
  require_start_from_one: true
  # 是否禁止复用 segment.seq
  forbid_reuse_segment_seq: true
  # 是否强制连续递增（无跳号）
  require_continuous: true
  # 测试用 episode ID 清单
  test_episode_ids:
    - 1
    - 2
    - 3
  # 序号字段名
  seq_field: "seq"
  # 严重级别
  severity_on_not_from_one: "FAIL"
  severity_on_reuse_segment_seq: "FAIL"
  severity_on_jump: "WARN"

