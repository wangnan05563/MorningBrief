scope:
  include:
  - backend/app/**/*.py
  exclude:
  - backend/app/**/__pycache__/**
  - backend/app/**/*.pyc
  - backend/tests/**
  project_root: .
priority:
  severity_order:
  - CRITICAL
  - HIGH
  - MEDIUM
  - LOW
  - INFO
  category_order:
  - security
  - error_handling
  - async_concurrency
  - sqlalchemy
  - workflow
  - field_contract
  - fastapi
  - cache
  - config_driven
  - logging
  - performance
  - layering
  - naming
  - type_annotation
  - testability
hard_constraints:
  block_on_violation: true
  rules:
  - name: deprecated_utcnow
    pattern: datetime\.utcnow\(\)
    message: datetime.utcnow() 已在 Python 3.12+ 弃用，应使用 utcnow_naive()（core/timeutil.py）
    severity: CRITICAL
    auto_fix: false
    category: sqlalchemy
  - name: datetime_now_no_tzinfo
    pattern: datetime\.now\(\)
    message: 禁止 datetime.now() 无 tzinfo，应使用 utcnow_naive() 统一 naive UTC 存储
    severity: HIGH
    auto_fix: false
    category: sqlalchemy
  - name: bare_sql_injection
    pattern: text\(\s*f["']
    message: 禁止用 f-string 拼接 SQL（SQL 注入风险），应参数化 text("...WHERE id=:id")
    severity: CRITICAL
    auto_fix: false
    category: sqlalchemy
  - name: enum_field_without_value
    pattern: Workflow(Source|Status|StepName|StepStatus)\.\w+(?!\.value)
    message: 'Enum 字段序列化必须用 .value，禁止返回枚举对象（前端无法解析 <Enum: ''x''>）'
    severity: HIGH
    auto_fix: false
    category: field_contract
  - name: create_task_no_reference
    pattern: asyncio\.create_task\([^)]+\)\s*(?!.*=\s*self)
    message: asyncio.create_task() 必须保留引用（赋值给 self._running_tasks 等），防止 GC 回收
    severity: CRITICAL
    auto_fix: false
    category: async_concurrency
  - name: sync_io_in_async
    pattern: (?s)async\s+def\s+\w+.*?time\.sleep\(
    message: async def 中禁止 time.sleep()，应改用 asyncio.sleep() 或 asyncio.to_thread()
    severity: CRITICAL
    auto_fix: false
    category: async_concurrency
  - name: sync_requests_in_async
    pattern: (?s)async\s+def\s+\w+.*?requests\.(get|post|put|delete)\(
    message: async def 中禁止 requests 同步库，应改用 httpx.AsyncClient
    severity: CRITICAL
    auto_fix: false
    category: async_concurrency
  - name: async_def_without_await
    pattern: (?s)async\s+def\s+\w+\([^)]*\)[^:]*:[^}]*?(?!.*await).*?(?:return|$)
    message: async def 方法体内无 await 表达式，应改为同步 def；Python 3.14 优化后 await None 触发 TypeError
    severity: HIGH
    auto_fix: false
    category: async_concurrency
    whitelist_decorators:
    - '@abstractmethod'
    - '@contextlib.asynccontextmanager'
    allow_async_generators: true
  - name: finally_unconditional_release
    pattern: finally:\s*\n\s*await\s+\w+\.release\(
    message: finally 块禁止无条件 release() 锁，必须用 lock_acquired 标志判断是否自己获取
    severity: CRITICAL
    auto_fix: false
    category: async_concurrency
  - name: redis_non_atomic_lrange_ltrim
    pattern: (?s)lrange\([^)]+\).*?ltrim\(
    message: LRANGE + LTRIM 非原子操作，并发下数据丢失，必须用 Lua 脚本或 pipeline 事务封装
    severity: CRITICAL
    auto_fix: false
    category: cache
  - name: token_compare_with_equals
    pattern: ==\s*["']?\w*token
    message: JWT token 比较禁止用 ==（时序攻击），必须用 hmac.compare_digest()
    severity: CRITICAL
    auto_fix: false
    category: security
  - name: hardcoded_credentials
    pattern: (password|secret|token|api_key|access_key|webhook_secret)\s*[:=]\s*["'][^"']{8,}["']
    message: 禁止硬编码凭据（密码/密钥/token），必须通过 settings 环境变量注入
    severity: CRITICAL
    auto_fix: false
    category: security
    placeholder_whitelist:
    - <
    - change-me
    - your_
    - xxx
  - name: sensitive_filter_not_initialized
    pattern: from\s+app\.workflow\.llm\s+import\s+sensitive_filter
    message: 敏感词过滤器必须在应用启动时调用 load_words() 初始化，否则 contains() 全返回 False
    severity: CRITICAL
    auto_fix: false
    category: security
    startup_files:
    - backend/app/main.py
    - backend/app/services/workflow_scheduler.py
  - name: logout_missing
    pattern: '@router\.(post|get)\(["'']/?(api/)?(logout|signout)["'']'
    message: 登出接口缺失或未写 JWT 黑名单，token 无法主动失效（被盗用风险持续到过期）
    severity: CRITICAL
    auto_fix: false
    category: security
    expected_route_prefixes:
    - /api/auth/logout
    - /api/admin/auth/logout
  - name: builtin_exception_shadowing
    pattern: class\s+(PermissionError|KeyError|ValueError|TypeError|FileNotFoundError)\s*\(
    message: 异常名不得覆盖内置，必须加业务前缀（如 BizPermissionError 而非 PermissionError）
    severity: HIGH
    auto_fix: false
    category: error_handling
  - name: bare_except_pass
    pattern: except\s*:\s*\n\s*pass
    message: 禁止裸 except + pass（吞异常），必须捕获具体异常并记录日志
    severity: HIGH
    auto_fix: false
    category: error_handling
  - name: exception_log_warning_fstring
    pattern: except\s+Exception\s+as\s+e:\s*\n[^\n]*logger\.warning\(f
    message: except 块内禁止 logger.warning(f"...{e}") 丢 traceback，必须用 logger.exception()
    severity: HIGH
    auto_fix: false
    category: logging
  - name: internal_route_no_auth
    pattern: '@router\.(get|post|put|delete)\('
    message: 内部接口（routers/internal/）必须加 Depends(verify_localhost) 鉴权
    severity: CRITICAL
    auto_fix: false
    category: fastapi
    scan_dirs:
    - backend/app/routers/internal/
  - name: print_statement
    pattern: ^\s*print\(
    message: 禁止 print()，必须用 logging.getLogger(__name__)
    severity: HIGH
    auto_fix: false
    category: logging
    exclude_files:
    - backend/launcher.py
    - backend/_verify_init.py
  - name: print_traceback_format_exc
    pattern: print\(traceback\.format_exc\(\)\)
    message: 禁止 print(traceback.format_exc())，应用 logger.exception() 或 logger.error(...,
      exc_info=True)
    severity: MEDIUM
    auto_fix: false
    category: logging
  - name: os_getenv_direct
    pattern: os\.getenv\(
    message: 禁止直接 os.getenv()，必须通过 settings（core/config.py）统一管理
    severity: MEDIUM
    auto_fix: false
    category: config_driven
    exclude_files:
    - backend/app/config.py
  - name: model_name_official_source
    pattern: deepseek-chat
    message: DeepSeek 预设默认模型应为 deepseek-v4-flash，模型名称须以官方文档为准
    severity: CRITICAL
    auto_fix: false
    category: model_name
  - name: pricing_table_sync
    pattern: MODEL_PRICING
    message: 新增模型名时必须同步更新 MODEL_PRICING 定价表
    severity: HIGH
    auto_fix: false
    category: pricing_sync
  - name: config_key_four_way
    pattern: CONFIG_KEY_MAP
    message: 前端表单字段名、路由模型字段名、数据库配置键、Settings 属性四者必须一致
    severity: HIGH
    auto_fix: false
    category: config_four_way
  - name: timezone_consistency
    pattern: datetime\.now\(timezone\.utc\)
    message: 跨模块时间判定必须使用同一时区源，禁止 ai_budget 用 UTC 而其他模块用本地时间
    severity: CRITICAL
    auto_fix: false
    category: timezone
    exceptions:
    - app/core/timeutil.py
  - name: cascade_cleanup_completeness
    pattern: (delete\(.*\)|db\.delete\(.*\))
    message: 删除主表记录时必须同步处理从表（material/crawler_dedup/script/review），避免孤儿记录锁死后续流程
    severity: CRITICAL
    auto_fix: false
    category: cascade_cleanup
  - name: zero_result_fallback
    pattern: if\s+\w+_count\s*==\s*0.*raise
    message: 查询返回 0 条不一定是错误，应先检查可用历史/回退资源再决定是否报错
    severity: HIGH
    auto_fix: false
    category: zero_result_fallback
  - name: dynamic_injection_not_hardcoded
    pattern: if\s+\w+\s+and\s+not\s+template_text
    message: 配置开关应直接控制后缀追加，不应依赖模板存在性判断（has_template 会绕过开关）
    severity: HIGH
    auto_fix: false
    category: dynamic_injection
  - name: selection_must_update_relation
    pattern: select\(Material\)
    message: 选题后必须 UPDATE material.workflow_id，否则详情页按 workflow_id 过滤查不到数据
    severity: HIGH
    auto_fix: false
    category: relation_update
  - name: blob_response_error_parsing
    pattern: responseType.*blob
    message: blob 请求错误分支 error.response.data 是 Blob，需 blob.text() 解析 JSON 获取真实 message
    severity: HIGH
    auto_fix: false
    category: blob_error
  - name: channel_level_config_override
    pattern: settings\.(BGM_VOLUME|SEGMENT_GAP_SEC|BGM_PATH)
    message: 业务参数应支持频道级覆盖（ch.xxx is not None 时覆盖 settings），不能只用全局 settings
    severity: HIGH
    auto_fix: false
    category: channel_override
  - name: cron_channel_level_trigger
    pattern: _cron_trigger
    message: 全局 cron 触发时必须为所有未配置独立定时的活跃频道各触发一个带 channel_id 的工作流
    severity: HIGH
    auto_fix: false
    category: cron_channel_trigger
  - name: ai_budget_timezone
    pattern: ai_budget.*timezone\.utc
    message: ai_budget 按"日"重置 token 用量必须用本地时间，UTC 会导致跨日额度累加错误
    severity: CRITICAL
    auto_fix: false
    category: ai_budget_timezone
  - name: crawler_dedup_orphan_cleanup
    pattern: _cleanup_crawler_dedup
    message: 定时清理任务除清理过期记录外，必须清理 url NOT IN material 的孤儿记录
    severity: HIGH
    auto_fix: false
    category: dedup_orphan
  - name: duration_range_dynamic
    pattern: _get_duration_range
    message: 音频时长校验范围应动态计算（target×0.80 到 target×1.20），禁止固定 ±15%
    severity: HIGH
    auto_fix: false
    category: duration_range
  - name: channel_field_migration_sync
    pattern: segment_gap_sec|enable_thinking_question
    message: Channel 模型新增字段必须 4 层同步：model → migration → service → router → frontend
    severity: HIGH
    auto_fix: false
    category: channel_field_sync
checklist:
  layering:
    enabled: true
    severity: HIGH
  naming:
    enabled: true
    severity: MEDIUM
  type_annotation:
    enabled: true
    severity: MEDIUM
  fastapi:
    enabled: true
    severity: HIGH
  sqlalchemy:
    enabled: true
    severity: HIGH
  async_concurrency:
    enabled: true
    severity: CRITICAL
  cache:
    enabled: true
    severity: HIGH
  security:
    enabled: true
    severity: CRITICAL
  error_handling:
    enabled: true
    severity: HIGH
  config_driven:
    enabled: true
    severity: MEDIUM
  workflow:
    enabled: true
    severity: CRITICAL
  field_contract:
    enabled: true
    severity: HIGH
  logging:
    enabled: true
    severity: MEDIUM
  performance:
    enabled: true
    severity: MEDIUM
  testability:
    enabled: true
    severity: LOW
report:
  output_dir: reports
  filename_template: '{date}_{time}_{mode}_report.md'
  date_format: YYYY-MM-DD
  time_format: HHmmss
  template_file: templates/report-template.md
  include_good_practices: true
  include_retrospective: true
  include_config_changes: true
  summary_top_n: 10
verify:
  steps:
  - name: py_compile
    command: python -m py_compile {file}
    description: 语法检查
    blocking: true
  - name: pytest
    command: pytest backend/tests/ -x --tb=short
    description: 运行测试套件
    blocking: true
  - name: auto_scan
    command: pwsh .trae/skills/news-backend-code-review/scripts/auto-scan.ps1
    description: 重新运行阻塞级扫描
    blocking: false
  test_timeout_sec: 300
  max_parallel_files: 5
project_conventions:
  tech_stack:
    framework: FastAPI
    orm: SQLAlchemy
    orm_version: '2.0'
    orm_style: async
    db_driver: aiosqlite
    cache: TTLCache
    scheduler: APScheduler
    http_client: httpx
    python_version: 3.11+
  orm:
    base_class: DeclarativeBase
    column_style: mapped_column
    session_class: AsyncSession
    time_default_func: utcnow_naive
  cache:
    redis:
      key_naming_pattern: 域:操作:参数
      atomic_script_required: true
      cache_aside_pattern: true
    ttlcache:
      default_ttl_sec: 300
      maxsize: 10000
  auth:
    jwt_algorithm: HS256
    token_compare_func: hmac.compare_digest
    password_hash: bcrypt
    blacklist_mechanism: true
  routing:
    api_prefix: /api
    admin_prefix: /api/admin
    internal_prefix: /api/internal
    internal_auth: verify_localhost
    response_wrapper: success/error
workflow_orchestration:
  scheduler:
    class_name: WorkflowScheduler
    singleton: true
    lock_mechanism: TTLCache
    lock_key: workflow:lock
    lock_ttl_sec: 1800
    require_lock_acquired_flag: true
  step_state_machine:
    states:
    - pending
    - running
    - success
    - failed
    transitions:
    - pending → running
    - running → success
    - running → failed
    require_independent_session: true
  retry:
    max_attempts: 3
    backoff: exponential
    require_alert_on_exhausted: true
    alert_channels:
    - wecom_webhook
    - sms
  backup_mechanism:
    enabled: true
    check_time: 06:30
    fallback_strategy: reuse_previous_day_audio
  pipeline:
  - crawl
  - rewrite
  - tts
  - stitch
  - review
  - publish
field_contract:
  naming:
    case_style: snake_case
    require_orm_api_consistency: true
  enum_serialization:
    require_value: true
    forbidden_object_return: true
  datetime_serialization:
    format: iso8601
    require_isoformat: true
  known_field_mappings:
    episode:
    - id
    - title
    - audio_url
    - duration_sec
    - publish_date
    - status
    - categories
    - source
    workflow:
    - id
    - episode_date
    - source
    - status
    - current_step
    - started_at
    - finished_at
    review:
    - id
    - workflow_id
    - status
    - reviewer
    - comment
    - created_at
coding_standards:
  type_annotation:
    max_any_count: 3
    min_return_annotation_ratio: 0.9
    forbidden_typing_imports:
    - Optional
    - List
    - Dict
    - Tuple
    - Set
  sqlalchemy:
    forbid_legacy_column: true
    forbid_sync_session: true
    required_time_default: utcnow_naive
  performance:
    require_pagination_limit: true
    detect_n_plus_one: true
    max_unbounded_query_rows: 100
    bulk_insert_threshold: 50
  error_handling:
    require_biz_error_base: true
    forbid_builtin_shadowing: true
    critical_path_patterns:
    - def _on_startup
    - def run_migrations
    - def _init_
    - def trigger_workflow
    - def publish_episode
model_name_and_pricing:
  enabled: true
  require_pricing_table_sync: true
  case_sensitive: true
  verified_models:
  - qwen-max
  - gpt-4o-mini
  - deepseek-v4-flash
  - glm-4-flash
  - moonshot-v1-8k
  - ernie-4.0-8k
  - doubao-pro-4k
  - qwen2.5:7b
  - Agnes-2.0-Flash
  require_new_model_in_pricing: true
config_key_four_way_consistency:
  enabled: true
  require_four_way_consistency: true
  allow_legacy_key_map: true
  require_four_way_sync_on_new_config: true
